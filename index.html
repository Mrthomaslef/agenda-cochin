<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cochin RI" />
  <meta name="application-name" content="Cochin RI" />
  <meta name="theme-color" content="#0B1120" />
  <link rel="manifest" href="manifest.json?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=2" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2" />
  <title>Cochin RI — Dr T. Lefèvre</title>
  <style>
    :root {
      --bg: #0B1120;
      --bg-card: #131C31;
      --bg-elevated: #1E293B;
      --border: rgba(148, 163, 184, 0.16);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #38BDF8;
      --primary-dark: #0284C7;
      --acte: #F43F5E;       /* Corail vif */
      --biopsie: #A855F7;    /* Violet Améthyste */
      --cs: #3B82F6;         /* Bleu Azur */
      --img: #14B8A6;        /* Turquoise */
      --mail-rdv: #F59E0B;   /* Ambre Doré */
      --perso-msg: #EC4899;  /* Rose Magenta */
      --garde: #EF4444;      /* Rouge Garde */
      --success: #22C55E;
      --warning: #F59E0B;
      --danger: #EF4444;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(146px + var(--safe-bottom));
    }

    /* Autoriser la sélection de texte dans les fiches patients et champs de recherche */
    input, textarea, .detail-value, .event-ipp {
      -webkit-user-select: text;
      user-select: text;
    }

    /* LOCK SCREEN */
    #lock-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at 50% 20%, #1E293B 0%, #0B1120 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #lock-screen.hidden { display: none; }
    .lock-card {
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .lock-logo {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      overflow: hidden;
      margin: 0 auto 14px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.4);
      background: #0B1120;
    }
    .lock-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .lock-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .lock-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 0 22px;
    }
    .pin-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 240px;
      margin: 0 auto;
    }
    .pin-kbd-input {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: 1.5px solid var(--primary);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 8px;
      text-align: center;
      outline: none;
      padding: 0 12px;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .pin-kbd-input::placeholder {
      font-size: 14px;
      letter-spacing: normal;
      font-weight: 500;
      color: var(--text-muted);
    }
    .pin-kbd-input:focus {
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.3);
    }
    .pin-submit-btn {
      height: 46px;
      border-radius: 12px;
      border: 1px solid var(--primary);
      background: var(--primary-dark);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .pin-submit-btn:active {
      transform: scale(0.97);
    }
    .lock-error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 14px;
      min-height: 20px;
    }

    /* COMPACT HEADER (OPTIMISÉ DYNAMIC ISLAND / MODE APP STANDALONE) */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 17, 32, 0.90);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: max(10px, calc(var(--safe-top) + 6px)) 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .brand-badge {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.25);
      flex-shrink: 0;
      background: #0B1120;
    }
    .brand-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .brand-text h1 {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.2px;
    }
    .brand-text p {
      font-size: 10px;
      color: var(--text-muted);
      margin: 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-icon {
      border: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.7);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 11.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }
    .sync-dot.loading {
      background: var(--warning);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* KPI BAR (DOCKED AT BOTTOM ABOVE MAIN NAV) */
    .kpi-strip {
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      width: 100%;
      max-width: 500px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 14px;
      padding: 4px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    .kpi-box {
      background: rgba(30, 41, 59, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 10px;
      padding: 4px 2px;
      text-align: center;
      cursor: pointer;
      min-width: 0;
      transition: all 0.15s ease;
    }
    .kpi-box.active {
      background: rgba(56, 189, 248, 0.20);
      border-color: var(--primary);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.35);
    }
    .kpi-val {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .kpi-lbl {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 1px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .kpi-box.active .kpi-lbl {
      color: #fff;
    }

    .main-content {
      padding: 8px 12px 24px;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }
    @media (min-width: 768px) {
      .main-content {
        max-width: 1180px;
        padding: 12px 20px 32px;
      }
    }

    /* CONTROLS STACK (NO HORIZONTAL OVERFLOW ON ANY MOBILE SCREEN) */
    .agenda-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      width: 100%;
    }
    @media (min-width: 640px) {
      .agenda-controls {
        flex-direction: row;
      }
      .agenda-controls > .segmented {
        flex: 1;
      }
    }
    .segmented {
      display: flex;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2px;
      gap: 2px;
    }
    .seg-btn {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 4px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
    }
    .seg-btn.active {
      background: var(--bg-elevated);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }
    .seg-btn.scope-active {
      background: linear-gradient(135deg, #0284C7, #4F46E5);
      color: #fff;
    }

    /* DATE NAV */
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 6px 8px;
      margin-bottom: 8px;
      gap: 8px;
    }
    .date-nav-center {
      text-align: center;
      cursor: pointer;
      min-width: 0;
      flex: 1;
    }
    .date-nav-title {
      font-size: 13.5px;
      font-weight: 700;
      text-transform: capitalize;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .date-nav-sub {
      font-size: 10.5px;
      color: #FDE68A;
      margin-top: 1px;
      display: none;
    }
    .nav-arrow {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* COMPACT GARDES STRIP */
    .garde-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 2px 0 8px;
      width: 100%;
    }
    .garde-strip::-webkit-scrollbar { display: none; }
    .garde-strip-lbl {
      font-size: 10px;
      font-weight: 700;
      color: #FCA5A5;
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 7px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.32);
      text-decoration: none;
      flex-shrink: 0;
    }
    .garde-chip {
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: rgba(19, 28, 49, 0.85);
      color: #FECACA;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 10.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }
    .garde-chip.active {
      background: #DC2626;
      color: #fff;
      border-color: #F87171;
    }

    /* VACATION CARDS & COLORED POST PILLS */
    .vac-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 10px;
    }
    .vac-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 8px 10px;
      min-width: 0;
    }
    .vac-period {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .post-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .post-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      max-width: 100%;
      overflow-wrap: break-word;
    }
    /* Varied color palette for hospital & private posts */
    .post-tdm-achard { background: rgba(6, 182, 212, 0.18); color: #67E8F9; border: 1px solid rgba(6, 182, 212, 0.40); }
    .post-gestes     { background: rgba(249, 115, 22, 0.20); color: #FDBA74; border: 1px solid rgba(249, 115, 22, 0.40); }
    .post-cs         { background: rgba(99, 102, 241, 0.20); color: #C7D2FE; border: 1px solid rgba(99, 102, 241, 0.40); }
    .post-echo       { background: rgba(16, 185, 129, 0.18); color: #6EE7B7; border: 1px solid rgba(16, 185, 129, 0.40); }
    .post-irm        { background: rgba(168, 85, 247, 0.20); color: #E9D5FF; border: 1px solid rgba(168, 85, 247, 0.40); }
    .post-sau        { background: rgba(56, 189, 248, 0.16); color: #BAE6FD; border: 1px solid rgba(56, 189, 248, 0.35); }
    .post-staff      { background: rgba(234, 179, 8, 0.18);  color: #FEF08A; border: 1px solid rgba(234, 179, 8, 0.40); }
    .post-liberal    { background: rgba(245, 158, 11, 0.24); color: #FDE68A; border: 1px solid rgba(245, 158, 11, 0.50); }
    .post-libre      { background: rgba(100, 116, 139, 0.14); color: #94A3B8; border: 1px dashed rgba(148, 163, 184, 0.28); }

    /* GARDE BANNER */
    .garde-banner {
      border-radius: 10px;
      padding: 7px 11px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border);
    }
    .garde-banner.is-me {
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.26), rgba(234, 88, 12, 0.20));
      border: 1.5px solid #EF4444;
      color: #FEE2E2;
      font-weight: 700;
    }

    /* EVENT CARDS — CLEAN & STREAMLINED */
    .section-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin: 8px 2px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3.5px solid var(--primary);
      border-radius: 11px;
      padding: 9px 11px;
      margin-bottom: 7px;
      cursor: pointer;
      width: 100%;
      overflow-wrap: break-word;
    }
    .event-card.type-acte     { border-left-color: var(--acte); background: linear-gradient(90deg, rgba(244,63,94,0.06) 0%, var(--bg-card) 35%); }
    .event-card.type-biopsie  { border-left-color: var(--biopsie); background: linear-gradient(90deg, rgba(168,85,247,0.06) 0%, var(--bg-card) 35%); }
    .event-card.type-cs       { border-left-color: var(--cs); background: linear-gradient(90deg, rgba(59,130,246,0.06) 0%, var(--bg-card) 35%); }
    .event-card.type-img      { border-left-color: var(--img); background: linear-gradient(90deg, rgba(20,184,166,0.06) 0%, var(--bg-card) 35%); }
    .event-card.type-mail-rdv { border-left-color: var(--mail-rdv); background: linear-gradient(90deg, rgba(245,158,11,0.10) 0%, var(--bg-card) 45%); }

    .event-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 3px;
    }
    .event-time-badge {
      font-size: 11px;
      font-weight: 700;
      color: #E2E8F0;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 5px;
    }
    .pill {
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .pill-acte     { background: rgba(244, 63, 94, 0.2); color: #FDA4AF; }
    .pill-biopsie  { background: rgba(168, 85, 247, 0.22); color: #D8B4FE; }
    .pill-cs       { background: rgba(59, 130, 246, 0.22); color: #93C5FD; }
    .pill-img      { background: rgba(20, 184, 166, 0.22); color: #5EEAD4; }
    .pill-mail-rdv { background: rgba(245, 158, 11, 0.25); color: #FDE68A; }
    .pill-live     { background: rgba(56, 189, 248, 0.2); color: #7DD3FC; }
    .pill-aphp     { background: rgba(168, 85, 247, 0.22); color: #D8B4FE; }
    .pill-success  { background: rgba(34, 197, 94, 0.2); color: #86EFAC; }
    .pill-danger   { background: rgba(239, 68, 68, 0.22); color: #FCA5A5; }
    .pill-warn     { background: rgba(245, 158, 11, 0.22); color: #FDE68A; }

    .event-patient {
      font-size: 14px;
      font-weight: 700;
      margin: 2px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .event-ipp {
      font-size: 10.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.1);
      padding: 1px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }
    .event-title {
      font-size: 12px;
      color: #CBD5E1;
      font-weight: 500;
    }
    .event-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .doc-tag {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 5px;
      font-weight: 600;
      font-size: 10.5px;
      background: rgba(148, 163, 184, 0.12);
      color: #E2E8F0;
    }
    .doc-tag.is-tl {
      background: rgba(56, 189, 248, 0.16);
      color: #7DD3FC;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .alert-anticoag {
      margin-top: 6px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
      font-size: 10.5px;
      font-weight: 600;
    }

    /* WEEK VIEW */
    .week-day-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px 10px;
      margin-bottom: 8px;
    }
    .week-day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .week-day-name {
      font-size: 13px;
      font-weight: 700;
      text-transform: capitalize;
    }

    /* MONTH VIEW */
    .month-grid-header {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }
    .month-cell {
      min-height: 60px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      min-width: 0;
    }
    .month-cell.other-month { opacity: 0.32; }
    .month-cell.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }
    .month-cell.is-tl-garde {
      border-color: #EF4444 !important;
      background: rgba(239, 68, 68, 0.16) !important;
    }
    .month-cell-top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .month-day-num {
      font-size: 11px;
      font-weight: 700;
    }
    .month-desk-cnt {
      display: none;
    }
    .month-desk-vacs {
      display: none;
    }
    .month-desk-evs {
      display: none;
    }
    .month-vac-tag {
      font-size: 7.5px;
      font-weight: 700;
      border-radius: 4px;
      padding: 1px 2px;
      margin-top: 2px;
      text-align: center;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .month-dots {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: auto;
      padding-top: 2px;
    }
    .m-dot {
      width: 4.5px;
      height: 4.5px;
      border-radius: 50%;
    }
    .m-dot.acte     { background: var(--acte); }
    .m-dot.biopsie  { background: var(--biopsie); }
    .m-dot.cs       { background: var(--cs); }
    .m-dot.img      { background: var(--img); }
    .m-dot.mail-rdv { background: var(--mail-rdv); }

    @media (min-width: 768px) {
      .month-grid {
        gap: 6px;
      }
      .month-cell {
        min-height: 122px;
        padding: 6px 7px;
        border-radius: 10px;
        align-items: stretch;
        justify-content: flex-start;
        gap: 4px;
      }
      .month-cell:hover {
        border-color: rgba(56, 189, 248, 0.5);
        background: rgba(30, 41, 59, 0.85);
      }
      .month-cell-top {
        justify-content: space-between;
      }
      .month-day-num {
        font-size: 13px;
        font-weight: 800;
      }
      .month-vac-tag,
      .month-dots {
        display: none !important;
      }
      .month-desk-cnt {
        display: inline-block;
        font-size: 9.5px;
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.16);
        color: #7DD3FC;
      }
      .month-desk-vacs {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-bottom: 3px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      }
      .month-desk-vac-line {
        font-size: 9.5px;
        font-weight: 600;
        line-height: 1.2;
        padding: 2px 5px;
        border-radius: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .month-desk-evs {
        display: flex;
        flex-direction: column;
        gap: 2.5px;
        margin-top: 1px;
      }
      .month-desk-ev {
        font-size: 9.5px;
        line-height: 1.2;
        padding: 2px 5px;
        border-radius: 4px;
        background: rgba(15, 23, 42, 0.72);
        border-left: 2.5px solid var(--primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #E2E8F0;
      }
      .month-desk-ev.type-acte     { border-left-color: var(--acte); background: rgba(244, 63, 94, 0.12); }
      .month-desk-ev.type-biopsie  { border-left-color: var(--biopsie); background: rgba(168, 85, 247, 0.12); }
      .month-desk-ev.type-cs       { border-left-color: var(--cs); background: rgba(59, 130, 246, 0.12); }
      .month-desk-ev.type-img      { border-left-color: var(--img); background: rgba(20, 184, 166, 0.12); }
      .month-desk-ev.type-mail-rdv { border-left-color: var(--mail-rdv); background: rgba(245, 158, 11, 0.14); }
      .month-desk-more {
        font-size: 9px;
        font-weight: 700;
        color: var(--primary);
        text-align: right;
        padding-right: 2px;
      }
    }

    /* SEARCH & CHIPS */
    .search-box {
      position: relative;
      margin-bottom: 8px;
    }
    .search-input {
      width: 100%;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      padding: 0 12px 0 32px;
      font-size: 13px;
      outline: none;
    }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text-muted);
    }
    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      margin-bottom: 8px;
      scrollbar-width: none;
      width: 100%;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chip.active {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary);
    }

    /* SCROLLABLE DAYS BAR (BARRE DES JOURS DÉFILABLE) */
    .day-strip-scroll {
      position: relative;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0 8px;
      margin-bottom: 4px;
      scrollbar-width: none;
      width: 100%;
    }
    .day-strip-scroll::-webkit-scrollbar { display: none; }
    .ws-day {
      flex: 0 0 calc((100% - 24px) * 0.156);
      min-width: 48px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 6px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    .ws-day.is-weekend {
      flex: 0 0 calc((100% - 24px) * 0.11);
      min-width: 34px;
      padding: 6px 1px;
      opacity: 0.88;
    }
    .ws-day.is-weekend .ws-dow {
      font-size: 8px;
    }
    .ws-day.is-weekend .ws-num {
      font-size: 11.5px;
    }
    .ws-day.is-weekend .ws-mon {
      display: none;
    }
    .ws-day.is-weekend .ws-vac {
      font-size: 7px;
      padding: 1px 2px;
      max-width: 32px;
    }
    .ws-day.active {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.16);
      box-shadow: 0 0 0 1px var(--primary);
    }
    .ws-day.is-garde {
      border-color: #EF4444;
      background: rgba(239, 68, 68, 0.14);
    }
    .ws-dow {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .ws-num {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
      white-space: nowrap;
    }
    .ws-mon {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      margin-left: 1px;
    }
    .ws-day.active .ws-mon {
      color: var(--primary);
    }
    .ws-month-sep {
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 7px;
      padding: 4px 3px;
      flex-shrink: 0;
      user-select: none;
    }
    .day-strip-month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--primary);
      text-transform: capitalize;
      padding: 0 4px 3px;
      letter-spacing: 0.02em;
    }
    .ws-vac {
      font-size: 7.5px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 4px;
      max-width: 50px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ws-cnt {
      font-size: 8px;
      font-weight: 700;
      color: var(--primary);
    }

    /* SELECTEUR DE SEMAINES (CARTES RÉSUMÉES EN MODE SEMAINE) */
    .weeks-selector-row {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 2px 8px;
      margin-bottom: 6px;
      scrollbar-width: none;
      width: 100%;
    }
    .weeks-selector-row::-webkit-scrollbar { display: none; }
    .week-sel-card {
      min-width: 118px;
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .week-sel-card.active {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.14);
      box-shadow: 0 0 0 1px var(--primary);
    }
    .week-sel-card.has-garde {
      border-color: rgba(239, 68, 68, 0.65);
    }
    .wsc-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wsc-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }
    .wsc-tag {
      font-size: 8.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 5px;
      white-space: nowrap;
    }
    .week-group-header {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
      border-left: 3px solid var(--primary);
      border-radius: 9px;
      padding: 6px 11px;
      margin: 12px 0 7px;
      font-size: 11px;
      font-weight: 700;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* MODERN FLOATING BOTTOM DOCK (KPI STRIP + 3 MAIN PAGES) */
    .bottom-nav-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      padding: 0 10px calc(6px + var(--safe-bottom));
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .bottom-nav {
      pointer-events: auto;
      width: 100%;
      max-width: 500px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      padding: 4px;
      gap: 4px;
    }
    .nav-item {
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      border-radius: 13px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }
    .nav-item svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-item.active {
      color: #fff;
      background: rgba(56, 189, 248, 0.18);
    }
    .nav-item.active svg {
      stroke: var(--primary);
    }
    .nav-badge {
      position: absolute;
      top: 2px;
      right: 22%;
      background: var(--primary-dark);
      color: #fff;
      font-size: 8.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 999px;
      line-height: 1.1;
    }

    /* BLOC / SUIVI OPÉRATOIRE (MATÉRIEL UTILISÉ & REMARQUES) */
    .bloc-toggle-row {
      margin-top: 7px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 6px;
    }
    .bloc-toggle-btn {
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(15, 23, 42, 0.8);
      color: #BAE6FD;
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 10.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .bloc-toggle-btn.cr-btn {
      border-color: rgba(148, 163, 184, 0.3);
      background: rgba(30, 41, 59, 0.75);
      color: #CBD5E1;
    }
    .bloc-toggle-btn.cr-primary {
      border-color: rgba(99, 102, 241, 0.55);
      background: rgba(99, 102, 241, 0.18);
      color: #C7D2FE;
    }
    .bloc-toggle-btn.copied {
      border-color: rgba(34, 197, 94, 0.65) !important;
      background: rgba(20, 83, 45, 0.45) !important;
      color: #86EFAC !important;
    }
    .bloc-toggle-btn.has-saved {
      border-color: rgba(34, 197, 94, 0.45);
      background: rgba(20, 83, 45, 0.25);
      color: #86EFAC;
    }
    .bloc-toggle-btn:active {
      transform: scale(0.97);
    }
    .bloc-notes-box {
      margin-top: 6px;
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.32);
      border-radius: 9px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    .bloc-notes-box.open {
      display: flex;
    }
    .bloc-notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .bloc-field-lbl {
      font-size: 10px;
      font-weight: 700;
      color: #94A3B8;
      margin-bottom: 2px;
      display: block;
    }
    .bloc-input {
      width: 100%;
      background: rgba(19, 28, 49, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 7px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      padding: 6px 8px;
      outline: none;
      resize: vertical;
    }
    .bloc-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.3);
    }
    .bloc-save-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }
    .bloc-save-status {
      font-size: 10.5px;
      color: #86EFAC;
      font-weight: 600;
    }
    .bloc-save-btn {
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(2, 132, 199, 0.28);
      color: #E0F2FE;
      border-radius: 7px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .bloc-save-btn:active {
      transform: scale(0.96);
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      width: 100%;
      max-width: 640px;
      max-height: 88vh;
      background: #111827;
      border-top: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      padding: 14px 16px calc(22px + var(--safe-bottom));
      overflow-y: auto;
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.35);
      margin: 0 auto 12px;
    }
    .detail-block {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .detail-label {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .detail-value {
      font-size: 13px;
      line-height: 1.4;
    }
    .quick-actions {
      display: flex;
      gap: 8px;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .action-btn {
      flex: 1;
      min-width: 100px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      cursor: pointer;
    }
    .action-btn.primary {
      background: var(--primary-dark);
      border-color: var(--primary);
      color: #fff;
    }
    .empty-state {
      text-align: center;
      padding: 18px 12px;
      color: var(--text-muted);
      font-size: 12px;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 11px;
    }

    /* PULL-TO-REFRESH (UNIQUEMENT LA FLÈCHE QUI TOURNE) */
    .ptr-indicator {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 50%;
      transform: translate(-50%, -70px);
      z-index: 260;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
    }
    .ptr-indicator.pulling {
      transition: none;
    }
    .ptr-spinner {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.45);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }
    @keyframes ptrSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .ptr-indicator.refreshing #ptr-svg,
    .btn-sync-arrow.spinning svg {
      animation: ptrSpin 0.7s linear infinite;
    }
  </style>
</head>
<body>

  <!-- PULL TO REFRESH ARROW -->
  <div id="ptr-indicator" class="ptr-indicator" aria-hidden="true">
    <div class="ptr-spinner">
      <svg id="ptr-svg" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
        <polyline points="21 3 21 9 15 9"/>
      </svg>
    </div>
  </div>

  <!-- PIN LOCK -->
  <div id="lock-screen">
    <div class="lock-card">
      <div class="lock-logo"><img src="apple-touch-icon.png?v=2" alt="Cochin RI" /></div>
      <h2 class="lock-title">Cochin Radiologie B</h2>
      <p class="lock-sub">Dr Thomas Lefèvre</p>
      <form class="pin-form" onsubmit="submitPinForm(event)">
        <input
          type="password"
          id="pin-kbd-input"
          class="pin-kbd-input"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="4"
          placeholder="Code à 4 chiffres"
          autocomplete="off"
          autofocus
          oninput="onPinInputChange(this)"
        />
        <button type="submit" class="pin-submit-btn">Déverrouiller</button>
      </form>
      <div class="lock-error" id="lock-error"></div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-badge"><img src="apple-touch-icon.png?v=2" alt="Cochin RI" /></div>
      <div class="brand-text">
        <h1>Cochin Radio B</h1>
        <p id="sync-status-text">Synchronisé</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="goToday()">Auj.</button>
      <button class="btn-icon btn-sync-arrow" id="btn-sync-arrow" onclick="syncFromCloud(true)" aria-label="Actualiser">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main-content">

    <!-- TAB 1 : AGENDA -->
    <section id="tab-agenda">
      <div class="agenda-controls">
        <div class="segmented">
          <button class="seg-btn scope-active" id="scope-btn-mine" onclick="setAgendaScope('mine')">Mon agenda (TL)</button>
          <button class="seg-btn" id="scope-btn-all" onclick="setAgendaScope('all')">Service</button>
        </div>
        <div class="segmented">
          <button class="seg-btn active" id="view-btn-day" onclick="setCalendarView('day')">Jour</button>
          <button class="seg-btn" id="view-btn-week" onclick="setCalendarView('week')">Semaine</button>
          <button class="seg-btn" id="view-btn-month" onclick="setCalendarView('month')">Mois</button>
        </div>
      </div>

      <div class="date-nav">
        <button class="nav-arrow" onclick="navigatePeriod(-1)">‹</button>
        <div class="date-nav-center" onclick="goToday()">
          <div class="date-nav-title" id="period-title">Lundi 2 Novembre 2026</div>
          <div class="date-nav-sub" id="period-sub"></div>
        </div>
        <button class="nav-arrow" onclick="navigatePeriod(1)">›</button>
      </div>

      <!-- Barre défilable des jours (mode Jour) ou des semaines (mode Semaine) -->
      <div id="week-strip-container"></div>

      <div class="garde-strip" id="my-gardes-strip"></div>

      <div id="calendar-container"></div>
    </section>

    <!-- TAB 2 : ACTIVITÉ FUSIONNÉE (ACTES & CONSULTATIONS) -->
    <section id="tab-activite" style="display:none;">
      <div class="agenda-controls">
        <div class="segmented">
          <button class="seg-btn scope-active" id="act-scope-mine" onclick="setActiviteScope('mine')">Mes patients (TL)</button>
          <button class="seg-btn" id="act-scope-all" onclick="setActiviteScope('all')">Tout le service</button>
        </div>
        <div class="segmented" id="activite-mode-bar">

        const htmlRefreshPromise = fetch("./index.html?_t=" + Date.now(), { cache: "no-store" })
          .then(r => r.ok ? r.text() : null)
          .then(async htmlTxt => {
            if (!htmlTxt) return;
            const buildMatch = htmlTxt.match(/\/\*__APP_BUILD_ID:(v\d+)__\*\//);
            if (buildMatch && buildMatch[1] && buildMatch[1] !== CURRENT_BUILD_ID) {
              if ("caches" in window) {
                try {

                  await Promise.all(keys.map(k => caches.delete(k)));

              window.location.reload();
              return;

            const rdvMatch = htmlTxt.match(/\/\*__START_PERSONAL_RDVS__\*\/([\s\S]*?)\/\*__END_PERSONAL_RDVS__\*\//);

              try {

                if (Array.isArray(parsedRdvs)) PERSONAL_MAIL_RDVS = parsedRdvs;
              } catch (_) {}
            }
            const qMatch = htmlTxt.match(/\/\*__START_QUESTIONS_PERSO__\*\/([\s\S]*?)\/\*__END_QUESTIONS_PERSO__\*\//);

              try {
                const parsedQs = (new Function("return " + qMatch[1]))();

            ptrEl.style.opacity = "0";

    function initPullToRefresh() {
      let startY = 0;
      let startX = 0;
      let pulling = false;
      let pullDist = 0;
      const ptrEl = document.getElementById("ptr-indicator");
      const ptrSvg = document.getElementById("ptr-svg");

      document.addEventListener("touchstart", (e) => {
        if (isSyncingNow) return;
        if (window.scrollY > 2) return;
        const modal = document.getElementById("patient-modal");
        if (modal && modal.classList.contains("open")) return;
        const lock = document.getElementById("lock-screen");
        if (lock && !lock.classList.contains("hidden")) return;
        startY = e.touches[0].clientY;
        startX = e.touches[0].clientX;
        pulling = true;
        pullDist = 0;
      }, { passive: true });

      document.addEventListener("touchmove", (e) => {
        if (!pulling || isSyncingNow) return;
        const dy = e.touches[0].clientY - startY;
        const dx = e.touches[0].clientX - startX;
        if (dy <= 0 || Math.abs(dx) > dy * 0.85 || window.scrollY > 2) {
          if (pullDist > 0 && ptrEl) {
            ptrEl.classList.remove("pulling");
            ptrEl.style.opacity = "0";
            ptrEl.style.transform = "translate(-50%, -70px)";
          }
          pulling = false;
          pullDist = 0;
          return;
        }
        pullDist = Math.min(dy * 0.48, 68);
        if (pullDist > 6 && ptrEl && ptrSvg) {
          ptrEl.classList.add("pulling");
          const progress = Math.min(1, pullDist / 48);
          ptrEl.style.opacity = String(progress);
          ptrEl.style.transform = `translate(-50%, ${pullDist - 56}px)`;
          ptrSvg.style.transform = `rotate(${pullDist * 4.5}deg)`;
        }
      }, { passive: true });

      document.addEventListener("touchend", () => {
        if (!pulling || isSyncingNow) return;
        pulling = false;
        if (pullDist >= 48) {
          syncFromCloud(true);
        } else if (ptrEl) {
          ptrEl.classList.remove("pulling");
          ptrEl.style.opacity = "0";
          ptrEl.style.transform = "translate(-50%, -70px)";
        }
        pullDist = 0;
      }, { passive: true });

      // Garantir le défilement vertical et horizontal à la molette de souris sur tous les navigateurs / WebViews
      window.addEventListener("wheel", (e) => {
        if (e.ctrlKey || e.metaKey) return;
        const dy = e.deltaY || 0;
        const dx = e.deltaX || 0;
        if (!dy && !dx) return;

        // 1. Si la modale patient est ouverte, défiler l'intérieur de la modale
        const modal = document.getElementById("patient-modal");
        if (modal && modal.classList.contains("open")) {
          const sheet = modal.querySelector(".modal-sheet");
          if (sheet && dy) {
            const before = sheet.scrollTop;
            requestAnimationFrame(() => {
              if (sheet.scrollTop === before) sheet.scrollTop += dy;
            });
          }
          return;
        }

        // 2. Si le curseur survole une barre horizontale (barre des jours, semaines, gardes, filtres), la molette fait défiler la barre horizontalement
        const horiz = e.target && e.target.closest
          ? e.target.closest("#day-strip-scroll, #weeks-selector-scroll, .garde-strip, .chips-row")
          : null;
        if (horiz && horiz.scrollWidth > horiz.clientWidth && Math.abs(dy) > Math.abs(dx)) {
          horiz.scrollLeft += dy;
          if (horiz.id === "day-strip-scroll") updateDayStripVisibleMonth();
          e.preventDefault();
          return;
        }

        // 3. Défilement vertical de la page
        if (dy) {
          const scEl = document.scrollingElement || document.documentElement;
          const beforeY = window.scrollY || scEl.scrollTop || 0;
          requestAnimationFrame(() => {
            const afterY = window.scrollY || scEl.scrollTop || 0;
            if (afterY === beforeY) {
              scEl.scrollTop += dy;
              if ((window.scrollY || scEl.scrollTop || 0) === beforeY) {
                document.body.scrollTop += dy;
              }
            }
          });
        }
      }, { passive: false });
    }

      const scsEl = document.getElementById((prefix || "") + "scs-" + suiviKey);
      const statusEl = document.getElementById((prefix || "") + "status-" + suiviKey);
      if (!matEl && !remEl && !anaEl && !scsEl) return;
      const materiel = matEl ? matEl.value.trim() : "";
      const remarques = remEl ? remEl.value.trim() : "";
      const anapath = anaEl ? anaEl.value.trim() : "";
      const suivi_cs = scsEl ? scsEl.value.trim() : "";
      let meta = {};
      try {
        meta = JSON.parse(decodeURIComponent(encodedMeta));
      } catch (e) {}

      const entry = {
        suivi_key: suiviKey,
        row: meta.row || 0,
        patient_name: meta.patient || "",
        ipp: meta.ipp || "",
        iso_date: meta.isoDate || "",
        category: meta.category || "",
        title: meta.title || "",
        materiel,
        remarques,
        anapath,
        suivi_cs,
        updated_at: new Date().toISOString()
      };
      const patNorm = normName(meta.patient);
      if (patNorm) {
        for (const vMap of Object.values(suiviBlocMap)) {
          if (vMap && normName(vMap.patient_name) === patNorm) {
            vMap.materiel = materiel;
            vMap.remarques = remarques;
            vMap.anapath = anapath;
            vMap.suivi_cs = suivi_cs;
            vMap.updated_at = entry.updated_at;
          }
        }
      }
      suiviBlocMap[suiviKey] = entry;
      try {
        localStorage.setItem(STORAGE_SUIVI_KEY, JSON.stringify(suiviBlocMap));
      } catch (e) {}

      // Mettre à jour en mémoire dans appData.actes, appData.Biopsies et appData.Consultations pour ce patient
      if (patNorm) {
        for (const r of (appData.actes || [])) {
          if ((meta.category === "acte" && meta.row && r._row === meta.row) || normName(r["Identité Patient"]) === patNorm) {
            r["Matériel utilisé"] = materiel;
            r["Remarques (Bloc)"] = remarques;
            r["Suivi (CS de suivi)"] = suivi_cs;
          }
        }
        for (const r of (appData.Biopsies || [])) {
          if ((meta.category === "biopsie" && meta.row && r._row === meta.row) || normName(r["Identité Patient"]) === patNorm) {
            r["Matériel utilisé"] = materiel;
            r["Remarques (Bloc)"] = remarques;
            r["Anatomopathologie"] = anapath;
            r["Suivi (CS de suivi)"] = suivi_cs;
          }
        }
        for (const r of (appData.Consultations || [])) {
          if ((meta.category === "cs" && meta.row && r._row === meta.row) || normName(r["Identité Patient"]) === patNorm) {
            r["Remarques de suivi"] = suivi_cs;
          }
        }
      }

      const hasAny = Boolean(materiel || remarques || anapath || suivi_cs);
      const boxDomId = (prefix || "") + "box-" + suiviKey;
      const btnEl = document.getElementById("btn-" + boxDomId);
      const badgeEl = document.getElementById((prefix || "") + "btnbadge-" + suiviKey);
      if (btnEl) btnEl.classList.toggle("has-saved", hasAny);
      if (badgeEl) badgeEl.textContent = hasAny ? "✓" : "";

      if (closeAfter) {
        const boxEl = document.getElementById(boxDomId);
        const chevEl = document.getElementById("chev-" + boxDomId);
        if (boxEl) boxEl.classList.remove("open");
        if (chevEl) chevEl.textContent = "▸";
        openBlocNoteIds.delete(boxDomId);
      }

      if (statusEl) {
        statusEl.textContent = "⏳ Sync GSheet...";
      }
      updateKpis();

      const savedPin = localStorage.getItem(STORAGE_PIN_KEY);
      if (!savedPin) return;
      try {
        const resp = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-agenda-pin": savedPin },
          body: JSON.stringify({
            pin: savedPin,
            action: "save_suivi",
            ...entry
          })
        });
        if (resp.ok && statusEl) {
          statusEl.textContent = "✓ GSheet synchronisé";
        }
      } catch (e) {
        if (statusEl) statusEl.textContent = "✓ Sauvegardé (local)";
      }
    }

    function cleanTimedRows(rows) {
      return (rows || []).filter(r => {
        const pat = String(r["Identité Patient"] || "").trim();
        const dt = String(r["Date"] || "").trim();
        if (!pat || dt.includes("SEMAINE")) return false;
        return true;
      });

    function normalizeDataRows(rows) {
      return (rows || []).map(r => {
        if (r["Identité Patient"]) return r;
        // Fallback si l'ancien cache avait utilisé la ligne 8 comme clés
        const keys = Object.keys(r).filter(k => k !== "_row");
        if (keys.length >= 9) {
          return {
            _row: r._row,
            "Médecin correspondant": r[keys[0]],
            "Identité Patient": r[keys[1]],
            "N° Dossier / IPP": r[keys[2]],
            "Coordonnées / DDN": r[keys[3]],
            "Type d'Intervention / Suivi": r[keys[4]],
            "Échéance / Rendez-vous": r[keys[5]],
            "Médecin Référent": r[keys[6]],
            "Statut": r[keys[7]],
            "Instructions & Remarques Cliniques": r[keys[8]]
          };
        }
        return r;
      }).filter(r => String(r["Identité Patient"] || "").trim() !== "");
    }

      if (!dStr) return null;
      const m = String(dStr).trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (!m) return null;
      return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    }

    function dateToIso(d) {

    // Règle d'attribution en 2 niveaux :
    // 1. Priorité 1 (Mail explicite) : Si un mail désigne clairement le médecin opérateur/consultant (ex: "avec MP" = Dr TALABARD Marie-Pauline, "avec Thomas" / "@LEFEVRE Thomas Jean" = Dr LEFEVRE Thomas Jean, "avec Macil" = Dr HAMADOUCHE Macil), on privilégie ce médecin.
    // 2. Priorité 2 (Planning d'Anne-Marie V3 + Maquette) : Si le mail ne désigne pas clairement l'opérateur/consultant, on détermine le médecin via le planning d'Anne-Marie sur le poste correspondant (et si TL est au poste -> isMine = true de facto).
    function resolveEventWithPlanning(rawMedecin, title, lieu, isoDate, horaire, category, instructions, patientName) {
      const tLow = String(title || "").toLowerCase();
      const lLow = String(lieu || "").toLowerCase();
      const mRaw = String(rawMedecin || "").trim();
      const mLow = mRaw.toLowerCase();
      const remLow = String(instructions || "").toLowerCase();
      const pKey = `${isoDate || ""}|${normName(patientName)}|${category}`;

      if (EXPLICIT_EMAIL_DOC_BY_KEY[pKey]) {
        return EXPLICIT_EMAIL_DOC_BY_KEY[pKey];
      }

      // 1. Consultations d'anesthésie -> Médecin Anesthésiste
      if ((tLow.includes("anesthésie") || lLow.includes("anesth") || mLow.includes("anesth")) && !tLow.includes("arthroscanner") && !tLow.includes("écho") && !tLow.includes("echo")) {
        return { medecin: "Médecin Anesthésiste", isMine: false };
      }

      // 2. Dates non planifiées ou avant la prise de poste du 02/11/2026
      if (!isoDate) {
        const isMe = mLow.includes("lefevre") || mLow.includes("lefèvre") || /\btl\b/.test(mLow);
        return { medecin: mRaw || "À planifier", isMine: isMe };
      }
      const [y, m, d] = isoDate.split("-").map(Number);
      const dt = new Date(y, m - 1, d, 12, 0, 0);
      if (dt < new Date(2026, 10, 2)) {
        return { medecin: mRaw || "Service Radio B", isMine: false };
      }

      const myV = getMyVacationForIso(isoDate);

      // Ignorer l'ancienne mention générique "(Consultation RI)" si elle provient d'un cache antérieur
      const isGenericOldTag = mRaw === "Dr LEFEVRE Thomas Jean (Consultation RI)" || mRaw === "Dr LEFEVRE Thomas Jean / Internes (Consultation RI)";
      const cleanMRaw = isGenericOldTag ? "" : mRaw;
      const cleanMLow = cleanMRaw.toLowerCase();

      // 3. PRIORITÉ 1 : Si le médecin opérateur/consultant est clairement désigné (MP = Marie-Pauline Talabard, TL = Thomas Lefèvre, MH = Macil Hamadouche, etc.)
      const hasExplicitTL = cleanMLow.includes("lefevre") || cleanMLow.includes("lefèvre") || /\btl\b/.test(cleanMLow) || /avec\s+thomas|dr\s+lefevre|t\.\s*lefevre/i.test(remLow);
      const hasExplicitMP = cleanMLow.includes("talabard") || /\bmp\b|\bmpt\b/.test(cleanMLow) || /avec\s+mp\b|dr\s+talabard/i.test(remLow);
      const hasOtherExplicitDoc = /hamadouche|\bmh\b|monnier|\bhm\b|laporte|\bal\b|lusi|\bsl\b|allel|\bya\b|costea|\bac\b|feydy|drap[eé]|moutounet|yang|mihoubi|seror|rubini|th[eé]venin/i.test(cleanMLow);

      if (hasExplicitMP && !hasExplicitTL) {
        return {
          medecin: cleanMRaw.includes("TALABARD") ? cleanMRaw : "Dr TALABARD Marie-Pauline (MP)",
          isMine: false
        };
      }

      if (hasOtherExplicitDoc && !hasExplicitTL) {
        return {
          medecin: cleanMRaw,
          isMine: false
        };
      }

      if (hasExplicitTL && !myV.offCochin) {
        return {
          medecin: cleanMRaw || "Dr LEFEVRE Thomas Jean (TL)",
          isMine: true
        };
      }

      // 4. PRIORITÉ 2 : Sinon, on détermine le médecin via le planning d'Anne-Marie (Planning Novembre 2026 V3 + Maquette)
      const genPlan = getGeneralPlanningForIso(isoDate);
      const mins = parseMinutes(horaire);
      const isPm = (mins >= 13 * 60 && mins < 23 * 60);
      const halfDaySlots = isPm ? (genPlan.pm || []) : (genPlan.am || []);
      const otherHalfSlots = isPm ? (genPlan.am || []) : (genPlan.pm || []);

      let targetPostType = "TDM ACHARD 1";
      let displayPostShort = "TDM Achard 1";
      if (tLow.includes("arthroscanner") || lLow.includes("geste") || tLow.includes("scopie")) {
        targetPostType = "GESTES";
        displayPostShort = "Gestes";
      } else if (tLow.includes("écho") || tLow.includes("echo") || lLow.includes("écho") || lLow.includes("echo")) {
        targetPostType = "ECHO";
        displayPostShort = "Écho";
      } else if (tLow.includes("allura") || lLow.includes("allura") || tLow.includes("embolisation") || tLow.includes("artério")) {
        targetPostType = "ALLURA";
        displayPostShort = "Allura";
      } else if (category === "img" && (tLow.includes("irm") || lLow.includes("irm"))) {
        targetPostType = "IRM";
        displayPostShort = "IRM";
      } else if (category === "cs") {
        targetPostType = "CONSULTATION";
        displayPostShort = "Consultation";
      } else {
        targetPostType = "TDM ACHARD 1";
        displayPostShort = "TDM Achard 1";
      }

      function findMatchingDocs(slots, postType) {
        return slots.filter(s => {
          const p = String(s.poste || "").toUpperCase();
          const dc = String(s.doc || "").toUpperCase();
          if (!dc || dc === "FERME" || dc === "FERIE" || dc === "MAINTENANCE") return false;
          if (postType === "ECHO") return p.includes("ECHO");
          if (postType === "GESTES") return p.includes("GESTES");
          if (postType === "ALLURA") return p.includes("ALLURA");
          if (postType === "IRM") return p.includes("IRM");
          if (postType === "CONSULTATION") return p.includes("CONSULTATION");
          if (postType === "TDM ACHARD 1") return p.includes("ACHARD");
          return false;
        });
      }

      let matchedSlots = findMatchingDocs(halfDaySlots, targetPostType);
      if (targetPostType === "CONSULTATION" && matchedSlots.length === 0) {
        matchedSlots = findMatchingDocs(otherHalfSlots, "CONSULTATION");
      }

      if (matchedSlots.length > 0) {
        const rawCodes = matchedSlots.map(s => s.doc).join(" / ");
        const hasTL = /\bTL\b/i.test(rawCodes) && !myV.offCochin;
        if (hasTL) {
          return {
            medecin: `Dr LEFEVRE Thomas Jean (TL) (${displayPostShort})`,
            isMine: true
          };
        } else {
          const expandedNames = matchedSlots.map(s => expandDocString(s.doc)).join(" / ");
          return {
            medecin: `${expandedNames} (${displayPostShort})`,
            isMine: false
          };
        }
      }

      if (myV.offCochin) {
        return { medecin: cleanMRaw || "Service Radio B", isMine: false };
      }
      return { medecin: cleanMRaw || "Service Radio B", isMine: hasExplicitTL };
    }

    function filterEventsByScope(events) {
      if (agendaScope === "all") return events;
      return events.filter(e => e.isMine);
    }

    function parseMinutes(h) {
      const m = String(h || "").match(/(\d{1,2})\s*[h:]\s*(\d{0,2})/i);
      if (!m) return 9999;
      return parseInt(m[1], 10) * 60 + (m[2] ? parseInt(m[2], 10) : 0);
    }

    function normName(s) {
      return String(s || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\b(mr|mme|mlle|m\.|dr|pr)\b/g, "")
        .replace(/[^a-z0-9]/g, "");
    }

    function findPatientMasterRecord(patientName, ipp) {
      const cleanIpp = String(ipp || "").replace(/[^0-9]/g, "");
      const nTarget = normName(patientName);
      for (const row of appData.Data) {
        const rIpp = String(row["N° Dossier / IPP"] || "").replace(/[^0-9]/g, "");
        const rName = normName(row["Identité Patient"]);
        if (cleanIpp && cleanIpp.length >= 7 && cleanIpp === rIpp) return row;
        if (nTarget && rName && (nTarget === rName || (nTarget.length >= 7 && rName.includes(nTarget)) || (rName.length >= 7 && nTarget.includes(rName)))) {
          return row;
        }
      }
      return null;
    }

    function detectAnticoagAlert(text) {
      const t = String(text || "");
      if (/eliquis|apixaban|plavix|clopidogrel|kard[eé]gic|xarelto|pradaxa|anticoag|h[eé]mostase/i.test(t)) {
        return t;
      }
      return null;
    }

    function formatShortDoc(medStr) {
      const s = String(medStr || "");
      if (!s) return "";
      const codes = [];
      if (/lefevre|lefèvre|tl/i.test(s)) codes.push("TL");
      if (/talabard|mp|mpt/i.test(s)) codes.push("MP");
      if (/monnier|hm/i.test(s)) codes.push("HM");
      if (/hamadouche|mh/i.test(s)) codes.push("MH");
      if (/laporte|al/i.test(s)) codes.push("AL");
      if (/costea|ac/i.test(s)) codes.push("AC");
      if (/lusi|sl/i.test(s)) codes.push("SL");
      if (/allel|ya/i.test(s)) codes.push("YA");
      if (/feydy/i.test(s)) codes.push("Feydy");
      if (/drap[eé]/i.test(s)) codes.push("Drapé");
      if (/yang/i.test(s)) codes.push("Yang");
      if (/moutounet/i.test(s)) codes.push("Moutounet");
      if (/mihoubi|md/i.test(s)) codes.push("Mihoubi");
      if (/seror/i.test(s)) codes.push("Seror");
      if (/rubini/i.test(s)) codes.push("Rubini");
      if (/th[eé]venin/i.test(s)) codes.push("Thévenin");
      if (/hammoud/i.test(s)) codes.push("Hammoud");
      if (/internes/i.test(s)) codes.push("Internes");
      if (/anesth/i.test(s)) codes.push("Anesth");
      if (codes.length > 0) return codes.join(" / ");
      return s.replace(/\(.*?\)/g, "").replace(/(Dr|Pr)\s+/gi, "").trim();
    }
