      return `
        <div class="bloc-toggle-row" onclick="event.stopPropagation()">
          <button type="button" class="bloc-toggle-btn ${hasSaved ? "has-saved" : ""}" id="btn-${boxDomId}" onclick="toggleBlocNotes('${boxDomId}', event)">
            <span>Notes</span>
            <span id="${prefix}btnbadge-${sKey}" style="font-size:10px;">${hasSaved ? "✓" : ""}</span>
            <span id="chev-${boxDomId}">${isOpen ? "▾" : "▸"}</span>
          </button>
          <button type="button" class="bloc-toggle-btn cr-btn ${defMode === "cro" ? "cr-primary" : ""}" onclick="copyPatientCr('${safeEvMeta}', 'cro', this, event, '${prefix}')" title="Copier le Compte Rendu Opératoire adapté au geste">
            <span>🔪 CR Opératoire</span>
          </button>
          <button type="button" class="bloc-toggle-btn cr-btn ${defMode === "preop" ? "cr-primary" : ""}" onclick="copyPatientCr('${safeEvMeta}', 'preop', this, event, '${prefix}')" title="Copier le compte rendu de consultation préopératoire">
            <span>📋 CR Pré-op</span>
          </button>
          <button type="button" class="bloc-toggle-btn cr-btn ${defMode === "suivi" ? "cr-primary" : ""}" onclick="copyPatientCr('${safeEvMeta}', 'suivi', this, event, '${prefix}')" title="Copier le compte rendu de consultation de suivi">
            <span>📋 CR Suivi</span>
          </button>
          <button type="button" class="bloc-toggle-btn cr-btn ${defMode === "crh" ? "cr-primary" : ""}" onclick="copyPatientCr('${safeEvMeta}', 'crh', this, event, '${prefix}')" title="Copier le Compte Rendu d'Hospitalisation (CRH)">
            <span>📋 CRH</span>
          </button>
        </div>
        <div class="bloc-notes-box ${isOpen ? "open" : ""}" id="${boxDomId}" onclick="event.stopPropagation()">
          <div class="mat-chips-row">${chipsHtml}</div>
          <input type="text" class="bloc-input" id="${matInputId}" list="${matListId}" value="${escHtmlAttr(sEntry.materiel)}" placeholder="Matériel utilisé (inclus au CR Opératoire, exclu du CRH)..." onchange="saveSuiviFromDom('${sKey}', '${safeEvMeta}', '${prefix}', false)" />
          ${datalistHtml}
          <textarea rows="2" class="bloc-input" id="${prefix}rem-${sKey}" placeholder="Remarques, complications ou consignes (inclus au CR)..." onchange="saveSuiviFromDom('${sKey}', '${safeEvMeta}', '${prefix}', false)">${escHtmlAttr(sEntry.remarques)}</textarea>
          <textarea rows="2" class="bloc-input" id="${prefix}ana-${sKey}" placeholder="Biopsie / Anatomopathologie (inclus au CR)..." onchange="saveSuiviFromDom('${sKey}', '${safeEvMeta}', '${prefix}', false)">${escHtmlAttr(sEntry.anapath)}</textarea>
          <textarea rows="2" class="bloc-input" id="${prefix}scs-${sKey}" placeholder="Suivi clinique & recommandations CS (inclus au CR)..." onchange="saveSuiviFromDom('${sKey}', '${safeEvMeta}', '${prefix}', false)">${escHtmlAttr(sEntry.suivi_cs)}</textarea>
          <div class="bloc-save-row" style="justify-content:flex-end; gap:8px;">
            <span class="bloc-save-status" id="${prefix}status-${sKey}"></span>
            <button type="button" class="bloc-save-btn" onclick="saveSuiviFromDom('${sKey}', '${safeEvMeta}', '${prefix}', true)">OK</button>
          </div>
        </div>
      `;
    }

    function renderEventCard(ev, showDate = false, inSuiviTab = false) {
      if (ev.category === "marie-garde") {
        const shortRem = ev.remarques && ev.remarques.length <= 50 ? ev.remarques : "";
        return `
          <div class="event-card type-marie-garde">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
              <div style="display:flex; align-items:center; gap:6px; min-width:0;">
                <span class="event-time-badge" style="background:#DB2777; color:#FFF; border-color:#BE185D; font-size:9.5px; padding:1px 6px;">${showDate ? `${ev.dateStr} · ` : ""}${ev.horaire}</span>
                <span class="marie-ev-title" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${ev.title}</span>
              </div>
              <span class="pill pill-marie">${ev.badgeLabel}</span>
            </div>
            ${shortRem ? `<div class="marie-ev-rem">${shortRem}</div>` : ""}
          </div>
        `;
      }
      if (ev.category === "mail-rdv") {
        const shortDocRdv = formatShortDoc(ev.medecin);
        return `
          <div class="event-card type-mail-rdv">
            <div class="event-top">
              <span class="event-time-badge">${showDate ? `${ev.dateStr} · ` : ""}${ev.horaire}</span>
              <span class="pill pill-mail-rdv">${ev.badgeLabel}</span>
            </div>
            <div class="event-patient"><span>${ev.title}</span></div>
            <div class="event-title">${ev.patient}</div>
            ${ev.lieu ? `<div class="event-meta"><span>${ev.lieu}</span>${shortDocRdv ? `<span class="doc-tag">${shortDocRdv}</span>` : ""}</div>` : ""}
            ${ev.remarques ? `<div class="mail-ev-rem">${ev.remarques}</div>` : ""}
          </div>
        `;
      }

      const master = findPatientMasterRecord(ev.patient, ev.ipp);
      const combinedNotes = `${ev.remarques || ""} ${master ? master["Coordonnées / DDN"] + " " + master["Instructions & Remarques Cliniques"] : ""}`;
      const anticoag = detectAnticoagAlert(combinedNotes);
      const pillClass =
        ev.category === "acte" ? "pill-acte" :
        ev.category === "biopsie" ? "pill-biopsie" :
        ev.category === "cs" ? "pill-cs" : "pill-img";

      const safePatientAttr = encodeURIComponent(JSON.stringify({ name: ev.patient, ipp: ev.ipp }));
      const shortDoc = formatShortDoc(ev.medecin);
      const isTlDoc = /TL/.test(shortDoc);
      const shortLieu = formatShortLieu(ev);

      // Pour les consultations : éviter de répéter "Consultation spécialisée" ou "Téléconsultation de suivi" puisque le badge indique déjà CS ou Télécs
      const isGenericCsTitle = ev.category === "cs" && /^(télé)?consultation\s*(spécialisée|de suivi|pré-interventionnelle|\/\s*cs)?$/i.test(String(ev.title || "").trim());
      const mainLine = isGenericCsTitle ? (ev.remarques || ev.title) : ev.title;
      const subLine = isGenericCsTitle ? "" : (ev.remarques || "");
      const safeTitleSlug = normName(ev.title || "").slice(0, 8);
      const cardPrefix = `${inSuiviTab ? "suivi" : (currentTab || "ev")}-${ev.category || "ev"}-${ev.row || 0}-${safeTitleSlug}-`;

      return `
        <div class="event-card type-${ev.category}" onclick="openPatientModal('${safePatientAttr}')">
          <div class="event-top">
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="event-time-badge">${showDate ? `${ev.dateStr} · ` : ""}${ev.horaire}</span>
              ${shortDoc ? `<span class="doc-tag ${isTlDoc ? "is-tl" : ""}">${shortDoc}</span>` : ""}
              ${shortLieu ? `<span style="font-size:10.5px; color:var(--text-muted); font-weight:600;">${shortLieu}</span>` : ""}
            </div>
            <span class="pill ${pillClass}">${ev.badgeLabel === "Consult" ? "CS" : ev.badgeLabel}</span>
          </div>
          <div class="event-patient">
            <span>${ev.patient}</span>
            ${ev.ipp && ev.ipp !== "Non spécifié" ? `<span class="event-ipp">${ev.ipp}</span>` : ""}
          </div>
          ${mainLine ? `<div class="event-title">${mainLine}</div>` : ""}
          ${subLine ? `<div style="font-size:11px; color:var(--text-muted); margin-top:3px;">${subLine}</div>` : ""}
          ${anticoag ? `<div class="alert-anticoag">Anticoagulant / Hémostase (voir fiche)</div>` : ""}
          ${renderBlocNotesHtml(ev, cardPrefix)}
        </div>
      `;
    }

    function setAgendaScope(scope) {
      agendaScope = scope;
      if (scope === "mine" || scope === "all") {
        activiteScope = scope;
      }
      document.getElementById("scope-btn-mine")?.classList.toggle("scope-active", scope === "mine");
      document.getElementById("scope-btn-all")?.classList.toggle("scope-active", scope === "all");
      syncActiviteControls();
      updateKpis();
      renderCalendar();
    }

    function setCalendarView(v) {
      calendarView = v;
      document.getElementById("view-btn-day").classList.toggle("active", v === "day");
      document.getElementById("view-btn-week").classList.toggle("active", v === "week");
      document.getElementById("view-btn-month").classList.toggle("active", v === "month");
      renderCalendar();
    }

    function navigatePeriod(delta) {
      if (calendarView === "day" || calendarView === "week") {
        // En mode Jour comme en mode Semaine, les flèches < et > permettent de changer de semaine (+7j / -7j) en se calant sur le lundi de la semaine
        const curMon = getMondayOf(selectedDate);
        selectedDate = new Date(curMon.getFullYear(), curMon.getMonth(), curMon.getDate() + delta * 7, 12, 0, 0);
        renderCalendar({ scrollStrip: true, alignMonday: true });
      } else {
        selectedDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth() + delta, 1, 12, 0, 0);
        renderCalendar();
      }
    }

    function goToday() {
      const now = new Date();
      selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
      switchTab("agenda");
      calendarView = "day";
      document.getElementById("view-btn-day").classList.add("active");
      document.getElementById("view-btn-week").classList.remove("active");
      document.getElementById("view-btn-month").classList.remove("active");
      renderCalendar({ scrollStrip: true, alignMonday: true });
    }

    function getMondayOf(d) {
      const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0);
      const day = dt.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      dt.setDate(dt.getDate() + diff);
      return dt;
    }

    const MARIE_GARDES_STATIC = {
      "2026-11-02": {
        shortChip: "02/11 (23h)",
        shortHours: "23h",
        shortTag: "Marie 23h",
        bannerText: "Demi-garde jusqu'à 23h"
      },
      "2026-11-07": {
        shortChip: "07/11 (9-21h)",
        shortHours: "9h–21h",
        shortTag: "Marie 9-21h",
        bannerText: "Urgences 9h–21h"
      },
      "2026-11-17": {
        shortChip: "17/11 (24h)",
        shortHours: "24h",
        shortTag: "Marie 24h",
        bannerText: "Garde 24h"
      },
      "2026-11-21": {
        shortChip: "21/11 (7h30)",
        shortHours: "7h30",
        shortTag: "Marie 7h30",
        bannerText: "Formation dès 7h30"
      },
      "2026-12-17": {
        shortChip: "17/12 (24h)",
        shortHours: "24h",
        shortTag: "Marie 24h",
        bannerText: "Garde 24h"
      }
    };

    function getAllMarieGardesMap() {
      const map = Object.assign({}, MARIE_GARDES_STATIC);
      for (const rdv of (PERSONAL_MAIL_RDVS || [])) {
        if (!rdv || !rdv.isoDate || map[rdv.isoDate]) continue;
        const txt = `${rdv.title || ""} ${rdv.patient || ""} ${rdv.remarques || ""}`;
        if (/marie\s*(parizot)?.*garde|garde.*marie\s*(parizot)?/i.test(txt)) {
          const [y, m, d] = rdv.isoDate.split("-").map(Number);
          const dt = new Date(y, m - 1, d, 12, 0, 0);
          const lbl = dt.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
          map[rdv.isoDate] = {
            shortChip: `${lbl} (${rdv.horaire || "Garde"})`,
            shortHours: rdv.horaire || "Garde",
            shortTag: "Marie",
            bannerText: rdv.title || rdv.patient || "Garde Marie"
          };
        }
      }
      return map;
    }

    function getMarieGardeForIso(isoDate) {
      if (!isoDate) return null;
      const map = getAllMarieGardesMap();
      return map[isoDate] || null;
    }

    function renderMyGardesStrip() {
      const stripEl = document.getElementById("my-gardes-strip");
      if (!stripEl) return;
      const gMap = (appData && appData.gardes) ? appData.gardes : DEFAULT_GARDES_HIVER;
      const myDates = Object.keys(gMap).filter(k => gMap[k] && gMap[k].is_tl).sort();
      const selIso = dateToIso(selectedDate);

      const marieMap = getAllMarieGardesMap();
      const marieDates = Object.keys(marieMap).sort();
      const marieChips = marieDates.map(iso => {
        const mg = marieMap[iso];
        return `<button class="garde-chip-marie ${iso === selIso ? "active" : ""}" onclick="selectDayFromCalendar('${iso}')">${mg.shortChip}</button>`;
      }).join("");

      const chips = myDates.map(iso => {
        const [y, m, d] = iso.split("-").map(Number);
        const dt = new Date(y, m - 1, d, 12, 0, 0);
        const lbl = dt.toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "short" });
        return `<button class="garde-chip ${iso === selIso ? "active" : ""}" onclick="selectDayFromCalendar('${iso}')">${lbl}</button>`;
      }).join("");

      stripEl.innerHTML = `<span class="garde-strip-lbl-marie">Marie</span>${marieChips}<a class="garde-strip-lbl" href="https://docs.google.com/spreadsheets/d/1_XCqFLamiYM02RamAfc1khawt-jU3RG0CUU20x_M_Lw/edit" target="_blank" rel="noopener">Gardes TL ↗</a>${chips}`;
    }

    function renderGardeBannerHtml(iso) {
      let out = "";
      const mg = getMarieGardeForIso(iso);
      if (mg) {
        out += `
          <div class="garde-banner is-marie">
            <span><strong>Garde Marie</strong> · ${mg.bannerText}</span>
            <span class="pill pill-marie">${mg.shortHours}</span>
          </div>
        `;
      }
      const g = getGardeForIso(iso);
      if (!g || !g.noms || g.noms.length === 0) return out;
      if (g.is_tl) {
        out += `
          <div class="garde-banner is-me">
            <span><strong>DE GARDE</strong> (${g.nature})</span>
            <span class="pill pill-danger">TL</span>
          </div>
        `;
        return out;
      }
      if (agendaScope === "mine") return out;
      out += `
        <div class="garde-banner">
          <span>Garde (${g.nature}) : <strong>Dr ${g.noms.join(" / ")}</strong></span>
          <span class="pill pill-cs">Garde</span>
        </div>
      `;
      return out;
    }

    function getShortVacTagForDay(iso, dt) {
      const dow = dt.getDay();
      const mg = getMarieGardeForIso(iso);
      const g = getGardeForIso(iso);
      if (dow === 0 || dow === 6) {
        if (g && g.is_tl) return { lbl: "🚨 TL", cls: "post-liberal" };
        if (mg) return { lbl: mg.shortTag, cls: "post-marie" };
        if (agendaScope === "all" && g && g.noms && g.noms.length) {
          const shortG = g.noms[0].replace(/^Dr\s+/i, "").split(" ")[0];
          return { lbl: shortG, cls: "post-cs" };
        }
        return { lbl: "WE", cls: "post-libre" };
      }
      if (mg) return { lbl: mg.shortTag, cls: "post-marie" };
      if (g && g.is_tl) return { lbl: "Garde", cls: "post-liberal" };
      const myV = getMyVacationForIso(iso);
      const firstPost = (myV.am[0] || "").toLowerCase();
      if (firstPost.includes("pitié") || firstPost.includes("pitie")) return { lbl: "Pitié", cls: "post-libre" };
      if (firstPost.includes("férié")) return { lbl: "Férié", cls: "post-libre" };
      if (firstPost.includes("libéral") || firstPost.includes("jdp")) return { lbl: "JDP/GSH", cls: "post-liberal" };
      if (firstPost.includes("masterclass")) return { lbl: "Master.", cls: "post-staff" };
      if (firstPost.includes("libre")) return { lbl: "Libre", cls: "post-libre" };
      const def = MAQUETTE_DEFAULT_DOW[dow] || { short: "Cochin", color: "post-cs" };
      return { lbl: def.short, cls: def.color };
    }

    function renderWeekStripBar(allEvents, opts) {
      const stripContainer = document.getElementById("week-strip-container");
      if (!stripContainer) return;
      if (calendarView === "month") {
        stripContainer.innerHTML = "";
        return;
      }

      const activeMon = getMondayOf(selectedDate);
      const activeMonIso = dateToIso(activeMon);

      // En mode SEMAINE : afficher les cases résumées de chaque semaine (défilables et cliquables)
      if (calendarView === "week") {
        const existingWeekScroll = document.getElementById("weeks-selector-scroll");
        const prevWeekScrollLeft = existingWeekScroll ? existingWeekScroll.scrollLeft : null;

        const startMon = new Date(2026, 9, 26, 12, 0, 0);
        const weeksList = [];
        for (let w = 0; w < 18; w++) {
          const m = new Date(startMon.getFullYear(), startMon.getMonth(), startMon.getDate() + w * 7, 12, 0, 0);
          weeksList.push(m);
        }
        if (!weeksList.some(m => dateToIso(m) === activeMonIso)) {
          weeksList.push(activeMon);
          weeksList.sort((a, b) => a.getTime() - b.getTime());
        }

        let cardsHtml = "";
        for (const mon of weeksList) {
          const monIso = dateToIso(mon);
          const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6, 12, 0, 0);
          const mLbl = mon.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }).replace(".", "");
          const sLbl = sun.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }).replace(".", "");

          let nbGestes = 0;
          let nbCs = 0;
          let hasGarde = false;
          let nbMarieGardes = 0;
          let hasLiberal = false;
          let hasMaster = false;

          for (let d = 0; d < 7; d++) {
            const cur = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + d, 12, 0, 0);
            const iso = dateToIso(cur);
            const g = getGardeForIso(iso);
            if (g && g.is_tl) hasGarde = true;
            if (getMarieGardeForIso(iso)) nbMarieGardes++;
            const myV = getMyVacationForIso(iso);
            const vTxt = [...myV.am, ...myV.pm].join(" ").toLowerCase();
            if (vTxt.includes("libéral") || vTxt.includes("jdp") || vTxt.includes("geoffroy")) hasLiberal = true;
            if (vTxt.includes("masterclass")) hasMaster = true;

            const dEvs = allEvents.filter(e => e.isoDate === iso);
            for (const ev of dEvs) {
              if (ev.category === "acte" || ev.category === "biopsie") nbGestes++;
              else if (ev.category === "cs" || ev.category === "img") nbCs++;
            }
          }

          const totalRdv = nbGestes + nbCs;
          let badges = "";
          if (nbMarieGardes > 0) badges += `<span class="wsc-tag pill-marie">Marie (${nbMarieGardes})</span>`;
          if (nbGestes > 0) badges += `<span class="wsc-tag pill-acte">${nbGestes} Geste${nbGestes > 1 ? "s" : ""}</span>`;
          if (nbCs > 0) badges += `<span class="wsc-tag pill-cs">${nbCs} CS/Exam</span>`;
          if (hasGarde) badges += `<span class="wsc-tag pill-danger">Garde TL</span>`;
          if (hasLiberal) badges += `<span class="wsc-tag post-liberal">JDP/GSH</span>`;
          if (hasMaster) badges += `<span class="wsc-tag post-staff">Master.</span>`;
          if (!badges) badges = `<span class="wsc-tag post-libre">Planning std</span>`;

          const isActive = (monIso === activeMonIso);
          cardsHtml += `
            <div class="week-sel-card ${isActive ? "active" : ""} ${hasGarde ? "has-garde" : ""}" id="wsc-${monIso}" onclick="selectWeekFromSummary('${monIso}')">
              <div class="wsc-title">
                <span>${mLbl} – ${sLbl}</span>
                <span style="font-size:9.5px; color:var(--primary);">${totalRdv > 0 ? totalRdv + " RDV" : ""}</span>
              </div>
              <div class="wsc-badges">${badges}</div>
            </div>
          `;
        }
        stripContainer.innerHTML = `<div class="weeks-selector-row" id="weeks-selector-scroll">${cardsHtml}</div>`;
        const newWeekScroll = document.getElementById("weeks-selector-scroll");
        if (newWeekScroll) {
          if (prevWeekScrollLeft !== null && !(opts && opts.scrollStrip)) {
            newWeekScroll.scrollLeft = prevWeekScrollLeft;
          } else {
            const activeEl = document.getElementById("wsc-" + activeMonIso);
            if (activeEl) {
              newWeekScroll.scrollLeft = Math.max(0, activeEl.offsetLeft - (newWeekScroll.clientWidth - activeEl.offsetWidth) / 2);
            }
          }
        }
        return;
      }

      // En mode JOUR : Barre des jours défilable horizontalement (Lundi -> Vendredi en grand + Samedi/Dimanche en petit)
      const existingDayScroll = document.getElementById("day-strip-scroll");
      const prevDayScrollLeft = existingDayScroll ? existingDayScroll.scrollLeft : null;

      const selIso = dateToIso(selectedDate);
      const startDay = new Date(2026, 9, 26, 12, 0, 0);
      const endDay = new Date(2027, 1, 7, 12, 0, 0);
      const minDate = selectedDate < startDay ? new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate() - 7, 12, 0, 0) : startDay;
      const maxDate = selectedDate > endDay ? new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate() + 14, 12, 0, 0) : endDay;

      let cellsHtml = "";
      const cur = new Date(minDate.getTime());
      while (cur <= maxDate) {
        const iso = dateToIso(cur);
        const g = getGardeForIso(iso);
        const mg = getMarieGardeForIso(iso);
        const evCnt = allEvents.filter(e => e.isoDate === iso).length;
        const tag = getShortVacTagForDay(iso, cur);
        const dowNum = cur.getDay();
        const isWe = (dowNum === 0 || dowNum === 6);
        const dowLbl = cur.toLocaleDateString("fr-FR", { weekday: "short" }).replace(".", "");
        const dayNum = cur.getDate();
        const monthShort = cur.toLocaleDateString("fr-FR", { month: "short" }).replace(".", "");
        const monthFull = cur.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

        if (isWe) {
          const weSub = (mg && g && g.is_tl)
            ? "Marie+TL"
            : (mg ? mg.shortHours : (agendaScope === "all" && g && g.noms && g.noms.length > 1 ? g.noms[1].split(" ")[0] : ""));
          const weTitle = (agendaScope === "all" && g && g.noms)
            ? `Garde ${dowLbl} ${dayNum} : ${g.noms.join(" / ")}`
            : (g && g.is_tl ? `Garde TL ${dowLbl} ${dayNum}` : (mg ? `Garde Marie (${mg.shortHours})` : `${dowLbl} ${dayNum}`));
          cellsHtml += `
            <div class="ws-day is-weekend ${iso === selIso ? "active" : ""} ${g && g.is_tl ? "is-garde" : ""} ${mg ? "is-marie-garde" : ""}" id="ws-day-${iso}" data-month="${monthFull}" onclick="selectDayFromWeekStrip('${iso}')" title="${weTitle}">
              <span class="ws-dow">${dowLbl}</span>
              <span class="ws-num">${dayNum}</span>
              <span class="ws-vac ${tag.cls}">${tag.lbl}</span>
              ${weSub ? `<span class="ws-cnt">${weSub}</span>` : ""}
            </div>
          `;
        } else {
          cellsHtml += `
            <div class="ws-day ${iso === selIso ? "active" : ""} ${g && g.is_tl ? "is-garde" : ""} ${mg ? "is-marie-garde" : ""}" id="ws-day-${iso}" data-month="${monthFull}" onclick="selectDayFromWeekStrip('${iso}')">
              <span class="ws-dow">${dowLbl}</span>
              <span class="ws-num">${dayNum}<span class="ws-mon">${monthShort}</span></span>
              <span class="ws-vac ${tag.cls}">${tag.lbl}</span>
              <span class="ws-cnt">${evCnt > 0 ? evCnt + " RDV" : "·"}</span>
            </div>
          `;
        }
        cur.setDate(cur.getDate() + 1);
      }
      const initialMonthFull = selectedDate.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
      stripContainer.innerHTML = `
        <div class="day-strip-month-header">
          <span id="day-strip-visible-month">📅 ${initialMonthFull}</span>
        </div>
        <div class="day-strip-scroll" id="day-strip-scroll" onscroll="updateDayStripVisibleMonth()">${cellsHtml}</div>
      `;
      const newDayScroll = document.getElementById("day-strip-scroll");
      if (newDayScroll) {
        if (prevDayScrollLeft !== null && !(opts && opts.scrollStrip)) {
          newDayScroll.scrollLeft = prevDayScrollLeft;
        } else {
          const targetIso = (opts && opts.alignMonday) ? activeMonIso : getMondayOf(selectedDate) ? dateToIso(getMondayOf(selectedDate)) : selIso;
          const monEl = document.getElementById("ws-day-" + targetIso) || document.getElementById("ws-day-" + selIso);
          if (monEl) {
            newDayScroll.scrollLeft = Math.max(0, monEl.offsetLeft);
          }
        }
        updateDayStripVisibleMonth();
      }
    }

    function updateDayStripVisibleMonth() {
      const sc = document.getElementById("day-strip-scroll");
      const lbl = document.getElementById("day-strip-visible-month");
      if (!sc || !lbl) return;
      const leftEdge = sc.scrollLeft + 10;
      const rightEdge = sc.scrollLeft + sc.clientWidth - 10;
      const days = sc.querySelectorAll(".ws-day");
      let firstM = "";
      let lastM = "";
      for (const d of days) {
        const dLeft = d.offsetLeft;
        const dRight = dLeft + d.offsetWidth;
        if (dRight >= leftEdge && dLeft <= rightEdge) {
          const m = d.getAttribute("data-month") || "";
          if (!firstM) firstM = m;
          lastM = m;
        }
      }
      if (firstM && lastM) {
        lbl.textContent = firstM === lastM ? `📅 ${firstM}` : `📅 ${firstM} – ${lastM}`;
      }
    }

    function selectWeekFromSummary(monIso) {
      const [y, m, d] = monIso.split("-").map(Number);
      selectedDate = new Date(y, m - 1, d, 12, 0, 0);
      renderCalendar({ scrollStrip: false });
    }

    function selectDayFromWeekStrip(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      selectedDate = new Date(y, m - 1, d, 12, 0, 0);
      renderCalendar({ scrollStrip: false });
    }

    function renderCalendar(opts) {
      renderMyGardesStrip();
      const container = document.getElementById("calendar-container");
      const titleEl = document.getElementById("period-title");
      const subEl = document.getElementById("period-sub");
      const allEvents = filterEventsByScope(getAllTimedEvents());
      const isGeneral = (agendaScope === "all");

      renderWeekStripBar(allEvents, opts);

      if (calendarView === "day") {
        const iso = dateToIso(selectedDate);
        titleEl.textContent = selectedDate.toLocaleDateString("fr-FR", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });
        const myVac = getMyVacationForIso(iso);
        if (myVac.note) {
          subEl.textContent = myVac.note;
          subEl.style.display = "block";
        } else {
          subEl.textContent = "";
          subEl.style.display = "none";
        }

        const genVac = getGeneralPlanningForIso(iso);
        const dayEvents = allEvents.filter(e => e.isoDate === iso);
        const isWeekendDay = (selectedDate.getDay() === 0 || selectedDate.getDay() === 6);
        const gDay = getGardeForIso(iso);

        let weekendCardHtml = "";
        if (isWeekendDay) {
          if (gDay && gDay.is_tl) {
            weekendCardHtml = `
              <div class="vac-card vac-card-we">
                <div class="vac-period">🚨 Week-end — De garde Imagerie Cochin</div>
                <div class="vac-card-we-body">
                  Garde Imagerie Cochin : Dr ${gDay.noms.join(" / ")}
                </div>
              </div>
            `;
          } else if (isGeneral) {
            weekendCardHtml = `
              <div class="vac-card">
                <div class="vac-period">Week-end — Permanence des soins & Gardes</div>
                <div class="post-pills"><span class="post-pill post-cs">Garde : Dr ${(gDay && gDay.noms && gDay.noms.length) ? gDay.noms.join(" / ") : "Non renseigné"}</span></div>
              </div>
            `;
          } else {
            weekendCardHtml = `
              <div class="vac-card">
                <div class="vac-period">Week-end (TL)</div>
                <div class="post-pills"><span class="post-pill post-libre">Repos (hors garde Cochin)</span></div>
              </div>
            `;
          }
        }

        let html = `
          ${renderGardeBannerHtml(iso)}
          ${!isWeekendDay ? `
            <div class="vac-grid">
              <div class="vac-card">
                <div class="vac-period">${isGeneral ? "Matin (Chefs Radio B)" : "Matin (TL)"}</div>
                <div class="post-pills">${renderPostPills(isGeneral ? genVac.am : myVac.am, isGeneral, "am")}</div>
              </div>
              <div class="vac-card">
                <div class="vac-period">${isGeneral ? "Après-midi (Chefs Radio B)" : "Après-midi (TL)"}</div>
                <div class="post-pills">${renderPostPills(isGeneral ? genVac.pm : myVac.pm, isGeneral, "pm")}</div>
              </div>
            </div>
          ` : weekendCardHtml}
          <div class="section-label">
            <span>${isGeneral ? "Patients du service" : "Patients & RDV"} (${dayEvents.length})</span>
          </div>
        `;

        html += dayEvents.length === 0
          ? `<div class="empty-state">${myVac.offCochin && !isGeneral ? "Journée hors Cochin." : "Aucun RDV programmé sur ce créneau."}</div>`
          : dayEvents.map(ev => renderEventCard(ev, false)).join("");

        container.innerHTML = html;

      } else if (calendarView === "week") {
        const mon = getMondayOf(selectedDate);
        const fri = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 4, 12, 0, 0);
        const sat = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 5, 12, 0, 0);
        const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6, 12, 0, 0);
        titleEl.textContent = `Semaine du ${mon.getDate()}/${mon.getMonth() + 1} au ${fri.getDate()}/${fri.getMonth() + 1} (+ WE ${sat.getDate()}-${sun.getDate()}/${sun.getMonth() + 1})`;
        subEl.textContent = "";
        subEl.style.display = "none";

        // 1. Vue synthétique mobile Lundi -> Vendredi (5 colonnes côte à côte) + Samedi/Dimanche en petit
        let fiveColsHtml = "";
        for (let i = 0; i < 5; i++) {
          const cur = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i, 12, 0, 0);
          const iso = dateToIso(cur);
          const g = getGardeForIso(iso);
          const mg = getMarieGardeForIso(iso);
          const tag = getShortVacTagForDay(iso, cur);
          const dayEvs = allEvents.filter(e => e.isoDate === iso);
          const dowShort = cur.toLocaleDateString("fr-FR", { weekday: "short" }).replace(".", "");
          const showWeekColGarde = (g && g.is_tl) || (isGeneral && g && g.noms && g.noms.length);
          fiveColsHtml += `
            <div class="v3-week-5col-cell ${g && g.is_tl ? "is-garde" : ""}" onclick="selectDayFromCalendar('${iso}')">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:9px;font-weight:800;text-transform:uppercase;color:var(--text-muted);">${dowShort}</span>
                <span style="font-size:11px;font-weight:800;color:var(--text);">${cur.getDate()}</span>
              </div>
              <span class="ws-vac ${tag.cls}" style="width:100%;text-align:center;font-size:8px;padding:2px 2px;">${tag.lbl}</span>
              ${showWeekColGarde ? `<div class="we-pill-doc" style="font-size:7.5px;">${g.is_tl ? "🚨 Garde TL" : g.noms[0]}</div>` : ""}
              <div style="font-size:8px;color:var(--text-muted);text-align:center;">${dayEvs.length > 0 ? `${dayEvs.length} RDV` : "·"}</div>
            </div>
          `;
        }

        const satIso = dateToIso(sat);
        const sunIso = dateToIso(sun);
        const gSat = getGardeForIso(satIso);
        const gSun = getGardeForIso(sunIso);
        const mgSat = getMarieGardeForIso(satIso);
        const mgSun = getMarieGardeForIso(sunIso);

        const formatWePillText = (gWe, mgWe) => {
          const parts = [];
          if (gWe && gWe.is_tl) parts.push("🚨 Garde TL");
          else if (isGeneral && gWe && gWe.noms && gWe.noms.length) parts.push(`Garde : Dr ${gWe.noms.join("/")}`);
          if (mgWe) parts.push(`Marie (${mgWe.shortHours})`);
          return parts.length > 0 ? parts.join(" • ") : "Repos";
        };
        const satPillCls = (gSat && gSat.is_tl) ? "is-garde" : (mgSat ? "is-marie-garde" : "");
        const sunPillCls = (gSun && gSun.is_tl) ? "is-garde" : (mgSun ? "is-marie-garde" : "");

        let html = `
          <div class="v3-week-5col-grid">${fiveColsHtml}</div>
          <div class="v3-weekend-gardes-bar">
            <div class="v3-weekend-garde-pill ${satPillCls}" onclick="selectDayFromCalendar('${satIso}')">
              <span class="we-pill-day">SAM. ${sat.getDate()}/${sat.getMonth() + 1}</span>
              <span class="we-pill-doc">${formatWePillText(gSat, mgSat)}</span>
            </div>
            <div class="v3-weekend-garde-pill ${sunPillCls}" onclick="selectDayFromCalendar('${sunIso}')">
              <span class="we-pill-day">DIM. ${sun.getDate()}/${sun.getMonth() + 1}</span>
              <span class="we-pill-doc">${formatWePillText(gSun, mgSun)}</span>
            </div>
          </div>
        `;

        // 2. Cartes détaillées du Lundi au Vendredi uniquement
        for (let i = 0; i < 5; i++) {
          const cur = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i, 12, 0, 0);
          const iso = dateToIso(cur);
          const myVac = getMyVacationForIso(iso);
          const genVac = getGeneralPlanningForIso(iso);
          const g = getGardeForIso(iso);
          const mg = getMarieGardeForIso(iso);
          const dayEvs = allEvents.filter(e => e.isoDate === iso);
          const dayName = cur.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "short" });

          let gardeBadge = `<span class="pill pill-cs">${dayEvs.length} RDV</span>`;
          if (mg && g && g.is_tl) {
            gardeBadge = `<span class="pill pill-marie">Marie (${mg.shortHours})</span> <span class="pill pill-danger">DE GARDE TL</span>`;
          } else if (mg) {
            gardeBadge = `<span class="pill pill-marie">Marie (${mg.shortHours})</span>`;
          } else if (g && g.is_tl) {
            gardeBadge = `<span class="pill pill-danger">DE GARDE</span>`;
          } else if (isGeneral && g && g.noms && g.noms.length) {
            gardeBadge = `<span class="pill pill-cs">Garde : ${g.noms.join("/")}</span>`;
          }

          const cardStyle = (g && g.is_tl)
            ? "border-color:#EF4444;background:rgba(239,68,68,0.08);"
            : (mg ? "border-left:3px solid #EC4899;" : "");

          html += `
            <div class="week-day-card" style="${cardStyle}">
              <div class="week-day-header" onclick="selectDayFromCalendar('${iso}')">
                <span class="week-day-name">${dayName}</span>
                <div style="display:flex;gap:4px;align-items:center;">${gardeBadge}</div>
              </div>
              <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px; margin-bottom:6px;">
                <div><div style="font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:3px;">Matin</div>${renderPostPills(isGeneral ? genVac.am : myVac.am, isGeneral, "am", false)}</div>
                <div><div style="font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:3px;">Après-midi</div>${renderPostPills(isGeneral ? genVac.pm : myVac.pm, isGeneral, "pm", false)}</div>
              </div>
              ${dayEvs.map(ev => renderEventCard(ev, false)).join("")}
            </div>
          `;
        }
        container.innerHTML = html;

      } else {
        const year = selectedDate.getFullYear();
        const month = selectedDate.getMonth();
        titleEl.textContent = new Date(year, month, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
        subEl.textContent = "";
        subEl.style.display = "none";

        const firstDay = new Date(year, month, 1, 12, 0, 0);
        const startOffset = (firstDay.getDay() + 6) % 7;
        const gridStart = new Date(year, month, 1 - startOffset, 12, 0, 0);

        let html = `
          <div class="month-grid-header">
            <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
          </div>
          <div class="month-grid">
        `;

        const selectedIso = dateToIso(selectedDate);

        for (let i = 0; i < 42; i++) {
          const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i, 12, 0, 0);
          const iso = dateToIso(cellDate);
          const isOtherMonth = cellDate.getMonth() !== month;
          const evs = allEvents.filter(e => e.isoDate === iso);
          const g = getGardeForIso(iso);
          const mg = getMarieGardeForIso(iso);
          const dow = cellDate.getDay();

          let tagHtml = "";
          let deskVacsHtml = "";
          if (g && g.is_tl) {
            tagHtml = `<div class="month-vac-tag" style="background:rgba(220,38,38,0.35);color:#FCA5A5;">GARDE</div>`;
          } else if (mg) {
            tagHtml = `<div class="month-vac-tag post-marie">${mg.shortTag}</div>`;
          } else if (isGeneral && g && g.noms && g.noms.length && (dow === 0 || dow === 6)) {
            tagHtml = `<div class="month-vac-tag" style="background:rgba(59,130,246,0.2);color:#93C5FD;">${g.noms[0].slice(0, 6)}</div>`;
          } else if (dow >= 1 && dow <= 5 && cellDate >= new Date(2026, 10, 2)) {
            const myV = getMyVacationForIso(iso);
            const firstPost = (myV.am[0] || "").toLowerCase();
            if (firstPost.includes("férié")) {
              tagHtml = `<div class="month-vac-tag post-libre">Férié</div>`;
            } else if (firstPost.includes("libéral") || firstPost.includes("jdp")) {
              tagHtml = `<div class="month-vac-tag post-liberal">JDP/GSH</div>`;
            } else if (firstPost.includes("masterclass")) {
              tagHtml = `<div class="month-vac-tag post-staff">OsteoCool</div>`;
            } else {
              const def = MAQUETTE_DEFAULT_DOW[dow];
              tagHtml = `<div class="month-vac-tag ${def.color}">${def.short}</div>`;
            }
          }

          if (dow >= 1 && dow <= 5 && cellDate >= new Date(2026, 9, 26)) {
            const myV = getMyVacationForIso(iso);
            const amStr = (myV.am || []).join(" / ").replace(/\s*\(.*?\)/g, "");
            const pmStr = (myV.pm || []).join(" / ").replace(/\s*\(.*?\)/g, "");
            const amCls = postColorClass(myV.am[0] || "");
            const pmCls = postColorClass(myV.pm[0] || "");
            if (amStr === pmStr && amStr) {
              deskVacsHtml = `<div class="month-desk-vacs"><div class="month-desk-vac-line ${amCls}">${amStr}</div></div>`;
            } else {
              deskVacsHtml = `
                <div class="month-desk-vacs">
                  ${amStr ? `<div class="month-desk-vac-line ${amCls}">M : ${amStr}</div>` : ""}
                  ${pmStr ? `<div class="month-desk-vac-line ${pmCls}">AP : ${pmStr}</div>` : ""}
                </div>
              `;
            }
          } else if (isGeneral && g && g.noms && g.noms.length) {
            deskVacsHtml = `<div class="month-desk-vacs"><div class="month-desk-vac-line post-sau">Garde : ${g.noms.join("/")}</div></div>`;
          }

          const deskCntHtml = (g && g.is_tl)
            ? `<span class="month-desk-cnt" style="background:rgba(239,68,68,0.28);color:#FCA5A5;">GARDE</span>`
            : (mg
                ? `<span class="month-desk-cnt" style="background:#DB2777;color:#FFF;">Marie</span>`
                : (evs.length > 0 ? `<span class="month-desk-cnt">${evs.length} RDV</span>` : ""));

          const deskEvsHtml = evs.length > 0
            ? `<div class="month-desk-evs">
                ${evs.slice(0, 3).map(e => {
                  const pLabel = (e.category === "mail-rdv" || e.category === "marie-garde") ? e.title : String(e.patient || "").replace(/^(Mme|M\.|Mr|Mlle)\s+/i, "");
                  const hShort = String(e.horaire || "").replace(":00", "h").replace("h00", "h");
                  return `<div class="month-desk-ev type-${e.category}"><strong>${hShort}</strong> ${pLabel}</div>`;
                }).join("")}
                ${evs.length > 3 ? `<div class="month-desk-more">+${evs.length - 3} autre${evs.length - 3 > 1 ? "s" : ""}</div>` : ""}
              </div>`
            : "";

          const dotsHtml = evs.slice(0, 6).map(e => `<span class="m-dot ${e.category}"></span>`).join("");

          html += `
            <div class="month-cell ${isOtherMonth ? "other-month" : ""} ${iso === selectedIso ? "selected" : ""} ${g && g.is_tl ? "is-tl-garde" : ""} ${mg ? "is-marie-garde" : ""}" onclick="selectDayFromMonth('${iso}')">
              <div class="month-cell-top">
                <div class="month-day-num">${cellDate.getDate()}</div>
                ${deskCntHtml}
              </div>
              ${tagHtml}
              ${deskVacsHtml}
              ${deskEvsHtml}
              <div class="month-dots">${dotsHtml}</div>
            </div>
          `;
        }
        html += `</div>`;

        const selEvs = allEvents.filter(e => e.isoDate === selectedIso);
        const selMyVac = getMyVacationForIso(selectedIso);
        const selGenVac = getGeneralPlanningForIso(selectedIso);
        const selTitle = selectedDate.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
        html += `
          <div class="section-label" style="margin-top:12px;">
            <span>${selTitle} (${selEvs.length} RDV)</span>
          </div>
          ${renderGardeBannerHtml(selectedIso)}
          <div class="vac-grid">
            <div class="vac-card"><div class="vac-period">Matin</div><div class="post-pills">${renderPostPills(isGeneral ? selGenVac.am : selMyVac.am, isGeneral, "am")}</div></div>
            <div class="vac-card"><div class="vac-period">Après-midi</div><div class="post-pills">${renderPostPills(isGeneral ? selGenVac.pm : selMyVac.pm, isGeneral, "pm")}</div></div>
          </div>
          ${selEvs.map(ev => renderEventCard(ev, false)).join("")}
        `;
        container.innerHTML = html;
      }
    }

    function selectDayFromCalendar(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      selectedDate = new Date(y, m - 1, d, 12, 0, 0);
      setCalendarView("day");
    }

    function selectDayFromMonth(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      selectedDate = new Date(y, m - 1, d, 12, 0, 0);
      renderCalendar();
    }

    // ONGLET FUSIONNÉ : ACTIVITÉ (ACTES, BIOPSIES & CONSULTATIONS DE TL OU DU SERVICE)
    let activiteScope = "mine";
    let activiteMode = "acte";
    let activiteSub = "upcoming";

    function openActiviteView(mode, sub) {
      activiteMode = mode;
      activiteSub = sub || "upcoming";
      switchTab("activite");
      syncActiviteControls();
      renderActiviteTab();
    }

    function setActiviteScope(sc) {
      activiteScope = sc;
      agendaScope = sc;
      const agMine = document.getElementById("scope-btn-mine");
      const agAll = document.getElementById("scope-btn-all");
      if (agMine) agMine.classList.toggle("scope-active", sc === "mine");
      if (agAll) agAll.classList.toggle("scope-active", sc === "all");
      updateKpis();
      syncActiviteControls();
      renderActiviteTab();
    }

    function setActiviteMode(mode) {
      activiteMode = mode;
      activiteSub = "upcoming";
      syncActiviteControls();
      renderActiviteTab();
    }

    function setActiviteSub(sub) {
      activiteSub = sub;
      renderActiviteTab();
    }

    function syncActiviteControls() {
      const btnMine = document.getElementById("act-scope-mine");
      const btnAll = document.getElementById("act-scope-all");
      if (btnMine) btnMine.classList.toggle("scope-active", activiteScope === "mine");
      if (btnAll) btnAll.classList.toggle("scope-active", activiteScope === "all");

      const modeBar = document.getElementById("activite-mode-bar");
      if (modeBar) {
        modeBar.style.display = "none";
      }
    }

    function getWeekLabelForIso(isoDate) {
      if (!isoDate) return "Date à définir";
      const [y, m, d] = isoDate.split("-").map(Number);
      const dt = new Date(y, m - 1, d, 12, 0, 0);
      const mon = getMondayOf(dt);
      const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6, 12, 0, 0);
      const mStr = mon.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
      const sStr = sun.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
      return `Semaine du ${mStr} au ${sStr}`;
    }

    function renderActiviteTab() {
      syncActiviteControls();
      const subEl = document.getElementById("activite-subchips");
      const container = document.getElementById("activite-list-container");
      const todayIso = dateToIso(new Date());

      if (!["upcoming", "done", "todo"].includes(activiteSub)) activiteSub = "upcoming";
      const doneLbl = activiteMode === "acte" ? "Réalisés" : "Réalisées";
      subEl.style.display = "flex";
      subEl.innerHTML = `
        <button class="chip ${activiteSub === "upcoming" ? "active" : ""}" onclick="setActiviteSub('upcoming')">À venir</button>
        <button class="chip ${activiteSub === "done" ? "active" : ""}" onclick="setActiviteSub('done')">${doneLbl}</button>
        <button class="chip ${activiteSub === "todo" ? "active" : ""}" onclick="setActiviteSub('todo')">À planifier</button>
      `;

      if (activiteSub === "todo") {
        let todoPatients = (appData.Data || []).filter(p => {
          const st = String(p["Statut"] || "").toLowerCase();
          if (!st.includes("planifier") && !st.includes("irm")) return false;
          const interv = String(p["Type d'Intervention / Suivi"] || "");
          const ech = String(p["Échéance / Rendez-vous"] || "");
          const combined = interv + " " + ech;
          if (activiteMode === "biopsie") {
            return /biopsie/i.test(combined);
          } else if (activiteMode === "cs") {
            const clean = combined.replace(/cs\s+anesth\w*/gi, "");
            return /(télé)?consultation|\bcs\b/i.test(clean);
          } else {
            if (/biopsie/i.test(combined)) return false;
            return /radiofréquence|\brf\b|cryo|cimento|alcoolisation|vissage|embolisation|reprise|traitement|infiltration|test\s+anesth/i.test(combined);
          }
        });
        if (activiteScope === "mine") {
          todoPatients = todoPatients.filter(p => {
            const ref = String(p["Médecin Référent"] || "").toLowerCase();
            return ref.includes("lefevre") || ref.includes("lefèvre") || /\btl\b/.test(ref);
          });
        }
        const emptyTodoLbl =
          activiteMode === "biopsie" ? "Aucune biopsie à planifier." :
          activiteMode === "cs" ? "Aucune consultation à planifier." :
          "Aucun acte à planifier.";
        container.innerHTML = todoPatients.length
          ? todoPatients.map(p => renderMasterPatientCard(p)).join("")
          : `<div class="empty-state">${emptyTodoLbl}</div>`;
        return;
      }

      let evs = getAllTimedEvents().filter(e => e.category === activiteMode);
      if (activiteScope === "mine") {
        evs = evs.filter(e => e.isMine);
      }

      if (activiteSub === "upcoming") {
        evs = evs.filter(e => Boolean(e.isoDate && e.isoDate >= todayIso));
      } else if (activiteSub === "done") {
        evs = evs.filter(e => Boolean(e.isoDate && e.isoDate < todayIso));
      }

      if (evs.length === 0) {
        container.innerHTML = `<div class="empty-state">${activiteScope === "mine" ? "Aucun patient sur vos vacations dans cette catégorie." : "Aucun élément dans cette catégorie."}</div>`;
        return;
      }

      const groups = [];
      let currentLabel = null;
      let currentBucket = null;
      for (const ev of evs) {
        const lbl = getWeekLabelForIso(ev.isoDate);
        if (lbl !== currentLabel) {
          currentLabel = lbl;
          currentBucket = { label: lbl, items: [] };
          groups.push(currentBucket);
        }
        currentBucket.items.push(ev);
      }

      container.innerHTML = groups.map(g => `
        <div class="week-group-header">
          <span>${g.label}</span>
          <span class="pill pill-cs">${g.items.length} patient${g.items.length > 1 ? "s" : ""}</span>
        </div>
        ${g.items.map(ev => renderEventCard(ev, true)).join("")}
      `).join("");
    }

    // DEMANDES D'AVIS (SERVICE)
    function setAvisFilter(flt) {
      avisFilter = flt;
      document.getElementById("flt-avis-all").classList.toggle("active", flt === "all");
      document.getElementById("flt-avis-non").classList.toggle("active", flt === "Non répondu");
      document.getElementById("flt-avis-oui").classList.toggle("active", flt === "Répondu");
      renderAvisTab();
    }

    function renderAvisTab() {
      const container = document.getElementById("avis-list-container");
      let list = appData.Demandes_avis || [];
      if (avisFilter !== "all") {
        list = list.filter(a => String(a["Statut Réponse"] || "") === avisFilter);
      }
      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state">Aucune demande d'avis dans ce filtre.</div>`;
        return;
      }
      container.innerHTML = list.map(a => {
        const st = String(a["Statut Réponse"] || "Non répondu");
        const isRep = st === "Répondu";
        const safePatientAttr = encodeURIComponent(JSON.stringify({ name: a["Identité Patient"], ipp: a["N° Dossier / IPP"] }));
        const nextStatus = isRep ? "Non répondu" : "Répondu";
        const avisEv = {
          row: a._row || 0,
          patient: a["Identité Patient"] || "",
          ipp: a["N° Dossier / IPP"] || "",
          isoDate: parseFrDateToIso(a["Date Demande"]) || "",
          category: /biopsie/i.test(String(a["Motif de l'avis / Question clinique"] || "") + " " + String(a["Décision & Suite donnée"] || "")) ? "biopsie" : "acte",
          title: a["Motif de l'avis / Question clinique"] || "Demande d'avis"
        };
        return `
          <div class="event-card" style="border-left-color:${isRep ? "var(--success)" : "var(--danger)"};">
            <div class="event-top" onclick="openPatientModal('${safePatientAttr}')">
              <span class="event-time-badge">📅 ${a["Date Demande"] || "-"}</span>
              <span class="pill ${isRep ? "pill-success" : "pill-danger"}">${st}</span>
            </div>
            <div class="event-patient" onclick="openPatientModal('${safePatientAttr}')">
              <span>${a["Identité Patient"] || "-"}</span>
              <span class="event-ipp">${a["N° Dossier / IPP"] && a["N° Dossier / IPP"] !== "Non spécifié" ? a["N° Dossier / IPP"] : ""}</span>
            </div>
            <div style="font-size:11.5px; color:var(--primary); font-weight:700;" onclick="openPatientModal('${safePatientAttr}')">
              ${a["Médecin Demandeur (Service)"] || "-"}
            </div>
            <div class="ev-body-txt" style="font-size:12px; margin-top:4px; font-weight:500;" onclick="openPatientModal('${safePatientAttr}')">
              ${a["Motif de l'avis / Question clinique"] || ""}
            </div>
            <div class="ev-rep-txt" style="font-size:11.5px; margin-top:4px; font-weight:600;" onclick="openPatientModal('${safePatientAttr}')">
              <strong>${formatShortDoc(a["Médecin Répondant (Radio B)"]) || "-"} :</strong> ${a["Décision & Suite donnée"] || "-"}
            </div>
            <div style="margin-top:8px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <button class="btn-icon" onclick="toggleAvisStatus(${a._row}, '${nextStatus}')">
                ${isRep ? "↩️ Non répondu" : "✅ Marquer Répondu"}
              </button>
            </div>
            ${renderBlocNotesHtml(avisEv, `avis-${a._row || 0}-`)}
          </div>
        `;
      }).join("");
    }

    async function toggleAvisStatus(row, newStatus) {
      const savedPin = localStorage.getItem(STORAGE_PIN_KEY);
      if (!savedPin) return;
      const rowNum = Number(row);
      const repondant = "Dr LEFEVRE Thomas Jean";
      let patNorm = "";

      for (const a of (appData.Demandes_avis || [])) {
        if (Number(a._row) === rowNum) {

    async function togglePersoStatus(keyOrRow, newStatus) {
      let targetKey = "";
      try {
        targetKey = decodeURIComponent(String(keyOrRow || ""));
      } catch (e) {
        targetKey = String(keyOrRow || "");
      }
      const rowNum = /^\d+$/.test(targetKey) ? Number(targetKey) : 0;
      const nowIso = new Date().toISOString();
      let savedMap = {};
      try {
        savedMap = JSON.parse(localStorage.getItem(STORAGE_PERSO_KEY) || "{}");
      } catch (e) {}
      for (const k of Object.keys(savedMap)) {
        if (/^\d+$/.test(k)) delete savedMap[k];
      }

      const statusEntry = { status: newStatus, updated_at: nowIso };
      let stableKey = targetKey.includes("__") ? targetKey : "";

      for (const item of (appData.Questions_perso || [])) {
        const itemKey = getPersoStableKey(item);
        if ((stableKey && itemKey === stableKey) || (!stableKey && rowNum > 0 && Number(item._row) === rowNum)) {
          item["Statut"] = newStatus;
          stableKey = itemKey;
        }
      }
      if (stableKey) {
        savedMap[stableKey] = statusEntry;
      }
      for (const defItem of (DEFAULT_QUESTIONS_PERSO || [])) {
        const defKey = getPersoStableKey(defItem);
        if ((stableKey && defKey === stableKey) || (!stableKey && rowNum > 0 && Number(defItem._row) === rowNum)) {
          defItem["Statut"] = newStatus;
        }
      }

      try {
        localStorage.setItem(STORAGE_PERSO_KEY, JSON.stringify(savedMap));
      } catch (e) {}

      try {
        const cachedRaw = localStorage.getItem(STORAGE_CACHE_KEY);
        if (cachedRaw) {
          const cachedObj = JSON.parse(cachedRaw);
          if (cachedObj && cachedObj.data) {
            const cleanPersoStatus = Object.assign({}, cachedObj.data.perso_status || {}, savedMap);
            for (const k of Object.keys(cleanPersoStatus)) {
              if (/^\d+$/.test(k)) delete cleanPersoStatus[k];
            }
            cachedObj.data.perso_status = cleanPersoStatus;
            localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify(cachedObj));
          }
        }
      } catch (e) {}

      updateKpis();
      renderPersoTab();

      // Synchroniser dans PropertiesService d'Apps Script pour persistance multi-appareils (iPhone / Mac) sans créer d'onglet dans le Sheet
      if (stableKey) {
        const btnArrow = document.getElementById("btn-sync-arrow");
        if (btnArrow) btnArrow.classList.add("spinning");
        try {
          await callApi("set_perso_status", { patch: { [stableKey]: statusEntry } });
        } catch (e) {} finally {
          if (btnArrow) btnArrow.classList.remove("spinning");
        }
      }
    }

    function formatDayGroupLabel(isoDate) {
      if (!isoDate) return "Date à définir";
      const [y, m, d] = isoDate.split("-").map(Number);
      const dt = new Date(y, m - 1, d, 12, 0, 0);
      const raw = dt.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      return raw.charAt(0).toUpperCase() + raw.slice(1);
    }

    function renderSuiviTab() {
      const container = document.getElementById("suivi-list-container");
      if (!container) return;
      const q = ((document.getElementById("suivi-search") || {}).value || "").toLowerCase().trim();
      const todayIso = dateToIso(new Date());
      const allTimed = getAllTimedEvents();

      let evs = [];
      if (suiviFilter === "cs_suivi") {
        // CS de suivi des patients traités par Dr T. Lefèvre (ou CS de suivi explicitement rattachée à un patient traité)
        const myGestesByPat = {};
        for (const g of allTimed) {
          if ((g.category === "acte" || g.category === "biopsie") && g.isMine && g.isoDate) {
            const pNorm = normName(g.patient);
            if (pNorm && (!myGestesByPat[pNorm] || g.isoDate < myGestesByPat[pNorm])) {
              myGestesByPat[pNorm] = g.isoDate;
            }
          }
        }
        evs = allTimed.filter(e => {
          if (e.category !== "cs") return false;
          const pNorm = normName(e.patient);
          const gesteIso = myGestesByPat[pNorm];
          if (gesteIso && e.isoDate && e.isoDate > gesteIso) return true;
          if (e.isMine && String(e.catActe || "").toLowerCase().includes("cs de suivi")) return true;
          return false;
        });
      } else {
        evs = allTimed.filter(e => (e.category === "acte" || e.category === "biopsie") && e.isMine);
        if (suiviFilter === "done") {
          // Strictement basé sur la date : un patient ne peut être dans Traités que si la date du bloc est arrivée ou passée
          evs = evs.filter(e => Boolean(e.isoDate && e.isoDate <= todayIso));
        } else if (suiviFilter === "upcoming") {
          evs = evs.filter(e => !e.isoDate || e.isoDate > todayIso);
        }
      }

      if (q) {
        evs = evs.filter(e => {
          const entry = getSuiviEntry(e);
          const hay = `${e.patient} ${e.ipp} ${e.title} ${e.remarques} ${entry.materiel} ${entry.remarques} ${entry.anapath} ${entry.suivi_cs}`.toLowerCase();
          return hay.includes(q);
        });
      }

      if (evs.length === 0) {
        const emptyMsg =
          suiviFilter === "done" ? "Aucun patient traité à ce jour." :
          suiviFilter === "cs_suivi" ? "Aucune CS de suivi programmée pour vos patients traités." :
          "Aucun geste programmé à venir.";
        container.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
        return;
      }

      // Regroupement avec distinction claire par jour
      const dayGroups = [];
      let curDayIso = null;
      let curBucket = null;
      for (const ev of evs) {
        const dKey = ev.isoDate || "nodate";
        if (dKey !== curDayIso) {
          curDayIso = dKey;
          curBucket = { iso: ev.isoDate, label: formatDayGroupLabel(ev.isoDate), items: [] };
          dayGroups.push(curBucket);
        }
        curBucket.items.push(ev);
      }

      const unitWord = suiviFilter === "cs_suivi" ? "CS" : "geste";
      container.innerHTML = dayGroups.map(g => `
        <div class="week-group-header">
          <span>📅 ${g.label}</span>
          <span class="pill pill-cs">${g.items.length} ${unitWord}${g.items.length > 1 && unitWord === "geste" ? "s" : ""}</span>
        </div>
        ${g.items.map(ev => renderEventCard(ev, false, true)).join("")}
      `).join("");
    }

      renderAnnuaireTab();
    }

    function renderAnnuaireTab() {
      const container = document.getElementById("annuaire-list-container");
      const chipsContainer = document.getElementById("annuaire-cat-chips");
      if (!container) return;

      const entries = getAllAnnuaireEntries();
      const categories = ["all", ...Array.from(new Set(entries.map(e => e.category)))];
      if (chipsContainer) {
        chipsContainer.innerHTML = categories.map(cat => {
          const label = cat === "all" ? `Tous (${entries.length})` : cat.replace("Radiologie B — ", "Radio B : ").replace("Services Partenaires ", "");
          const safeCat = cat.replace(/'/g, "\'");
          return `<button class="chip ${annuaireCatFilter === cat ? 'active' : ''}" onclick="setAnnuaireCategory('${safeCat}')">${esc(label)}</button>`;
        }).join("");
      }

      const q = (document.getElementById("annuaire-search")?.value || "").trim().toLowerCase();
      const filtered = entries.filter(e => {
        if (annuaireCatFilter !== "all" && e.category !== annuaireCatFilter) return false;
        if (!q) return true;
        const hay = `${e.name || ""} ${e.role || ""} ${e.phone || ""} ${e.short || ""} ${e.category || ""}`.toLowerCase();
        return hay.includes(q);
      });

      if (!filtered.length) {
        container.innerHTML = `<div class="empty-state">Aucun numéro trouvé pour cette recherche.</div>`;
        return;
      }

      const grouped = {};
      filtered.forEach(e => {
        const c = e.category || "Autres";
        if (!grouped[c]) grouped[c] = [];
        grouped[c].push(e);
      });

      let html = "";
      Object.keys(grouped).forEach(cat => {
        html += `<div style="margin-bottom:14px;">
          <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:var(--primary); margin:10px 0 6px 2px;">${esc(cat)} (${grouped[cat].length})</div>
          <div style="display:flex; flex-direction:column; gap:6px;">`;
        grouped[cat].forEach(item => {
          const rawTel = String(item.phone || "").replace(/[^0-9+]/g, "");
          const canCall = rawTel.length >= 10;
          const isDectOnly = (item.phone || "").toUpperCase().includes("DECT");
          html += `
            <div class="ann-card">
              <div style="min-width:0; flex:1;">
                <div style="font-size:13px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                  <span>${esc(item.name)}</span>
                  ${item.custom ? `<span class="pill pill-success" style="font-size:9px; padding:1px 6px;">Perso</span>` : ``}
                </div>
                <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${esc(item.role || "")}</div>
              </div>
              <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0;">
                ${canCall
                  ? `<a href="tel:${rawTel}" class="ann-call-btn">📞 ${esc(item.phone)}</a>`
                  : `<span class="ann-dect-badge">📟 ${esc(item.phone)}</span>`
                }
                <div style="display:flex; align-items:center; gap:6px;">
                  ${item.short ? `<span class="ann-short-badge">Poste / DECT : <strong>${esc(item.short)}</strong></span>` : ``}
                  ${item.custom ? `<button onclick="deleteCustomAnnuaireEntry('${item.id}')" style="background:none; border:none; color:var(--danger); font-size:11px; cursor:pointer; padding:0 4px;">✕</button>` : ``}
                </div>
              </div>
            </div>`;
        });
        html += `</div></div>`;
      });
      container.innerHTML = html;
    }

    function openAddAnnuaireModal() {
      const body = document.getElementById("modal-body");
      if (!body) return;
      body.innerHTML = `
        <div style="font-size:16px; font-weight:800; color:var(--text); margin-bottom:12px;">➕ Ajouter un numéro à l'annuaire</div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <div>
            <label style="font-size:11px; color:var(--text-muted); display:block; margin-bottom:4px;">Nom / Salle / Correspondant *</label>
            <input id="new-ann-name" type="text" class="search-input" style="padding-left:12px;" placeholder="Ex: Console Scanner / Salle Staff..." />
          </div>
          <div>
            <label style="font-size:11px; color:var(--text-muted); display:block; margin-bottom:4px;">Catégorie</label>
            <select id="new-ann-cat" class="search-input" style="padding-left:12px;">
              <option value="Radiologie B — Secrétariats & Consoles">Radiologie B — Secrétariats & Consoles</option>
              <option value="Radiologie B — Équipe Médicale (Chefs & Seniors)">Radiologie B — Équipe Médicale (Chefs & Seniors)</option>
              <option value="Services Partenaires (Ortho, Rhumato, Anesth, Anapath)">Services Partenaires (Ortho, Rhumato, Anesth, Anapath)</option>
              <option value="Laboratoires, Pharmacie & Administration (DAM)">Laboratoires, Pharmacie & Administration (DAM)</option>
            </select>
          </div>
          <div>
            <label style="font-size:11px; color:var(--text-muted); display:block; margin-bottom:4px;">Numéro complet (ex: 01 58 41 XX XX) ou DECT *</label>
            <input id="new-ann-phone" type="text" class="search-input" style="padding-left:12px;" placeholder="Ex: 01 58 41 24 83" />
          </div>
          <div>
            <label style="font-size:11px; color:var(--text-muted); display:block; margin-bottom:4px;">Poste abrégé 5 chiffres / DECT</label>
            <input id="new-ann-short" type="text" class="search-input" style="padding-left:12px;" placeholder="Ex: 12483" />
          </div>
          <div>
            <label style="font-size:11px; color:var(--text-muted); display:block; margin-bottom:4px;">Fonction / Détails</label>
            <input id="new-ann-role" type="text" class="search-input" style="padding-left:12px;" placeholder="Ex: Sous-sol Pavillon Ollier" />
          </div>
          <div style="display:flex; gap:8px; margin-top:6px;">
            <button class="chip" style="flex:1; padding:10px; text-align:center;" onclick="closeModal()">Annuler</button>
            <button class="chip active" style="flex:1; padding:10px; text-align:center; border:none; cursor:pointer;" onclick="saveNewAnnuaireEntry()">Enregistrer</button>
          </div>
        </div>
      `;
      document.getElementById("patient-modal").classList.add("open");
    }

    function saveNewAnnuaireEntry() {
      const name = (document.getElementById("new-ann-name")?.value || "").trim();
      const category = document.getElementById("new-ann-cat")?.value || "Radiologie B — Secrétariats & Consoles";
      const phone = (document.getElementById("new-ann-phone")?.value || "").trim();
      const short = (document.getElementById("new-ann-short")?.value || "").trim();
      const role = (document.getElementById("new-ann-role")?.value || "").trim();
      if (!name || !phone) {
        alert("Veuillez renseigner au moins le nom et le numéro.");
        return;
      }
      let custom = [];
      try { custom = JSON.parse(localStorage.getItem(STORAGE_CUSTOM_ANNUAIRE_KEY) || "[]"); } catch (e) { custom = []; }
      custom.unshift({
        id: "cust_" + Date.now(),
        category,
        name,
        role: role || "Ajout personnalisé",
        phone,
        short,
        custom: true
      });
      localStorage.setItem(STORAGE_CUSTOM_ANNUAIRE_KEY, JSON.stringify(custom));
      closeModal();
      renderAnnuaireTab();
    }

    function deleteCustomAnnuaireEntry(id) {
      let custom = [];
      try { custom = JSON.parse(localStorage.getItem(STORAGE_CUSTOM_ANNUAIRE_KEY) || "[]"); } catch (e) { custom = []; }
      custom = custom.filter(x => x.id !== id);
      localStorage.setItem(STORAGE_CUSTOM_ANNUAIRE_KEY, JSON.stringify(custom));
      renderAnnuaireTab();
    }

    const STORAGE_THEME_KEY = "cochin_theme_v1";

    function syncThemeButtonIcon() {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      const moon = document.getElementById("icon-theme-moon");
      const sun = document.getElementById("icon-theme-sun");
      const btn = document.getElementById("btn-theme-toggle");
      if (moon) moon.style.display = isDark ? "none" : "block";
      if (sun) sun.style.display = isDark ? "block" : "none";
      if (btn) {
        btn.title = isDark ? "Passer en mode clair" : "Passer en mode sombre";
        btn.setAttribute("aria-label", isDark ? "Passer en mode clair" : "Passer en mode sombre");
      }
      const metaTheme = document.getElementById("meta-theme-color");
      if (metaTheme) metaTheme.setAttribute("content", isDark ? "#0B1120" : "#F8FAFC");
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      if (isDark) {
        document.documentElement.removeAttribute("data-theme");
        try { localStorage.setItem(STORAGE_THEME_KEY, "light"); } catch (_) {}
      } else {
        document.documentElement.setAttribute("data-theme", "dark");
        try { localStorage.setItem(STORAGE_THEME_KEY, "dark"); } catch (_) {}
      }
      syncThemeButtonIcon();
    }

    function switchTab(tab) {
      currentTab = tab;
      ["agenda", "activite", "avis", "perso", "suivi", "patients", "annuaire"].forEach(t => {
        const sec = document.getElementById("tab-" + t);
        const nav = document.getElementById("nav-" + t);
        if (sec) sec.style.display = t === tab ? "block" : "none";
        if (nav) nav.classList.toggle("active", t === tab);
      });
      updateBottomKpiActiveState();
      renderCurrentTab();
    }

    function renderCurrentTab() {
      updateBottomKpiActiveState();
      if (currentTab === "agenda") renderCalendar();
      else if (currentTab === "activite") renderActiviteTab();
      else if (currentTab === "avis") renderAvisTab();
      else if (currentTab === "perso") renderPersoTab();
      else if (currentTab === "suivi") renderSuiviTab();
      else if (currentTab === "patients") renderPatientsTab();
      else if (currentTab === "annuaire") renderAnnuaireTab();
    }

    window.addEventListener("DOMContentLoaded", () => {
      syncThemeButtonIcon();
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
      initPullToRefresh();
      loadSuiviBlocMap(null);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && localStorage.getItem(STORAGE_PIN_KEY)) {
          syncFromCloud(false);
        }
      });
      appData.Questions_perso = loadPersoWithLocalStatus(null);
      appData.Demandes_avis = applyLocalAvisStatus(appData.Demandes_avis);
      updateKpis();
      renderCurrentTab();
      const savedPin = localStorage.getItem(STORAGE_PIN_KEY);
      const cached = localStorage.getItem(STORAGE_CACHE_KEY);
      if (savedPin) {
        document.getElementById("lock-screen").classList.add("hidden");
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (parsed.data) applySheetData(parsed.data, parsed.synced_at);
          } catch (e) {}
        }
        syncFromCloud(false);
      }
    });
  </script>
</body>
</html>
