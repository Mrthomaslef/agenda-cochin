<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cochin RI" />
  <meta name="theme-color" content="#0B1120" />
  <title>Cochin RI — Agenda & Patients (Dr Thomas Lefèvre)</title>
  <style>
    :root {
      --bg: #0B1120;
      --bg-card: #131C31;
      --bg-card-hover: #1A2642;
      --bg-elevated: #1E293B;
      --border: rgba(148, 163, 184, 0.14);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #38BDF8;
      --primary-dark: #0284C7;
      --acte: #F43F5E;
      --acte-bg: rgba(244, 63, 94, 0.14);
      --biopsie: #A855F7;
      --biopsie-bg: rgba(168, 85, 247, 0.15);
      --cs: #38BDF8;
      --cs-bg: rgba(56, 189, 248, 0.14);
      --img: #10B981;
      --img-bg: rgba(16, 185, 129, 0.14);
      --warn: #F59E0B;
      --warn-bg: rgba(245, 158, 11, 0.15);
      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.18);
      --success: #22C55E;
      --success-bg: rgba(34, 197, 94, 0.16);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(82px + var(--safe-bottom));
      overflow-x: hidden;
    }

    /* LOCK SCREEN */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, #1E293B 0%, #0B1120 75%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #lock-screen.hidden {
      display: none;
    }
    .lock-card {
      width: 100%;
      max-width: 360px;
      background: rgba(19, 28, 49, 0.9);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
    }
    .lock-logo {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0284C7, #38BDF8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 14px;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
    }
    .lock-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .lock-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 0 22px;
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 22px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      transition: all 0.15s ease;
    }
    .pin-dot.filled {
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }
    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 260px;
      margin: 0 auto;
    }
    .pin-btn {
      height: 58px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 22px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .pin-btn:active {
      background: var(--primary-dark);
      transform: scale(0.96);
    }
    .lock-error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 14px;
      min-height: 18px;
    }

    /* HEADER */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 17, 32, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: calc(10px + var(--safe-top)) 16px 12px;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-badge {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, #0284C7, #38BDF8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      color: #fff;
      flex-shrink: 0;
    }
    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      line-height: 1.2;
    }
    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
      margin: 2px 0 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-icon {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-icon:active {
      background: var(--bg-card-hover);
    }
    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }
    .sync-dot.loading {
      background: var(--warn);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* KPI STRIP */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px 16px 4px;
    }
    .kpi-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
      cursor: pointer;
    }
    .kpi-val {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.1;
    }
    .kpi-lbl {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MAIN CONTAINER */
    .main-content {
      padding: 12px 16px;
      max-width: 760px;
      margin: 0 auto;
    }

    /* SEGMENTED CONTROL */
    .segmented {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 12px;
    }
    .seg-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 8px 6px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .seg-btn.active {
      background: var(--primary-dark);
      color: #fff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
    }

    /* DATE NAVIGATOR */
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 10px;
      margin-bottom: 12px;
    }
    .nav-arrow {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .date-nav-center {
      text-align: center;
      cursor: pointer;
    }
    .date-nav-title {
      font-size: 15px;
      font-weight: 700;
      text-transform: capitalize;
    }
    .date-nav-sub {
      font-size: 11px;
      color: var(--primary);
      margin-top: 2px;
    }

    /* VACATION BANNER (PLANNING ANNE-MARIE) */
    .vac-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .vac-card {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(19, 28, 49, 0.95));
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .vac-period {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--primary);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .vac-main {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .vac-note {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* EVENT CARDS */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .event-card:active {
      transform: scale(0.99);
      background: var(--bg-card-hover);
    }
    .event-card.type-acte { border-left-color: var(--acte); }
    .event-card.type-biopsie { border-left-color: var(--biopsie); }
    .event-card.type-cs { border-left-color: var(--cs); }
    .event-card.type-img { border-left-color: var(--img); }

    .event-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .event-time-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 7px;
      background: var(--bg-elevated);
      color: var(--text);
    }
    .pill {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .pill-acte { background: var(--acte-bg); color: #FDA4AF; }
    .pill-biopsie { background: var(--biopsie-bg); color: #D8B4FE; }
    .pill-cs { background: var(--cs-bg); color: #7DD3FC; }
    .pill-img { background: var(--img-bg); color: #6EE7B7; }
    .pill-warn { background: var(--warn-bg); color: #FCD34D; }
    .pill-danger { background: var(--danger-bg); color: #FCA5A5; }
    .pill-success { background: var(--success-bg); color: #86EFAC; }

    .event-patient {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .event-ipp {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .event-title {
      font-size: 13px;
      font-weight: 600;
      color: #E2E8F0;
      margin-top: 3px;
    }
    .event-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .alert-anticoag {
      margin-top: 7px;
      padding: 5px 9px;
      border-radius: 8px;
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FECACA;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* WEEK VIEW */
    .week-day-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .week-day-card.today {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.3);
    }
    .week-day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .week-day-name {
      font-size: 14px;
      font-weight: 700;
      text-transform: capitalize;
    }
    .week-vac-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .week-vac-chip {
      font-size: 11px;
      background: var(--bg-elevated);
      border: 1px solid rgba(56, 189, 248, 0.22);
      color: #BAE6FD;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 600;
    }

    /* MONTH VIEW */
    .month-grid-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }
    .month-cell {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      min-height: 64px;
      padding: 5px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
    }
    .month-cell.other-month {
      opacity: 0.32;
    }
    .month-cell.selected {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.14);
    }
    .month-cell.today .month-day-num {
      background: var(--primary);
      color: #0B1120;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .month-day-num {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .month-vac-tag {
      font-size: 8.5px;
      font-weight: 700;
      color: #93C5FD;
      text-align: center;
      line-height: 1.1;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 1px 3px;
      border-radius: 4px;
      background: rgba(2, 132, 199, 0.2);
      margin-bottom: 3px;
    }
    .month-dots {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: auto;
    }
    .m-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .m-dot.acte { background: var(--acte); }
    .m-dot.biopsie { background: var(--biopsie); }
    .m-dot.cs { background: var(--cs); }
    .m-dot.img { background: var(--img); }

    /* SEARCH BAR */
    .search-box {
      position: relative;
      margin-bottom: 12px;
    }
    .search-input {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      padding: 0 14px 0 38px;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--primary);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 15px;
    }

    /* FILTER CHIPS */
    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary);
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 17, 32, 0.94);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 6px 4px calc(6px + var(--safe-bottom));
      z-index: 200;
    }
    .nav-item {
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 4px 2px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }
    .nav-item.active {
      color: var(--primary);
    }
    .nav-icon {
      font-size: 19px;
      line-height: 1;
    }
    .nav-badge {
      position: absolute;
      top: 0;
      right: 18%;
      background: var(--danger);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 999px;
    }

    /* PATIENT MODAL (BOTTOM SHEET) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-sheet {
      width: 100%;
      max-width: 640px;
      max-height: 88vh;
      background: #111827;
      border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 16px 18px calc(24px + var(--safe-bottom));
      overflow-y: auto;
      animation: slideUp 0.2s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 42px;
      height: 5px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.35);
      margin: 0 auto 14px;
    }
    .detail-block {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .detail-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .detail-value {
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--text);
    }
    .quick-actions {
      display: flex;
      gap: 8px;
      margin: 12px 0;
      flex-wrap: wrap;
    }
    .action-btn {
      flex: 1;
      min-width: 110px;
      height: 40px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      cursor: pointer;
    }
    .action-btn.primary {
      background: var(--primary-dark);
      border-color: var(--primary);
      color: #fff;
    }
    .empty-state {
      text-align: center;
      padding: 28px 16px;
      color: var(--text-muted);
      font-size: 13px;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 14px;
    }
  </style>
</head>
<body>

  <!-- ÉCRAN DE VERROUILLAGE PAR CODE PIN -->
  <div id="lock-screen">
    <div class="lock-card">
      <div class="lock-logo">🏥</div>
      <h2 class="lock-title">Cochin Radiologie B</h2>
      <p class="lock-sub">Agenda Interventionnel & Patients — Dr T. Lefèvre</p>
      <div class="pin-dots">
        <div class="pin-dot" id="dot-0"></div>
        <div class="pin-dot" id="dot-1"></div>
        <div class="pin-dot" id="dot-2"></div>
        <div class="pin-dot" id="dot-3"></div>
      </div>
      <div class="pin-pad">
        <button class="pin-btn" onclick="pressPin('1')">1</button>
        <button class="pin-btn" onclick="pressPin('2')">2</button>
        <button class="pin-btn" onclick="pressPin('3')">3</button>
        <button class="pin-btn" onclick="pressPin('4')">4</button>
        <button class="pin-btn" onclick="pressPin('5')">5</button>
        <button class="pin-btn" onclick="pressPin('6')">6</button>

      Demandes_avis: [],
      Consultations: [],
      Imagerie_Anesthesie: [],
      Biopsies: [],
      actes: []
    };

    function pressPin(digit) {
      if (enteredPin.length >= 4) return;
      enteredPin += digit;
      updatePinDots();
      if (enteredPin.length === 4) {
        verifyPinAndLoad(enteredPin);
      }
    }

    function backspacePin() {
      enteredPin = enteredPin.slice(0, -1);
      updatePinDots();
    }

    function clearPin() {
      enteredPin = "";
      updatePinDots();
      document.getElementById("lock-error").textContent = "";
    }

    function updatePinDots() {
      for (let i = 0; i < 4; i++) {
        const d = document.getElementById("dot-" + i);
        if (d) d.classList.toggle("filled", i < enteredPin.length);
      }
    }

    async function verifyPinAndLoad(pin) {
      const errEl = document.getElementById("lock-error");
      errEl.textContent = "Vérification et synchronisation...";
      try {
        const resp = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-agenda-pin": pin },
          body: JSON.stringify({ pin, action: "get" })
        });
        const res = await resp.json();
        if (!resp.ok || !res.ok) {
          errEl.textContent = "Code PIN incorrect.";
          enteredPin = "";
          updatePinDots();
          return;
        }
        localStorage.setItem(STORAGE_PIN_KEY, pin);
        localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify(res));
        document.getElementById("lock-screen").classList.add("hidden");
        applySheetData(res.data, res.synced_at);
      } catch (e) {
        errEl.textContent = "Erreur réseau : vérifiez votre connexion.";
        enteredPin = "";
        updatePinDots();
      }
    }

    async function syncFromCloud(showIndicator) {
      const savedPin = localStorage.getItem(STORAGE_PIN_KEY);
      if (!savedPin) return;
      const dot = document.getElementById("sync-dot");
      const txt = document.getElementById("sync-status-text");
      if (showIndicator) {
        dot.classList.add("loading");
        txt.textContent = "Synchronisation avec Google Sheets...";
      }
      try {
        const resp = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-agenda-pin": savedPin },
          body: JSON.stringify({ pin: savedPin, action: "get" })
        });
        if (resp.status === 401) {
          localStorage.removeItem(STORAGE_PIN_KEY);
          document.getElementById("lock-screen").classList.remove("hidden");
          return;
        }
        const res = await resp.json();
        if (res.ok && res.data) {
          localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify(res));
          applySheetData(res.data, res.synced_at);
        }
      } catch (e) {
        txt.textContent = "Mode hors-ligne (dernière synchro en cache)";
      } finally {
        dot.classList.remove("loading");
      }
    }

    function applySheetData(data, syncedAt) {
      appData = {
        Data: data.Data || [],
        Demandes_avis: data.Demandes_avis || [],
        Consultations: data.Consultations || [],
        Imagerie_Anesthesie: data.Imagerie_Anesthesie || [],
        Biopsies: data.Biopsies || [],
        actes: data.actes || []
      };
      const timeStr = syncedAt ? new Date(syncedAt).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "";
      document.getElementById("sync-status-text").textContent =
        "Pr A. Feydy • Sync Google Sheet " + (timeStr ? "à " + timeStr : "OK");

      updateKpis();
      renderCurrentTab();
    }

    function updateKpis() {
      document.getElementById("kpi-actes").textContent = appData.actes.length;
      document.getElementById("kpi-biopsies").textContent = appData.Biopsies.length;
      document.getElementById("kpi-cs").textContent = appData.Consultations.length;
      const nonRep = appData.Demandes_avis.filter(a => String(a["Statut Réponse"] || "").toLowerCase().includes("non")).length;
      const totalAvis = appData.Demandes_avis.length;
      document.getElementById("kpi-avis").textContent = nonRep > 0 ? `${nonRep} à rép.` : `${totalAvis} rép.`;
      const badge = document.getElementById("badge-avis-non");
      if (nonRep > 0) {
        badge.style.display = "inline-block";
        badge.textContent = nonRep;
      } else {
        badge.style.display = "none";
      }
    }

    function parseFrDateToIso(dStr) {
      if (!dStr) return null;
      const m = String(dStr).trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (!m) return null;
      return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    }

    function dateToIso(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function getVacationForIso(isoDate) {
      if (ANNE_MARIE_EXACT_DAYS[isoDate]) {
        return ANNE_MARIE_EXACT_DAYS[isoDate];
      }
      const [y, m, d] = isoDate.split("-").map(Number);
      const dt = new Date(y, m - 1, d, 12, 0, 0);
      const dow = dt.getDay();
      if (dow === 0 || dow === 6) {
        return { am: "Week-end", pm: "Week-end", note: "", short: "" };
      }
      if (dt < new Date(2026, 10, 2)) {
        return { am: "Avant prise de poste Cochin (début le 02/11)", pm: "-", note: "", short: "" };
      }
      const def = MAQUETTE_DEFAULT_BY_DOW[dow];
      return { am: def.am, pm: def.pm, note: "Maquette mensuelle type (Anne-Marie Fortin)", short: def.short };
    }

    function getAllTimedEvents() {
      const events = [];
      for (const a of appData.actes) {
        events.push({
          category: "acte",
          badgeLabel: "Acte RI",
          isoDate: parseFrDateToIso(a["Date"]),
          dateStr: a["Date"],
          horaire: a["Horaire"] || "-",
          patient: a["Identité Patient"],
          ipp: a["N° Dossier / IPP"],
          medecin: a["Médecin en charge"],
          title: a["Type d'acte / Consultation"],
          lieu: a["Lieu / Modalité"],
          remarques: a["Instructions & Remarques"],
          materiel: a["Matériel utilisé"] || ""
        });
      }
      for (const b of appData.Biopsies) {
        events.push({
          category: "biopsie",
          badgeLabel: "Biopsie",
          isoDate: parseFrDateToIso(b["Date"]),
          dateStr: b["Date"],
          horaire: b["Horaire"] || "-",
          patient: b["Identité Patient"],
          ipp: b["N° Dossier / IPP"],
          medecin: b["Médecin en charge"],
          title: b["Type d'acte / Consultation"],
          lieu: b["Lieu / Modalité"],
          remarques: b["Instructions & Remarques"],
          materiel: b["Matériel utilisé"] || ""
        });
      }
      for (const c of appData.Consultations) {
        events.push({
          category: "cs",
          badgeLabel: String(c["Type d'acte / Consultation"] || "").toLowerCase().includes("télé") ? "Télécs" : "Consult",
          isoDate: parseFrDateToIso(c["Date"]),
          dateStr: c["Date"],
          horaire: c["Horaire"] || "-",
          patient: c["Identité Patient"],
          ipp: c["N° Dossier / IPP"],
          medecin: c["Médecin en charge"],
          title: c["Type d'acte / Consultation"],
          lieu: c["Lieu / Modalité"],
          remarques: c["Instructions & Remarques"],
          materiel: ""
        });
      }
      for (const im of appData.Imagerie_Anesthesie) {
        const isAnesth = String(im["Type d'acte / Consultation"] || "").toLowerCase().includes("anesth");
        events.push({
          category: "img",
          badgeLabel: isAnesth ? "CS Anesth" : "Imagerie",
          isoDate: parseFrDateToIso(im["Date"]),
          dateStr: im["Date"],
          horaire: im["Horaire"] || "-",
          patient: im["Identité Patient"],
          ipp: im["N° Dossier / IPP"],
          medecin: im["Médecin en charge"],
          title: im["Type d'acte / Consultation"],
          lieu: im["Lieu / Modalité"],
          remarques: im["Instructions & Remarques"],
          materiel: ""
        });
      }
      events.sort((x, y) => parseMinutes(x.horaire) - parseMinutes(y.horaire));
      return events;
    }

    function parseMinutes(h) {
      const m = String(h || "").match(/(\d{1,2})\s*[h:]\s*(\d{0,2})/i);
      if (!m) return 9999;
      return parseInt(m[1], 10) * 60 + (m[2] ? parseInt(m[2], 10) : 0);
    }

    function normName(s) {
      return String(s || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\b(mr|mme|mlle|m\.|dr|pr)\b/g, "")
        .replace(/[^a-z0-9]/g, "");
    }

    function findPatientMasterRecord(patientName, ipp) {
      const cleanIpp = String(ipp || "").replace(/[^0-9]/g, "");
      const nTarget = normName(patientName);
      for (const row of appData.Data) {
        const rIpp = String(row["N° Dossier / IPP"] || "").replace(/[^0-9]/g, "");
        const rName = normName(row["Identité Patient"]);
        if (cleanIpp && cleanIpp.length >= 7 && cleanIpp === rIpp) return row;
        if (nTarget && rName && (nTarget === rName || (nTarget.length >= 7 && rName.includes(nTarget)) || (rName.length >= 7 && nTarget.includes(rName)))) {
          return row;
        }
      }
      return null;
    }

    function detectAnticoagAlert(text) {
      const t = String(text || "");
      if (/eliquis|apixaban|plavix|clopidogrel|kard[eé]gic|xarelto|pradaxa|anticoag|h[eé]mostase/i.test(t)) {
        return t;
      }
      return null;
    }

        ev.category === "acte" ? "pill-acte" :
        ev.category === "biopsie" ? "pill-biopsie" :
        ev.category === "cs" ? "pill-cs" : "pill-img";

      const safePatientAttr = encodeURIComponent(JSON.stringify({ name: ev.patient, ipp: ev.ipp }));

      return `

          <div class="event-top">
            <span class="event-time-badge">
              🕒 ${showDate ? `${ev.dateStr} • ` : ""}${ev.horaire}
            </span>
            <span class="pill ${pillClass}">${ev.badgeLabel}</span>
          </div>
          <div class="event-patient">
            <span>${ev.patient}</span>
            <span class="event-ipp">${ev.ipp && ev.ipp !== "Non spécifié" ? "IPP " + ev.ipp : ""}</span>

          <div class="event-title">${ev.title}</div>

            <span>👨‍⚕️ ${ev.medecin || "-"}</span>

    function navigatePeriod(delta) {
      if (calendarView === "day") {
        selectedDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate() + delta, 12, 0, 0);
      } else if (calendarView === "week") {
        selectedDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate() + delta * 7, 12, 0, 0);
      } else {
        selectedDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth() + delta, 1, 12, 0, 0);
      }
      renderCalendar();
    }

    function goToday() {
      const now = new Date();
      if (now < new Date(2026, 10, 2)) {
        selectedDate = new Date(2026, 10, 2, 12, 0, 0);
      } else {
        selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
      }
      switchTab("agenda");
      setCalendarView("day");
    }

    function getMondayOf(d) {
      const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0);
      const day = dt.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      dt.setDate(dt.getDate() + diff);
      return dt;
    }

    function renderCalendar() {
      const container = document.getElementById("calendar-container");
      const titleEl = document.getElementById("period-title");
      const subEl = document.getElementById("period-sub");
      const allEvents = getAllTimedEvents();

      if (calendarView === "day") {
        const iso = dateToIso(selectedDate);
        titleEl.textContent = selectedDate.toLocaleDateString("fr-FR", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });
        const vac = getVacationForIso(iso);
        subEl.textContent = vac.note || "Planning Service de Radiologie B — Hôpital Cochin";

        const dayEvents = allEvents.filter(e => e.isoDate === iso);

        let html = `
          <div class="vac-grid">
            <div class="vac-card">
              <div class="vac-period"><span>☀️ Matin</span><span>Planning Senior</span></div>
              <div class="vac-main">${vac.am}</div>
            </div>
            <div class="vac-card">
              <div class="vac-period"><span>🌤️ Après-midi</span><span>Planning Senior</span></div>
              <div class="vac-main">${vac.pm}</div>
            </div>
          </div>
          <div class="section-label">
            <span>Patients programmés ce jour (${dayEvents.length})</span>
            <span>Tap pour ouvrir le dossier</span>
          </div>
        `;

        if (dayEvents.length === 0) {
          html += `<div class="empty-state">Aucun patient programmé à cette date.<br><span style="font-size:11px;">Utilisez les flèches ‹ › ou passez en vue Semaine / Mois.</span></div>`;
        } else {
          html += dayEvents.map(ev => renderEventCard(ev, false)).join("");
        }
        container.innerHTML = html;

      } else if (calendarView === "week") {
        const mon = getMondayOf(selectedDate);
        const fri = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 4, 12, 0, 0);
        titleEl.textContent = `Lun ${mon.getDate()}/${mon.getMonth() + 1} au Ven ${fri.getDate()}/${fri.getMonth() + 1}/${fri.getFullYear()}`;
        subEl.textContent = "Planning de la semaine (Vacations Anne-Marie + Patients)";

        let html = "";
        for (let i = 0; i < 5; i++) {
          const cur = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i, 12, 0, 0);
          const iso = dateToIso(cur);
          const vac = getVacationForIso(iso);
          const dayEvs = allEvents.filter(e => e.isoDate === iso);
          const dayName = cur.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

          html += `
            <div class="week-day-card">
              <div class="week-day-header" onclick="selectDayFromCalendar('${iso}')">
                <span class="week-day-name">${dayName}</span>
                <span class="pill pill-cs">${dayEvs.length} patient${dayEvs.length > 1 ? "s" : ""} ›</span>
              </div>
              <div class="week-vac-pills">
                <span class="week-vac-chip">☀️ Matin : ${vac.am}</span>
                <span class="week-vac-chip">🌤️ AM : ${vac.pm}</span>
              </div>
              ${dayEvs.length > 0 ? dayEvs.map(ev => renderEventCard(ev, false)).join("") : `<div style="font-size:12px; color:var(--text-muted);">Aucun patient spécifique inscrit sur ce jour.</div>`}
            </div>
          `;
        }
        container.innerHTML = html;

      } else {
        // VUE MOIS
        const year = selectedDate.getFullYear();
        const month = selectedDate.getMonth();
        titleEl.textContent = new Date(year, month, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
        subEl.textContent = "Touchez un jour pour afficher ses vacations et ses patients";

        const firstDay = new Date(year, month, 1, 12, 0, 0);
        const startOffset = (firstDay.getDay() + 6) % 7; // Lundi = 0
        const gridStart = new Date(year, month, 1 - startOffset, 12, 0, 0);

        let html = `
          <div class="month-grid-header">
            <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
          </div>
          <div class="month-grid">
        `;

        const selectedIso = dateToIso(selectedDate);
        const todayIso = dateToIso(new Date());

        for (let i = 0; i < 42; i++) {
          const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i, 12, 0, 0);
          const iso = dateToIso(cellDate);
          const isOtherMonth = cellDate.getMonth() !== month;
          const evs = allEvents.filter(e => e.isoDate === iso);
          const vac = getVacationForIso(iso);

          let shortVac = "";
          const dow = cellDate.getDay();
          if (dow >= 1 && dow <= 5 && cellDate >= new Date(2026, 10, 2)) {
            if (vac.am.includes("FÉRIÉ")) shortVac = "Férié";
            else if (dow === 1) shortVac = "CS/UCSA";
            else if (dow === 2) shortVac = "TDM Ach.1";
            else if (dow === 3) shortVac = "Gestes/CS";
            else if (dow === 4) shortVac = "Libre/Bio";
            else if (dow === 5) shortVac = "Écho/IRM";
          }

          const dotsHtml = evs.slice(0, 6).map(e => `<span class="m-dot ${e.category}"></span>`).join("");

          html += `
            <div class="month-cell ${isOtherMonth ? "other-month" : ""} ${iso === selectedIso ? "selected" : ""} ${iso === todayIso ? "today" : ""}" onclick="selectDayFromMonth('${iso}')">
              <div class="month-day-num">${cellDate.getDate()}</div>
              ${shortVac ? `<div class="month-vac-tag">${shortVac}</div>` : ""}
              <div class="month-dots">${dotsHtml}</div>
            </div>
          `;
        }
        html += `</div>`;

        // Afficher aussi le résumé du jour sélectionné sous le calendrier mensuel
        const selEvs = allEvents.filter(e => e.isoDate === selectedIso);
        const selVac = getVacationForIso(selectedIso);
        const selTitle = selectedDate.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
        html += `
          <div class="section-label" style="margin-top:16px;">
            <span>Détail du ${selTitle} (${selEvs.length} RDV)</span>
            <span style="color:var(--primary); cursor:pointer;" onclick="setCalendarView('day')">Ouvrir vue Jour ›</span>
          </div>
          <div class="vac-grid">
            <div class="vac-card"><div class="vac-period">☀️ Matin</div><div class="vac-main">${selVac.am}</div></div>
            <div class="vac-card"><div class="vac-period">🌤️ Après-midi</div><div class="vac-main">${selVac.pm}</div></div>
          </div>
          ${selEvs.map(ev => renderEventCard(ev, false)).join("")}
        `;
        container.innerHTML = html;
      }
    }

      try {
        await fetch(API_URL, {

          headers: { "Content-Type": "application/json", "x-agenda-pin": savedPin },

            pin: savedPin,
            action: "toggle_avis",
            row,
            status: newStatus,

        ` : ""}

        <div class="quick-actions">
          ${ipp && ipp !== "Non spécifié" ? `<button class="action-btn primary" onclick="copyText('${ipp}', this)">📋 Copier IPP (${ipp})</button>` : ""}
          ${phoneMatch ? `<a class="action-btn" href="tel:${phoneMatch[0].replace(/[^0-9+]/g, '')}">📞 Appeler</a>` : ""}
          ${emailMatch ? `<a class="action-btn" href="mailto:${emailMatch[0]}">✉️ Email</a>` : ""}
        </div>

        <div class="detail-block">
          <div class="detail-label">Indication & Geste prévu</div>
          <div class="detail-value"><strong>${interv}</strong></div>
        </div>

        <div class="detail-block">
          <div class="detail-label">Parcours & Rendez-vous programmés</div>
          <div class="detail-value">${rdvTimelineHtml}</div>
        </div>

        <div class="detail-block">
          <div class="detail-label">Instructions cliniques & Prise en charge</div>
          <div class="detail-value">${remarques}</div>
        </div>

        <div class="detail-block">
          <div class="detail-label">Coordonnées / Antécédents / Traitements</div>
          <div class="detail-value">${coord}</div>
        </div>

        <div class="detail-block">
          <div class="detail-label">Médecin Demandeur & Référent Radio B</div>
          <div class="detail-value">
            <strong>Demandeur :</strong> ${corresp}<br>
            <strong>Référent Cochin :</strong> ${refDoc}
          </div>
        </div>
      `;

      document.getElementById("patient-modal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("patient-modal").classList.remove("open");
    }

    function copyText(txt, btnEl) {
      navigator.clipboard.writeText(txt);
      const orig = btnEl.innerHTML;
      btnEl.innerHTML = "✅ IPP Copié !";
      setTimeout(() => { btnEl.innerHTML = orig; }, 1600);
    }

    function switchTab(tab) {
      currentTab = tab;
      ["agenda", "actes", "avis", "cs", "patients"].forEach(t => {
        document.getElementById("tab-" + t).style.display = t === tab ? "block" : "none";
        document.getElementById("nav-" + t).classList.toggle("active", t === tab);
      });
      renderCurrentTab();
    }

    function renderCurrentTab() {
      if (currentTab === "agenda") renderCalendar();
      else if (currentTab === "actes") renderActesTab();
      else if (currentTab === "avis") renderAvisTab();
      else if (currentTab === "cs") renderCsTab();
      else if (currentTab === "patients") renderPatientsTab();
    }

    // INITIALISATION
    window.addEventListener("DOMContentLoaded", () => {
      const savedPin = localStorage.getItem(STORAGE_PIN_KEY);
      const cached = localStorage.getItem(STORAGE_CACHE_KEY);
      if (savedPin) {
        document.getElementById("lock-screen").classList.add("hidden");
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (parsed.data) applySheetData(parsed.data, parsed.synced_at);
          } catch (e) {}
        }
        syncFromCloud(true);
      }
    });
  </script>
</body>
</html>
