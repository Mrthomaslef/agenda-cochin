      const docMatch = fullCtx.match(/adressé[e]?\s+par\s+(?:le\s+)?((?:Pr|Dr|Docteur|Professeur)\.?\s+(?:[A-ZÉÈÊËÀÂÎÏÔÙÛÇ][a-zéèêëàâîïôùûç\-]*\.?\s*)+(?:(?:&|et)\s*(?:Pr|Dr|Docteur|Professeur)\.?\s+(?:[A-ZÉÈÊËÀÂÎÏÔÙÛÇ][a-zéèêëàâîïôùûç\-]*\.?\s*)+)?)/i);
      const refDoc = docMatch ? docMatch[1].trim() : null;

      // 1. Ablation de tumeur desmoïde / Cryothérapie sous contrôle scanner (Trame Word sans inventer la topographie)
      if (gType === "cryo_desmoide") {
        const isDesmoide = /desmo[ïi]de/i.test(fullCtx);
        const hasBiopsie = /biopsie/i.test(fullCtx);
        let desmoLoc = "[<localisation à préciser>]";
        if (/flanc\s+gauche/i.test(fullCtx)) desmoLoc = "du flanc gauche";
        else if (/sus[\s\-]*claviculaire/i.test(fullCtx)) desmoLoc = "du creux sus-claviculaire";
        else if (/paravertebral|paravertébral/i.test(fullCtx)) desmoLoc = `du nodule paravertébral ${sideStr || "[<côté>]"}`;
        else if (/hanche/i.test(fullCtx)) desmoLoc = `de la hanche ${sideStr ? sideStr : "[<droite / gauche>]"}`;
        else if (/tcg|cellules\s+géantes/i.test(fullCtx)) desmoLoc = `du genou ${sideStr ? sideStr : "[<droit / gauche>]"}`;
        else if (/chondroblastome/i.test(fullCtx)) desmoLoc = `du genou ${sideStr ? sideStr : "[<droit / gauche>]"}`;
        else if (/masse\s+pleurale|t7/i.test(fullCtx)) desmoLoc = "thoracique pariétale droite (T7)";
        else if (/trapèze|trapeze/i.test(fullCtx)) desmoLoc = "du trapèze";

        const titleLine1 = isDesmoide
          ? "Ablation de tumeur desmoïde"
          : (hasBiopsie ? "Biopsie et cryothérapie sous contrôle scanner" : "Cryothérapie sous contrôle scanner");
        const titleLine2 = isDesmoide ? "Cryothérapie sous contrôle scanner" : "";
        const indicLine = isDesmoide
          ? `${patNom} de ${ageVal || "[<âge>]"} ans présentant une tumeur desmoïde ${desmoLoc}.`
          : `${patNom} de ${ageVal || "[<âge>]"} ans présentant ${desmoLoc !== "[<localisation à préciser>]" ? `une lésion ${desmoLoc} [<nature à préciser>]` : "[<lésion / localisation à préciser>]"}${refDoc ? ` (${adresseAccord.toLowerCase()} par ${refDoc})` : ""}.`;
        const conclLine = isDesmoide
          ? `Cryothérapie de la tumeur desmoïde ${desmoLoc}, techniquement satisfaisante.`

        return [
          titleLine1,
          ...(titleLine2 ? [titleLine2] : []),

          `${patNom} : ${civNom}`,

      // 2. Ablation de névrome de Morton / Cryothérapie sous contrôle scanner
      if (gType === "cryo_morton") {
        const espMatch = fullCtx.match(/\b([23])\s*(?:e|ème)\s*espace/i);
        const espStr = espMatch ? `${espMatch[1]}ème espace interdigital` : "[<2ème / 3ème espace interdigital>]";
        return [

      // 3. Electrochimiothérapie sous contrôle scanner (Trame Word sans inventer la lésion ni le médecin adresseur)
      if (gType === "ect") {

      // 4. INJECTION THERAPEUTIQUE de STEROÏDE / EPIDURALE PAR VOIE INTERLAMAIRE / SOUS SCANNER
      if (gType === "infiltration_epidurale") {
        return [

          "Dr T. LEFEVRE",

      // 6. INJECTION THERAPEUTIQUE de STEROÏDE / NERF GRAND OCCIPITAL / SOUS SCANNER
      if (gType === "infiltration_arnold") {

      // 7. Ostéocool sous contrôle scanner (Trame Word sans inventer le primitif ni de fuite discale)
      if (gType === "osteocool") {
        return [
          "Ostéocool sous contrôle scanner",
          "",
          `${patNom} : ${civNom}`,

          "Indication:",
          `${patNom} de ${ageVal || "[<âge>]"} ans présentant une lésion vertébrale de ${levelStr || "[<niveau>]"} [<contexte clinique / histologique à préciser>].`,

          `Abord de la lésion sous contrôle scannographique et mise en place de ${matNote || "[<2 trocards 10G>] et [<deux sondes OCP 20mm>]"}`,

          "[<Pas de fuite discale ni épidurale.>]",

      // 8. Radiofréquence d'ablation nerveuse / Nerfs géniculés
      if (gType === "rf_genicules" || gType === "test_anesth_genicule") {
        return [
          "Radiofréquence d'ablation nerveuse",

          `${patNom} : ${civNom}`,

      // 9. Ablation Ostéome Ostéoïde / Chondroblastome — Radiofréquence sous contrôle scanner
      if (gType === "rf_oo") {
        const isChondro = /chondroblastome/i.test(fullCtx);

        const extraDetail = /distance.*lame\s+sous[\s\-]*chondrale/i.test(fullCtx)

        return [
          lesionTitle,

      if (gType === "rf_facettaire") {
        return [

          `${patNom} : ${civNom}`,

    function stripTechnicalMaterialForCrh(txt) {
      if (!txt) return "";
      return String(txt)
        .replace(/\b\d+(?:[.,]\d+)?\s*(?:G|Gauge|Fr|French|mm|cm|mL|mg|W|watts?|minutes?|min|sec|secondes?|mGy(?:[.,]cm)?|°C)\b/gi, "")
        .replace(/\b(?:OsteoCool|IceRod|IceSphere|IceSeed|IceForce|IcePearl|Bonopty|Madison|Laredo|Kyphon|Confidence|Vertecem|Boston\s+Scientific|Medtronic|Stryker|Galil|IGEA|Cliniporator)\b/gi, "")
        .replace(/\b(?:trocart\s+coaxial|aiguille\s+coaxiale|coaxial|bipolaire|monopolaire|DLP|PDL|hydrodissection\s+au\s+[^,.;]+|cycles?\s+de\s+congélation|décongélation\s+active)\b/gi, "")
        .replace(/\bEVA\s*[:=]?\s*(\d+\s*\/\s*10)\b/gi, "douleurs évaluées à $1")
        .replace(/\bATB\b/g, "antibiothérapie")
        .replace(/\bATG\b/g, "traitement antalgique")
        .replace(/\bAINS\b/g, "anti-inflammatoires")
        .replace(/\bHBPM\b/g, "anticoagulation préventive")
        .replace(/\bPNO\b/gi, "pneumothorax")
        .replace(/\bTDM\b/g, "scanner")
        .replace(/\bCS\b/g, "consultation")
        .replace(/\s+,/g, ",")
        .replace(/,\s*,+/g, ",")
        .replace(/^\s*[,;:\-–]+\s*|\s*[,;:\-–]+\s*$/g, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    function capFirstLetter(s) {
      const str = String(s || "").trim();
      if (!str) return "";
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function lowFirstLetter(s) {
      const str = String(s || "").trim();
      if (!str) return "";
      if (/^(?:IRM|TDM|TEP|RCP|HDJ|EVA|AINS|M\.|Mme)\b/.test(str)) return str;
      return str.charAt(0).toLowerCase() + str.slice(1);
    }

    function extractClinicalAnnotations(sEntry) {
      const result = {
        complications: [],
        recommandations: [],
        clinique: [],
        anapathNote: "",
        inferredEvoGlobale: ""
      };
      if (!sEntry) return result;

      // 1. Anatomopathologie (nettoyée des termes purement techniques d'aiguille)
      if (sEntry.anapath && sEntry.anapath.trim()) {
        const cleanAna = stripTechnicalMaterialForCrh(sEntry.anapath.trim()).replace(/[.]+$/, "").trim();
        if (cleanAna) result.anapathNote = cleanAna;
      }

      // 2. Analyse combinée des annotations saisies dans Remarques et Suivi CS (le champ Matériel est volontairement ignoré)
      const rawBlocks = [];
      if (sEntry.remarques && sEntry.remarques.trim()) rawBlocks.push(sEntry.remarques.trim());
      if (sEntry.suivi_cs && sEntry.suivi_cs.trim()) rawBlocks.push(sEntry.suivi_cs.trim());

      const seenClauses = new Set();
      for (const block of rawBlocks) {
        const parts = String(block).split(/(?:\r?\n|[.;])+/);
        for (const rawPart of parts) {
          const trimmedRaw = rawPart.trim();
          if (!trimmedRaw) continue;

          // Détecter les préfixes explicites tapés par l'opérateur
          const isExplicitComp = /^\s*(?:complications?|incidents?|événements?\s+indésirables?)\s*[:\-–]/i.test(trimmedRaw);
          const isExplicitReco = /^\s*(?:recommandations?|consignes?|conseils?|conduite\s+à\s+tenir|cat|suites?\s+à\s+donner|à\s+prévoir)\s*[:\-–]/i.test(trimmedRaw);

          const strippedPrefix = trimmedRaw
            .replace(/^\s*(?:complications?|incidents?|événements?\s+indésirables?|recommandations?|consignes?|conseils?|conduite\s+à\s+tenir|cat|suites?\s+à\s+donner|à\s+prévoir)\s*[:\-–]\s*/i, "")
            .trim();

          const clean = stripTechnicalMaterialForCrh(strippedPrefix).replace(/[.]+$/, "").trim();
          if (!clean) continue;

          const dedupKey = clean.toLowerCase();
          if (seenClauses.has(dedupKey)) continue;
          seenClauses.add(dedupKey);

          // Ignorer les mentions "RAS" / "aucune complication" brutes tout en notant l'évolution favorable
          if (/^(?:ras|r\.a\.s\.?|aucune?\s+complication|pas\s+de\s+complication|suites?\s+simples?|sans\s+particularité|sans\s+complication)$/i.test(clean)) {
            if (!result.inferredEvoGlobale) result.inferredEvoGlobale = "favorable";
            continue;
          }

          const hasNegatedComp = /\b(?:sans|pas\s+de|pas\s+d'|absence\s+de|absence\s+d'|aucune?)\s+(?:complication|incident|hématome|saignement|infection|déficit|douleur|fuite|récidive)/i.test(clean);
          const hasCompKeyword = !hasNegatedComp && (
            isExplicitComp ||
            /\b(?:complication|incident|hématome|saignement|hémorrag|hémarthrose|fuite|infection|abcès|fièvre|fébricule|déficit|parésie|paralysie|paresthésie|hypoesthésie|dysesthésie|radiculalgie|sciatique|cruralgie|névralgie|brûlure|nécrose|pneumothorax|épanchement|malaise|vagal|allerg|intolérance|oedème|œdème|phlébite|thrombose|recrudescence\s+douloureuse|douleurs?\s+(?:rebelle|intense|aiguë|post[\s\-]?op)|récidive|échec)\b/i.test(clean)
          );

          const hasRecoKeyword = isExplicitReco || /\b(?:recommand|consigne|conseil|conduite\s+à\s+tenir|prévoir|à\s+revoir|revoir|contrôle|surveillance|repos|appui|décharge|béquill|canne|attelle|orthèse|ceinture|corset|immobilisation|kiné|rééducation|physiothérapie|arrêt\s+de\s+travail|arrêt\s+du?\s+sport|reprise|eliquis|plavix|kard[eé]gic|anticoag|antiagrég|pansement|fils|glaçage|glace|ordonnance|traitement|antalgique|palier|anti-inflammatoire|antibiothérapie|rcp|adress)\b/i.test(clean);

          if (hasCompKeyword && !isExplicitReco) {
            result.complications.push(lowFirstLetter(clean));
          } else if (hasRecoKeyword) {
            result.recommandations.push(lowFirstLetter(clean));
          } else {
            result.clinique.push(lowFirstLetter(clean));
          }

          if (/\b(?:favorable|amélioration|soulagement|disparition|nette\s+diminution|bonne\s+évolution|très\s+bon|satisfaisant|indolore|efficace)\b/i.test(clean)) {
            result.inferredEvoGlobale = "favorable";
          } else if (/\b(?:stationnaire|inchangé|stable)\b/i.test(clean) && !result.inferredEvoGlobale) {
            result.inferredEvoGlobale = "stationnaire";
          } else if (/\b(?:défavorable|aggravation|échec|persistance|rebelle)\b/i.test(clean)) {
            result.inferredEvoGlobale = "marquée par la persistance de la symptomatologie";
          }
        }
      }
      return result;
    }

    function findPatientInterventionDateAndAnesth(ev, prof) {
      const patNorm = normName(ev.patient);
      let dateHospit = "";
      if ((ev.category === "acte" || ev.category === "biopsie") && ev.dateStr && /\d{2}\/\d{2}\/\d{4}/.test(ev.dateStr)) {
        dateHospit = ev.dateStr;
      } else if ((ev.category === "acte" || ev.category === "biopsie") && ev.isoDate && /^\d{4}-\d{2}-\d{2}$/.test(ev.isoDate)) {
        const [y, m, d] = ev.isoDate.split("-");
        dateHospit = `${d}/${m}/${y}`;
      }
      if (!dateHospit && patNorm) {
        for (const a of (appData.actes || [])) {
          if (normName(a["Identité Patient"]) === patNorm && /\d{2}\/\d{2}\/\d{4}/.test(String(a["Date"] || ""))) {
            dateHospit = a["Date"];
            break;
          }
        }
      }
      if (!dateHospit && patNorm) {
        for (const b of (appData.Biopsies || [])) {
          if (normName(b["Identité Patient"]) === patNorm && /\d{2}\/\d{2}\/\d{4}/.test(String(b["Date"] || ""))) {
            dateHospit = b["Date"];
            break;
          }
        }
      }
      const combined = `${prof.gesteRetenu || ""} ${prof.detailsProcedure || ""} ${ev.title || ""} ${ev.remarques || ""}`.toLowerCase();
      let anesth = "sous anesthésie locale ou générale selon le protocole retenu";
      if (/\bag\b|anesthésie générale/i.test(combined)) {
        anesth = "sous anesthésie générale";
      } else if (/\bal\b|anesthésie locale|sous locale/i.test(combined)) {
        anesth = "sous anesthésie locale";
      }
      let guidage = "sous guidage scanographique";
      if (/échograph|\bécho\b/i.test(combined)) {
        guidage = "sous guidage échographique";
      } else if (/scopie|allura/i.test(combined)) {
        guidage = "sous guidage scopique et scanographique";
      }
      return { dateHospit, anesth, guidage };
    }

    function buildPatientCrText(ev, mode) {
      if (mode === "cro") {
        return buildPatientCroText(ev);
      }
      const prof = inferPatientCrProfile(ev);
      const sEntry = getSuiviEntry(ev);
      const ageAccord = prof.fem ? "âgée" : "âgé";
      const suiviAccord = prof.fem ? "suivie" : "suivi";
      const hospitAccord = prof.fem ? "hospitalisée" : "hospitalisé";
      const auPatient = prof.fem ? "à la patiente" : "au patient";
      const lePatient = prof.fem ? "la patiente" : "le patient";

      const isPureDiagBiopsie = String(prof.objectifs || "").trim() === "diagnostique" || /^biopsie/i.test(String(prof.gesteRetenu || "").trim());

      // Enrichissement ostéoarticulaire systématique : douleurs & impact / retentissement fonctionnel (hors biopsie purement diagnostique)
      let objEnrichi = prof.objectifs || "antalgique et fonctionnelle";
      if (!isPureDiagBiopsie && !/fonctionnel/i.test(objEnrichi) && !objEnrichi.includes("À préciser")) {
        if (objEnrichi === "antalgique") {
          objEnrichi = "antalgique et fonctionnelle";
        } else if (/^curative et antalgique$/i.test(objEnrichi)) {
          objEnrichi = "curative, antalgique et fonctionnelle";
        } else if (/antalgique/i.test(objEnrichi)) {
          objEnrichi = objEnrichi.replace(/antalgique/i, "antalgique et fonctionnelle");
        } else {
          objEnrichi = `antalgique, fonctionnelle et ${objEnrichi}`;
        }
      }

      let argsEnrichis = prof.arguments || "la symptomatologie douloureuse, le retentissement fonctionnel et le bilan d'imagerie";
      if (!isPureDiagBiopsie && !/fonctionnel|gêne|autonomie|marche/i.test(argsEnrichis) && !argsEnrichis.includes("À préciser")) {
        if (/doul/i.test(argsEnrichis)) {
          argsEnrichis = argsEnrichis.replace(/(symptomatologie douloureuse[^,]*|douleurs[^,]*|métatarsalgies[^,]*|gonalgies[^,]*|cervicalgies[^,]*)/i, "$1, le retentissement fonctionnel");
        } else {
          argsEnrichis = `la symptomatologie douloureuse, son retentissement fonctionnel et ${argsEnrichis}`;
        }
      }

      let benefEnrichis = prof.benefices || "soulagement des douleurs et d'amélioration du retentissement fonctionnel";
      if (!isPureDiagBiopsie && !/fonctionnel|marche|autonomie|appui/i.test(benefEnrichis) && !benefEnrichis.includes("À préciser")) {
        benefEnrichis = `${benefEnrichis} et d'amélioration du retentissement fonctionnel`;
      }

      const ann = extractClinicalAnnotations(sEntry);

      if (mode === "preop") {
        const extraClin = ann.clinique.length > 0 ? ` (${ann.clinique.join(", ")})` : "";
        const risquesEnrichis = ann.complications.length > 0
          ? `${prof.risques} (avec vigilance particulière concernant : ${ann.complications.join(", ")})`
          : prof.risques;
        const linesPreop = [
          "Chère Consœur, Cher Confrère,",
          "",
          `Nous avons eu en consultation ${prof.civiliteNom}, ${ageAccord} de ${prof.age} ans, présentant ${prof.motif}, survenant sur ${prof.terrain}.`,
          "",
          `Au regard de ${argsEnrichis}${extraClin}, une indication de ${prof.gesteRetenu} à visée ${objEnrichi} a été retenue.`,
          "",
          `Au cours de cette consultation, nous avons expliqué ${auPatient} :`,
          `- les principes de ${prof.principesNom} ;`,
          `- les modalités techniques du geste, réalisé sous guidage radiologique ;`,
          `- les bénéfices attendus, notamment en termes de ${benefEnrichis} ;`,
          `- ainsi que les risques inhérents à la procédure, notamment ${risquesEnrichis}.`,
          "",
          `Les modalités, bénéfices et risques de cette prise en charge ont été expliqués ${auPatient}, qui a bien compris l'ensemble de ces éléments et a donné son accord pour l'intervention.`
        ];
        if (ann.recommandations.length > 0) {
          linesPreop.push("");
          linesPreop.push(`En vue de cette prise en charge, il est recommandé : ${ann.recommandations.join(" ; ")}.`);
        }
        linesPreop.push(
          "",
          "Je vous prie de recevoir, Chère Consœur, Cher Confrère, l'assurance de mes sincères salutations.",
          "",
          "Dr Lefèvre"
        );
        return linesPreop.join("\n");
      }

      if (mode === "crh") {
        // Mode 3 : Compte Rendu d'Hospitalisation (CRH) — Concis, sans répétition, douleurs & impact fonctionnel, zéro matériel technique, signature Dr T. Lefevre
        const { dateHospit, anesth, guidage } = findPatientInterventionDateAndAnesth(ev, prof);
        const isUnknownVal = (v) => !v || /à préciser|\[<.*>\]/i.test(String(v));
        const ageChunk = !isUnknownVal(prof.age) ? `, ${prof.age} ans,` : " ([<âge>])";
        const dateChunk = dateHospit ? `le ${dateHospit}` : "le [<date>]";
        const rawGeste = !isUnknownVal(prof.gesteRealise)
          ? prof.gesteRealise
          : (prof.gesteRetenu || "[<geste réalisé à préciser>]");
        const gesteCourt = rawGeste
          .replace(/\s+sous\s+(?:guidage\s+|contrôle\s+)?(?:scanographique|scanner|échographique|échographie|scopique|anesthésie\s+générale|anesthésie\s+locale|AG|AL)(?:\s+et\s+sous\s+[^,.)]+)?/gi, "")
          .replace(/\s+en\s+HDJ(?:\s+radio\s*B)?/gi, "")
          .trim();

        const terrainClause = !isUnknownVal(prof.terrain)
          ? ` sur un terrain de ${prof.terrain}`
          : "";
        const procContext = `${rawGeste} ${prof.detailsProcedure || ""}`;
        const isBiopsie = /biopsie/i.test(procContext);
        const isCimento = /cimento|vertébro/i.test(procContext);
        const isVissage = /vissage|ostéosynthèse/i.test(procContext);
        const isThermo = /cryo|radiofréquence|\brf\b|thermo|électrochimio|\bect\b|alcoolisation/i.test(procContext);

        let deroulementBase = `L'intervention s'est déroulée ${anesth} et ${guidage}, avec un contrôle d'imagerie final satisfaisant`;
        if (isBiopsie) {
          deroulementBase = `L'intervention s'est déroulée ${anesth} et ${guidage}, permettant la réalisation de prélèvements biopsiques ciblés`;
        } else if (isThermo && (isCimento || isVissage)) {
          deroulementBase = `L'intervention s'est déroulée ${anesth} et ${guidage}, avec une couverture satisfaisante de la lésion et une bonne stabilisation osseuse au contrôle final`;
        } else if (isCimento) {
          deroulementBase = `L'intervention s'est déroulée ${anesth} et ${guidage}, avec un remplissage satisfaisant par le ciment au contrôle final`;
        } else if (isVissage) {
          deroulementBase = `L'intervention s'est déroulée ${anesth} et ${guidage}, avec un bon positionnement de l'ostéosynthèse au contrôle final`;
        } else if (isThermo) {
          deroulementBase = `L'intervention s'est déroulée ${anesth} et ${guidage}, avec une couverture satisfaisante de la cible au contrôle final dans le respect des structures adjacentes`;
        }

        let deroulementEtSuites = "";
        if (ann.complications.length > 0) {
          const extraClinCrh = ann.clinique.length > 0 ? ` (${ann.clinique.join(", ")})` : "";
          deroulementEtSuites = `${deroulementBase}. Les suites ont été marquées par ${ann.complications.join(", ")}${extraClinCrh}.`;
        } else {
          const sansComp = isCimento ? ", sans fuite extra-osseuse ni complication per-opératoire." : ", sans complication per-opératoire.";
          const suitesTxt = ann.clinique.length > 0
            ? `Les suites immédiates sont simples (${ann.clinique.join(", ")}).`
            : `Les suites immédiates sont simples.`;
          deroulementEtSuites = `${deroulementBase}${sansComp} ${suitesTxt}`;
        }

        const impactCrh = isPureDiagBiopsie
          ? ""
          : (/doul/i.test(prof.motif) ? " avec retentissement fonctionnel" : " responsable de douleurs et d'un retentissement fonctionnel");

        const consignesList = [];
        for (const rec of ann.recommandations) {
          consignesList.push(`- ${capFirstLetter(rec)}`);
        }
        if (ann.anapathNote) {
          consignesList.push(`- Anatomopathologie : ${capFirstLetter(ann.anapathNote)}`);
        }
        consignesList.push(
          "- Repos relatif 48 heures et reprise progressive de l'appui / des activités selon la tolérance douloureuse",
          "- Pansement sec 48 heures (pas de fils à retirer) et traitement antalgique adapté"
        );
        if (/eliquis|plavix|kard[eé]gic|anticoag/i.test(prof.terrain + " " + (prof.detailsProcedure || "")) && !ann.recommandations.some(r => /eliquis|plavix|kard[eé]gic|anticoag/i.test(r))) {
          consignesList.push("- Reprise du traitement antithrombotique selon le protocole validé");
        }
        consignesList.push(
          isBiopsie
            ? "- Consultation dédiée pour résultats anatomopathologiques"
            : "- Consultation de suivi dédiée (évaluation antalgique, fonctionnelle et imagerie de contrôle)"
        );

        return [
          "Chère consœur, cher confrère,",
          "",
          `${prof.civiliteNom}${ageChunk} a été ${hospitAccord} ${dateChunk} pour ${gesteCourt}.`,
          "",
          `Pour rappel, ${lePatient} présente ${prof.motif}${impactCrh}${terrainClause}, justifiant ce geste à visée ${objEnrichi} réalisé après information sur les bénéfices et les risques et recueil de son accord.`,
          "",
          deroulementEtSuites,
          "",
          "Suites et consignes :",
          ...consignesList,
          "",
          "Bien confraternellement,",
          "",
          "Dr T. Lefevre"
        ].join("\n");
      }

      // Mode 2 : Consultation de Suivi (rappel concis, sans détails techniques ni matériel, intégrant complications et recommandations)
      let indicInitSuivi = prof.indicationInitiale || "[indication initiale : douleurs et retentissement fonctionnel pré-opératoire à préciser]";
      if (!isPureDiagBiopsie && !/fonctionnel/i.test(indicInitSuivi) && !indicInitSuivi.includes("À préciser")) {
        indicInitSuivi += /doul/i.test(indicInitSuivi) ? " avec retentissement fonctionnel" : " responsable de douleurs et d'un retentissement fonctionnel";
      }
      const gesteSuiviCourt = String(prof.gesteRealise || "[nom de l'intervention / niveaux traités à préciser]")
        .replace(/\s+sous\s+(?:guidage\s+|contrôle\s+)?(?:scanographique|scanner|échographique|échographie|scopique|anesthésie\s+générale|anesthésie\s+locale|AG|AL)(?:\s+et\s+sous\s+[^,.)]+)?/gi, "")
        .replace(/\s+en\s+HDJ(?:\s+radio\s*B)?/gi, "")
        .trim();

      const remOnlyAnn = extractClinicalAnnotations({ remarques: sEntry.remarques || "", suivi_cs: "", anapath: "" });
      const scsOnlyAnn = extractClinicalAnnotations({ remarques: "", suivi_cs: sEntry.suivi_cs || "", anapath: "" });

      let suitesRappelClause = "avec des suites simples";
      if (remOnlyAnn.complications.length > 0) {
        suitesRappelClause = `avec des suites marquées par ${remOnlyAnn.complications.join(", ")}`;
      } else if (prof.particularitesProcedurales) {
        suitesRappelClause = `marqué par ${prof.particularitesProcedurales}`;
      }

      const evoGlobale = ann.inferredEvoGlobale || prof.evolutionGlobale || "[favorable / défavorable / stationnaire à préciser]";
      const evoDetails = ann.clinique.length > 0
        ? ann.clinique.join(", ")
        : (prof.evolutionCliniqueDetails || "[évolution des douleurs et du retentissement fonctionnel : autonomie, mobilité, reprise des activités à préciser]");
      const compCibles = prof.complicationsCibles || "neurologique, infectieuse ou spécifique au geste";

      const compSuiviList = scsOnlyAnn.complications.length > 0 ? scsOnlyAnn.complications : remOnlyAnn.complications;
      const compSuiviClause = compSuiviList.length > 0
        ? `avec survenue de ${compSuiviList.join(", ")}`
        : `sans complication ${compCibles} intercurrente`;

      const linesSuivi = [
        "Chère Consœur, Cher Confrère,",
        "",
        `Nous avons revu en consultation de suivi ${prof.civiliteNom}, ${ageAccord} de ${prof.age} ans, ${suiviAccord} pour ${prof.terrainSuivi}, suite à la réalisation ${gesteSuiviCourt.replace(/^le\s+/i, "du ").replace(/^la\s+/i, "de la ").replace(/^l'/i, "de l'").replace(/^(?!du\s|de\s)/i, "de ")}.`,
        "",
        `Pour rappel, ce geste avait été réalisé devant ${indicInitSuivi}, ${suitesRappelClause}.`,
        "",
        `Sur le plan clinique, ${lePatient} rapporte une évolution ${evoGlobale} au décours de la procédure, tant sur le plan des douleurs que du retentissement fonctionnel (${evoDetails}), ${compSuiviClause}.`
      ];

      if (ann.anapathNote) {
        linesSuivi.push("");
        linesSuivi.push(`Sur le plan anatomopathologique, l'analyse retrouve : ${ann.anapathNote}.`);
      }
      if (ann.recommandations.length > 0) {
        linesSuivi.push("");
        linesSuivi.push(`Pour la suite de la prise en charge, nous recommandons : ${ann.recommandations.join(" ; ")}.`);
      }

      linesSuivi.push(
        "",
        "Je vous prie de recevoir, Chère Consœur, Cher Confrère, l'assurance de mes sincères salutations.",
        "",
        "Dr T. Lefèvre"
      );
      return linesSuivi.join("\n");
    }

    function copyPatientCr(encodedMeta, mode, btnEl, clickEv, prefix = "") {
      if (clickEv) clickEv.stopPropagation();
      let meta = {};
      try {
        meta = JSON.parse(decodeURIComponent(encodedMeta));
      } catch (e) {}
      // Synchroniser immédiatement toute note en cours de saisie dans les champs ouverts de la carte avant de générer le CR
      const sKey = getSuiviKey(meta);
      const matEl = document.getElementById((prefix || "") + "mat-" + sKey);
      const remEl = document.getElementById((prefix || "") + "rem-" + sKey);
      const anaEl = document.getElementById((prefix || "") + "ana-" + sKey);
      const scsEl = document.getElementById((prefix || "") + "scs-" + sKey);
      if (matEl || remEl || anaEl || scsEl) {
        const cur = getSuiviEntry(meta);
        const domMat = matEl ? matEl.value.trim() : cur.materiel;
        const domRem = remEl ? remEl.value.trim() : cur.remarques;
        const domAna = anaEl ? anaEl.value.trim() : cur.anapath;
        const domScs = scsEl ? scsEl.value.trim() : cur.suivi_cs;
        if (domMat !== cur.materiel || domRem !== cur.remarques || domAna !== cur.anapath || domScs !== cur.suivi_cs) {
          saveSuiviFromDom(sKey, encodedMeta, prefix, false);
        }
      }
      const crText = buildPatientCrText(meta, mode);
      const doFeedback = () => {
        if (!btnEl) return;
        const origHtml = btnEl.getAttribute("data-orig-html") || btnEl.innerHTML;
        if (!btnEl.getAttribute("data-orig-html")) btnEl.setAttribute("data-orig-html", origHtml);
        btnEl.classList.add("copied");
        const copiedLbl = mode === "preop" ? "CR Pré-op copié" : (mode === "cro" ? "CR Opératoire copié" : (mode === "crh" ? "CRH copié" : "CR Suivi copié"));
        btnEl.innerHTML = `<span>✅ ${copiedLbl}</span>`;
        setTimeout(() => {
          btnEl.classList.remove("copied");
          btnEl.innerHTML = origHtml;
        }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(crText).then(doFeedback).catch(() => {
          fallbackCopyText(crText);
          doFeedback();
        });
      } else {
        fallbackCopyText(crText);
        doFeedback();
      }
    }

    function fallbackCopyText(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (_) {}
      document.body.removeChild(ta);
    }

    function toggleBlocNotes(boxDomId, ev) {
      if (ev) ev.stopPropagation();
      const boxEl = document.getElementById(boxDomId);
      const chevEl = document.getElementById("chev-" + boxDomId);
      if (!boxEl) return;
      const isOpen = boxEl.classList.toggle("open");
      if (isOpen) {
        openBlocNoteIds.add(boxDomId);
        if (chevEl) chevEl.textContent = "▾";
      } else {
        openBlocNoteIds.delete(boxDomId);
        if (chevEl) chevEl.textContent = "▸";
      }
    }

    function getMaterialChoicesForEvent(ev, prof) {
      const ctx = `${ev.title || ""} ${ev.remarques || ""} ${prof.gesteRetenu || ""} ${prof.gesteRealise || ""} ${prof.motif || ""}`.toLowerCase();
      if (ev.category === "biopsie" || /^biopsie/i.test(String(ev.title || "").trim()) || /biopsie/i.test(ctx)) {
        return ["14G", "18G", "Bonopty 13G", "Laredo 11G", "Madison 13G", "Tru-Cut 14G", "Tru-Cut 16G", "Tru-Cut 18G"];
      }
      if (/morton/i.test(ctx)) {
        return ["Ice seed Cx 10", "Ice seed CX 175", "Ice seed", "30s 5% 3 min 30%", "30s 5% 2min30 30%", "30s 5% 4 min 30%", "30s 5% 3min 20%"];
      }
      if (/\bect\b|électrochimio/i.test(ctx)) {
        return ["18G 20cm 20mm", "17G 16cm 40mm", "17G 16cm 20mm", "17G 12cm 30mm", "17G 12cm 20mm", "15G 16cm 30mm", "15G 16cm 20mm", "EPSA"];
      }
      if (/desmo[ïi]de|cryo/i.test(ctx)) {
        return ["Ice Force", "Ice Rod", "V probe 2.4", "V probe 3.8", "RS 17", "Cycle 10-10", "Ice seed Cx 10"];
      }
      if (/ostéome\s+ostéo[ïi]de|\boo\b|chondroblastome|ostéoblastome/i.test(ctx)) {
        return ["Covidien 10-150", "Covidien 7-150", "Covidien 20-150", "Covidien 7-140", "Covidien 7-100", "6 min 90°", "6 min 85°", "6min 80°", "3-3min 90°", "carbodissection épidurale", "hydrodissection intra-articulaire"];
      }
      if (/rfna|génicul|neurolyse|rhizolyse|test\s+anesth|fémoro/i.test(ctx)) {
        return ["Venom 20G", "90sx 80°", "60sx2 60°", "120sx2 42°"];
      }
      if (/cimento|vertébro|vissage|sacroplastie|osteocool/i.test(ctx)) {
        return ["Vertébroplastie", "Vissage cimenté (Scanner)", "Vissage cimenté (Scopie Allura)", "Vissage + cryo", "OsteoCool", "Covidien 10-150"];
      }
      return ["Covidien 10-150", "Covidien 7-150", "Ice Force", "Ice Rod", "V probe 2.4", "Ice seed Cx 10", "Venom 20G", "18G 20cm 20mm", "14G", "18G"];
    }

    function appendMaterialChoice(inputDomId, choiceText, sKey, safeEvMeta, prefix, clickEv) {
      if (clickEv) clickEv.stopPropagation();
      const el = document.getElementById(inputDomId);
      if (!el) return;
      const cur = el.value.trim();
      if (!cur) {
        el.value = choiceText;
      } else if (!cur.toLowerCase().includes(choiceText.toLowerCase())) {
        el.value = `${cur} • ${choiceText}`;
      }
      saveSuiviFromDom(sKey, safeEvMeta, prefix, false);
    }

      const prof = inferPatientCrProfile(ev);
      const defMode = getDefaultCrModeForCard(ev, prof);
      const matChoices = getMaterialChoicesForEvent(ev, prof);
      const hasSaved = Boolean(
        (sEntry.materiel && sEntry.materiel.trim()) ||
        (sEntry.remarques && sEntry.remarques.trim()) ||
        (sEntry.anapath && sEntry.anapath.trim()) ||
        (sEntry.suivi_cs && sEntry.suivi_cs.trim())
      );
      const safeEvMeta = encodeURIComponent(JSON.stringify({
        row: ev.row || 0,
        patient: ev.patient,
        ipp: ev.ipp,
        isoDate: ev.isoDate,
        dateStr: ev.dateStr,
        category: ev.category,
        title: ev.title,
        remarques: ev.remarques,

      }));

      ).join("");
