<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Cochin RI" />
  <meta name="application-name" content="Cochin RI" />
  <meta name="theme-color" content="#F8FAFC" />
  <link rel="manifest" href="manifest.json?v=3" />
  <link rel="icon" type="image/svg+xml" href="icon.svg?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=3" />
  <title>Cochin RI — Dr T. Lefèvre</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-elevated: #F1F5F9;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #64748B;
      --primary: #0284C7;
      --primary-dark: #0369A1;
      --acte: #E11D48;       /* Corail vif */
      --biopsie: #7C3AED;    /* Violet Améthyste */
      --cs: #2563EB;         /* Bleu Azur */
      --img: #0D9488;        /* Turquoise */
      --mail-rdv: #D97706;   /* Ambre Doré */
      --perso-msg: #DB2777;  /* Rose Magenta */
      --garde: #DC2626;      /* Rouge Garde */
      --success: #16A34A;
      --warning: #D97706;
      --danger: #DC2626;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(146px + var(--safe-bottom));
    }

    /* Autoriser la sélection de texte dans les fiches patients et champs de recherche */
    input, textarea, .detail-value, .event-ipp {
      -webkit-user-select: text;
      user-select: text;
    }

    /* LOCK SCREEN */
    #lock-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at 50% 20%, #E0F2FE 0%, #F8FAFC 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #lock-screen.hidden { display: none; }
    .lock-card {
      width: 100%;
      max-width: 340px;
      text-align: center;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }
    .lock-logo {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      overflow: hidden;
      margin: 0 auto 14px;
      border: 1px solid rgba(2, 132, 199, 0.35);
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.2);
      background: #FFFFFF;
    }
    .lock-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .lock-title {
      font-size: 20px;
      font-weight: 800;
      color: #0F172A;
      margin: 0 0 4px;
    }
    .lock-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 0 22px;
    }
    .pin-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 240px;
      margin: 0 auto;
    }
    .pin-kbd-input {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: 1.5px solid var(--primary);
      background: #F8FAFC;
      color: #0F172A;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 8px;
      text-align: center;
      outline: none;
      padding: 0 12px;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }
    .pin-kbd-input::placeholder {
      font-size: 14px;
      letter-spacing: normal;
      font-weight: 500;
      color: var(--text-muted);
    }
    .pin-kbd-input:focus {
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.25);
    }
    .pin-submit-btn {
      height: 46px;
      border-radius: 12px;
      border: 1px solid var(--primary-dark);
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .pin-submit-btn:active {
      transform: scale(0.97);
    }
    .lock-error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 14px;
      min-height: 20px;
    }

    /* COMPACT HEADER (OPTIMISÉ DYNAMIC ISLAND / MODE APP STANDALONE - THÈME CLAIR) */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.04);
      padding: max(10px, calc(var(--safe-top) + 6px)) 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .brand-badge {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      overflow: hidden;
      border: 1px solid rgba(2, 132, 199, 0.35);
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.15);
      flex-shrink: 0;
      background: #FFFFFF;
    }
    .brand-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .brand-text h1 {
      font-size: 14px;
      font-weight: 800;
      color: #0F172A;
      margin: 0;
      letter-spacing: -0.2px;
    }
    .brand-text p {
      font-size: 10px;
      color: var(--text-muted);
      margin: 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-icon {
      border: 1px solid var(--border);
      background: #F8FAFC;
      color: #0F172A;
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 11.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }
    .sync-dot.loading {
      background: var(--warning);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* KPI BAR (DOCKED AT BOTTOM ABOVE MAIN NAV - THÈME CLAIR) */
    .kpi-strip {
      pointer-events: auto;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid #CBD5E1;
      border-radius: 14px;
      padding: 4px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.10);
    }
    .kpi-box {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 4px 2px;
      text-align: center;
      cursor: pointer;
      min-width: 0;
      transition: all 0.15s ease;
    }
    .kpi-box.active {
      background: #E0F2FE;
      border-color: var(--primary);
      box-shadow: 0 0 0 1px rgba(2, 132, 199, 0.30);
    }
    .kpi-val {
      font-size: 13px;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .kpi-lbl {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 1px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .kpi-box.active .kpi-lbl {
      color: #0369A1;
    }

    .main-content {
      padding: 8px 12px 24px;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }
    @media (min-width: 768px) {
      .main-content {
        max-width: 1180px;
        padding: 12px 20px 32px;
      }
    }

    /* CONTROLS STACK (NO HORIZONTAL OVERFLOW ON ANY MOBILE SCREEN) */
    .agenda-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      width: 100%;
    }
    @media (min-width: 640px) {
      .agenda-controls {
        flex-direction: row;
      }
      .agenda-controls > .segmented {
        flex: 1;
      }
    }
    .segmented {
      display: flex;
      width: 100%;
      background: #F1F5F9;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2px;
      gap: 2px;
    }
    .seg-btn {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 4px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
    }
    .seg-btn.active {
      background: #FFFFFF;
      color: #0F172A;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.10);
    }
    .seg-btn.scope-active {
      background: linear-gradient(135deg, #0284C7, #4F46E5);
      color: #fff;
    }

    /* DATE NAV */
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 6px 8px;
      margin-bottom: 8px;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }
    .date-nav-center {
      text-align: center;
      cursor: pointer;
      min-width: 0;
      flex: 1;
    }
    .date-nav-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #0F172A;
      text-transform: capitalize;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .date-nav-sub {
      font-size: 10.5px;
      color: #B45309;
      font-weight: 600;
      margin-top: 1px;
      display: none;
    }
    .nav-arrow {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* COMPACT GARDES STRIP */
    .garde-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 2px 0 8px;
      width: 100%;
    }
    .garde-strip::-webkit-scrollbar { display: none; }
    .garde-strip-lbl {
      font-size: 10px;
      font-weight: 800;
      color: #B91C1C;
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 7px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      text-decoration: none;
      flex-shrink: 0;
    }
    .garde-chip {
      border: 1px solid #FECACA;
      background: #FFFFFF;
      color: #B91C1C;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }
    .garde-chip.active {
      background: #DC2626;
      color: #fff;
      border-color: #B91C1C;
    }

    /* VACATION CARDS & COLORED POST PILLS (LIGHT THEME) */
    .vac-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 10px;
    }
    .vac-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 8px 10px;
      min-width: 0;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }
    .vac-period {
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .post-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .post-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      max-width: 100%;
      overflow-wrap: break-word;
    }
    /* High-contrast light palette for hospital & private posts */
    .post-tdm-achard { background: #ECFEFF; color: #0E7490; border: 1px solid #A5F3FC; }
    .post-gestes     { background: #FFF7ED; color: #C2410C; border: 1px solid #FED7AA; }
    .post-cs         { background: #EEF2FF; color: #4338CA; border: 1px solid #C7D2FE; }
    .post-echo       { background: #ECFDF5; color: #047857; border: 1px solid #A7F3D0; }
    .post-irm        { background: #FAF5FF; color: #6D28D9; border: 1px solid #E9D5FF; }
    .post-sau        { background: #F0F9FF; color: #0369A1; border: 1px solid #BAE6FD; }
    .post-staff      { background: #FEFCE8; color: #A16207; border: 1px solid #FEF08A; }
    .post-liberal    { background: #FFFBEB; color: #B45309; border: 1px solid #FDE68A; }
    .post-libre      { background: #F1F5F9; color: #475569; border: 1px dashed #CBD5E1; }
    .post-closed     { background: #FEF2F2; color: #B91C1C; border: 1px dashed #FCA5A5; }

    /* GARDE BANNER */
    .garde-banner {
      border-radius: 10px;
      padding: 7px 11px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      background: #F8FAFC;
      border: 1px solid var(--border);
      color: #0F172A;
    }
    .garde-banner.is-me {
      background: linear-gradient(135deg, #FEF2F2, #FFF7ED);
      border: 1.5px solid #EF4444;
      color: #991B1B;
      font-weight: 800;
    }
    .garde-banner.is-marie {
      background: linear-gradient(135deg, #FDF2F8, #FFF1F2);
      border: 1px solid #F472B6;
      padding: 4px 9px;
      font-size: 11px;
      color: #9D174D;
      font-weight: 700;
    }
    .garde-strip-lbl-marie {
      font-size: 9.5px;
      font-weight: 700;
      color: #9D174D;
      white-space: nowrap;
      padding: 3px 7px;
      border-radius: 7px;
      background: #FDF2F8;
      border: 1px solid #F472B6;
      flex-shrink: 0;
    }
    .garde-chip-marie {
      border: 1px solid #F472B6;
      background: #FFFFFF;
      color: #9D174D;
      padding: 3px 7px;
      border-radius: 7px;
      font-size: 9.5px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }
    .garde-chip-marie.active {
      background: #DB2777;
      color: #fff;
      border-color: #BE185D;
    }
    .post-marie {
      background: #FDF2F8;
      color: #9D174D;
      border: 1px solid #F472B6;
      font-weight: 700;
    }
    .ws-day.is-marie-garde {
      border: 1px solid #DB2777 !important;
      background: #FDF2F8 !important;
    }
    .month-cell.is-marie-garde {
      border: 1px solid #DB2777 !important;
      background: #FDF2F8 !important;
    }

    /* EVENT CARDS — CLEAN & STREAMLINED (LIGHT THEME) */
    .section-label {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin: 8px 2px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3.5px solid var(--primary);
      border-radius: 11px;
      padding: 9px 11px;
      margin-bottom: 7px;
      cursor: pointer;
      width: 100%;
      overflow-wrap: break-word;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .event-card.type-acte     { border-left-color: var(--acte); background: linear-gradient(90deg, rgba(225,29,72,0.04) 0%, #FFFFFF 35%); }
    .event-card.type-biopsie  { border-left-color: var(--biopsie); background: linear-gradient(90deg, rgba(124,58,237,0.04) 0%, #FFFFFF 35%); }
    .event-card.type-cs       { border-left-color: var(--cs); background: linear-gradient(90deg, rgba(37,99,235,0.04) 0%, #FFFFFF 35%); }
    .event-card.type-img      { border-left-color: var(--img); background: linear-gradient(90deg, rgba(13,148,136,0.04) 0%, #FFFFFF 35%); }
    .event-card.type-mail-rdv { border-left-color: var(--mail-rdv); background: linear-gradient(90deg, rgba(217,119,6,0.06) 0%, #FFFFFF 45%); }
    .event-card.type-marie-garde {
      border: 1px solid #F472B6;
      border-left: 3.5px solid #DB2777;
      padding: 6px 9px;
      background: linear-gradient(90deg, #FDF2F8 0%, #FFFFFF 100%);
    }

    .event-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 3px;
    }
    .event-time-badge {
      font-size: 11px;
      font-weight: 800;
      color: #0F172A;
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      padding: 2px 7px;
      border-radius: 5px;
    }
    .pill {
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .pill-acte     { background: #FFE4E6; color: #BE123C; border: 1px solid #FECDD3; }
    .pill-biopsie  { background: #F3E8FF; color: #6D28D9; border: 1px solid #E9D5FF; }
    .pill-cs       { background: #DBEAFE; color: #1D4ED8; border: 1px solid #BFDBFE; }
    .pill-img      { background: #CCFBF1; color: #0F766E; border: 1px solid #99F6E4; }
    .pill-mail-rdv { background: #FEF3C7; color: #B45309; border: 1px solid #FDE68A; }
    .pill-marie    { background: #DB2777; color: #FFF; border: 1px solid #BE185D; font-weight: 800; }
    .pill-live     { background: #E0F2FE; color: #0369A1; border: 1px solid #BAE6FD; }
    .pill-aphp     { background: #F3E8FF; color: #6D28D9; border: 1px solid #E9D5FF; }
    .pill-whatsapp { background: #DCFCE7; color: #15803D; border: 1px solid #BBF7D0; }
    .pill-imessage { background: #DBEAFE; color: #1D4ED8; border: 1px solid #BFDBFE; }
    .pill-success  { background: #DCFCE7; color: #15803D; border: 1px solid #BBF7D0; }
    .pill-danger   { background: #FEE2E2; color: #B91C1C; border: 1px solid #FECACA; }
    .pill-warn     { background: #FEF3C7; color: #B45309; border: 1px solid #FDE68A; }

    .event-patient {
      font-size: 14px;
      font-weight: 800;
      color: #0F172A;
      margin: 2px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .event-ipp {
      font-size: 10.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #0369A1;
      background: #E0F2FE;
      border: 1px solid #BAE6FD;
      padding: 1px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }
    .event-title {
      font-size: 12px;
      color: #334155;
      font-weight: 600;
    }
    .event-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .doc-tag {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 5px;
      font-weight: 700;
      font-size: 10.5px;
      background: #F1F5F9;
      color: #334155;
      border: 1px solid #E2E8F0;
    }
    .doc-tag.is-tl {
      background: #E0F2FE;
      color: #0369A1;
      border: 1px solid #7DD3FC;
    }
    .alert-anticoag {
      margin-top: 6px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #B91C1C;
      font-size: 10.5px;
      font-weight: 700;
    }

    /* WEEK VIEW */
    .week-day-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px 10px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }
    .week-day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .week-day-name {
      font-size: 13px;
      font-weight: 800;
      color: #0F172A;
      text-transform: capitalize;
    }

    /* MONTH VIEW */
    .month-grid-header {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }
    .month-cell {
      min-height: 60px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      min-width: 0;
    }
    .month-cell.other-month { opacity: 0.42; background: #F8FAFC; }
    .month-cell.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 1.5px var(--primary);
      background: #F0F9FF;
    }
    .month-cell.is-tl-garde {
      border-color: #EF4444 !important;
      background: #FEF2F2 !important;
    }
    .month-cell-top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .month-day-num {
      font-size: 11px;
      font-weight: 800;
      color: #0F172A;
    }
    .month-desk-cnt {
      display: none;
    }
    .month-desk-vacs {
      display: none;
    }
    .month-desk-evs {
      display: none;
    }
    .month-vac-tag {
      font-size: 7.5px;
      font-weight: 700;
      border-radius: 4px;
      padding: 1px 2px;
      margin-top: 2px;
      text-align: center;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .month-dots {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: auto;
      padding-top: 2px;
    }
    .m-dot {
      width: 4.5px;
      height: 4.5px;
      border-radius: 50%;
    }
    .m-dot.acte     { background: var(--acte); }
    .m-dot.biopsie  { background: var(--biopsie); }
    .m-dot.cs          { background: var(--cs); }
    .m-dot.img         { background: var(--img); }
    .m-dot.mail-rdv    { background: var(--mail-rdv); }
    .m-dot.marie-garde { background: #DB2777; }

    @media (min-width: 768px) {
      .month-grid {
        gap: 6px;
      }
      .month-cell {
        min-height: 122px;
        padding: 6px 7px;
        border-radius: 10px;
        align-items: stretch;
        justify-content: flex-start;
        gap: 4px;
      }
      .month-cell:hover {
        border-color: #7DD3FC;
        background: #F8FAFC;
      }
      .month-cell-top {
        justify-content: space-between;
      }
      .month-day-num {
        font-size: 13px;
        font-weight: 800;
      }
      .month-vac-tag,
      .month-dots {
        display: none !important;
      }
      .month-desk-cnt {
        display: inline-block;
        font-size: 9.5px;
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 999px;
        background: #E0F2FE;
        color: #0369A1;
      }
      .month-desk-vacs {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-bottom: 3px;
        border-bottom: 1px solid #E2E8F0;
      }
      .month-desk-vac-line {
        font-size: 9.5px;
        font-weight: 600;
        line-height: 1.2;
        padding: 2px 5px;
        border-radius: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .month-desk-evs {
        display: flex;
        flex-direction: column;
        gap: 2.5px;
        margin-top: 1px;
      }
      .month-desk-ev {
        font-size: 9.5px;
        line-height: 1.2;
        padding: 2px 5px;
        border-radius: 4px;
        background: #F8FAFC;
        border-left: 2.5px solid var(--primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #0F172A;
      }
      .month-desk-ev.type-acte        { border-left-color: var(--acte); background: #FFF1F2; }
      .month-desk-ev.type-biopsie     { border-left-color: var(--biopsie); background: #FAF5FF; }
      .month-desk-ev.type-cs          { border-left-color: var(--cs); background: #EFF6FF; }
      .month-desk-ev.type-img         { border-left-color: var(--img); background: #F0FDFA; }
      .month-desk-ev.type-mail-rdv    { border-left-color: var(--mail-rdv); background: #FFFBEB; }
      .month-desk-ev.type-marie-garde { border-left-color: #DB2777; background: #FDF2F8; color: #9D174D; font-weight: 700; }
      .month-desk-more {
        font-size: 9px;
        font-weight: 700;
        color: var(--primary);
        text-align: right;
        padding-right: 2px;
      }
    }

    /* SEARCH & CHIPS */
    .search-box {
      position: relative;
      margin-bottom: 8px;
    }
    .search-input {
      width: 100%;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      padding: 0 12px 0 32px;
      font-size: 13px;
      outline: none;
    }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text-muted);
    }
    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      margin-bottom: 8px;
      scrollbar-width: none;
      width: 100%;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: #475569;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary-dark);
    }

    /* SCROLLABLE DAYS BAR (BARRE DES JOURS DÉFILABLE) */
    .day-strip-scroll {
      position: relative;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0 8px;
      margin-bottom: 4px;
      scrollbar-width: none;
      width: 100%;
    }
    .day-strip-scroll::-webkit-scrollbar { display: none; }
    .ws-day {
      flex: 0 0 calc((100% - 24px) * 0.156);
      min-width: 48px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 6px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    .ws-day.is-weekend {
      flex: 0 0 calc((100% - 24px) * 0.11);
      min-width: 36px;
      padding: 4px 2px;
      opacity: 0.94;
      background: #F8FAFC;
      border: 1px dashed #CBD5E1;
      justify-content: center;
    }
    .ws-day.is-weekend .ws-dow {
      font-size: 7.5px;
      color: var(--text-muted);
    }
    .ws-day.is-weekend .ws-num {
      font-size: 10.5px;
      color: #475569;
    }
    .ws-day.is-weekend .ws-mon {
      display: none;
    }
    .ws-day.is-weekend .ws-vac {
      font-size: 7px;
      padding: 1px 2px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ws-day.is-weekend .ws-cnt {
      font-size: 6.5px;
      color: #64748B;
      font-weight: 700;
      line-height: 1;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .v3-week-5col-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 6px;
    }
    .v3-week-5col-cell {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 5px 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      cursor: pointer;
    }
    .v3-week-5col-cell.is-garde {
      border-color: #EF4444;
      background: #FEF2F2;
    }
    .v3-weekend-gardes-bar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }
    .v3-weekend-garde-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 8px;
      background: #F8FAFC;
      border: 1px dashed #CBD5E1;
      cursor: pointer;
      font-size: 10px;
      min-width: 0;
    }
    .v3-weekend-garde-pill.is-garde {
      background: #FEF2F2;
      border: 1px solid #EF4444;
    }
    .v3-weekend-garde-pill.is-marie-garde {
      background: #FDF2F8;
      border: 1px solid #F472B6;
    }
    .ws-day.active {
      border-color: var(--primary);
      background: #E0F2FE;
      box-shadow: 0 0 0 1px var(--primary);
    }
    .ws-day.is-garde {
      border-color: #EF4444;
      background: #FEF2F2;
    }
    .ws-dow {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .ws-num {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
      white-space: nowrap;
    }
    .ws-mon {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      margin-left: 1px;
    }
    .ws-day.active .ws-mon {
      color: var(--primary-dark);
    }
    .ws-month-sep {
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary-dark);
      background: #E0F2FE;
      border: 1px solid #BAE6FD;
      border-radius: 7px;
      padding: 4px 3px;
      flex-shrink: 0;
      user-select: none;
    }
    .day-strip-month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 800;
      color: var(--primary-dark);
      text-transform: capitalize;
      padding: 0 4px 3px;
      letter-spacing: 0.02em;
    }
    .ws-vac {
      font-size: 7.5px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 4px;
      max-width: 50px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ws-cnt {
      font-size: 8px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    /* SELECTEUR DE SEMAINES (CARTES RÉSUMÉES EN MODE SEMAINE) */
    .weeks-selector-row {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 2px 8px;
      margin-bottom: 6px;
      scrollbar-width: none;
      width: 100%;
    }
    .weeks-selector-row::-webkit-scrollbar { display: none; }
    .week-sel-card {
      min-width: 118px;
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .week-sel-card.active {
      border-color: var(--primary);
      background: #E0F2FE;
      box-shadow: 0 0 0 1px var(--primary);
    }
    .week-sel-card.has-garde {
      border-color: #FCA5A5;
    }
    .wsc-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wsc-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }
    .wsc-tag {
      font-size: 8.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 5px;
      white-space: nowrap;
    }
    .week-group-header {
      background: #F1F5F9;
      border: 1px solid var(--border);
      border-left: 3px solid var(--primary);
      border-radius: 9px;
      padding: 6px 11px;
      margin: 12px 0 7px;
      font-size: 11px;
      font-weight: 800;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* MODERN FLOATING BOTTOM DOCK (KPI STRIP + MAIN PAGES - LIGHT THEME) */
    .bottom-nav-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      padding: 0 10px calc(6px + var(--safe-bottom));
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .bottom-nav {
      pointer-events: auto;
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid #CBD5E1;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      padding: 4px;
      gap: 4px;
    }
    .nav-item {
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      border-radius: 13px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }
    .nav-item svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-item.active {
      color: #0369A1;
      background: #E0F2FE;
    }
    .nav-item.active svg {
      stroke: var(--primary);
    }
    .nav-badge {
      position: absolute;
      top: 2px;
      right: 22%;
      background: var(--primary);
      color: #fff;
      font-size: 8.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 999px;
      line-height: 1.1;
    }

    /* BLOC / SUIVI OPÉRATOIRE (MATÉRIEL UTILISÉ & REMARQUES - LIGHT THEME) */
    .bloc-toggle-row {
      margin-top: 7px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 6px;
    }
    .bloc-toggle-btn {
      border: 1px solid #BAE6FD;
      background: #F0F9FF;
      color: #0369A1;
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 10.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .bloc-toggle-btn.cr-btn {
      border-color: #CBD5E1;
      background: #F8FAFC;
      color: #334155;
    }
    .bloc-toggle-btn.cr-primary {
      border-color: #A5B4FC;
      background: #EEF2FF;
      color: #4338CA;
    }
    .bloc-toggle-btn.copied {
      border-color: #86EFAC !important;
      background: #DCFCE7 !important;
      color: #15803D !important;
    }
    .bloc-toggle-btn.has-saved {
      border-color: #86EFAC;
      background: #F0FDF4;
      color: #15803D;
    }
    .bloc-toggle-btn:active {
      transform: scale(0.97);
    }
    .bloc-notes-box {
      margin-top: 6px;
      padding: 8px 10px;
      background: #F8FAFC;
      border: 1px solid #BAE6FD;
      border-radius: 9px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    .bloc-notes-box.open {
      display: flex;
    }
    .bloc-notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 800;
      color: var(--primary-dark);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .bloc-field-lbl {
      font-size: 10px;
      font-weight: 700;
      color: #64748B;
      margin-bottom: 2px;
      display: block;
    }
    .bloc-input {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-radius: 7px;
      color: #0F172A;
      font-size: 12px;
      font-family: inherit;
      padding: 6px 8px;
      outline: none;
      resize: vertical;
    }
    .bloc-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }
    .mat-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 2px;
    }
    .mat-chip {
      border: 1px solid #BAE6FD;
      background: #FFFFFF;
      color: #0369A1;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .mat-chip:hover, .mat-chip:active {
      background: #E0F2FE;
      border-color: var(--primary);
      color: #0F172A;
    }
    .bloc-save-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }
    .bloc-save-status {
      font-size: 10.5px;
      color: #15803D;
      font-weight: 700;
    }
    .bloc-save-btn {
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #FFFFFF;
      border-radius: 7px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .bloc-save-btn:active {
      transform: scale(0.96);
    }

    /* MODAL (LIGHT THEME) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      width: 100%;
      max-width: 640px;
      max-height: 88vh;
      background: #FFFFFF;
      border-top: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      padding: 14px 16px calc(22px + var(--safe-bottom));
      overflow-y: auto;
      box-shadow: 0 -10px 30px rgba(15, 23, 42, 0.15);
    }
    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: #CBD5E1;
      margin: 0 auto 12px;
    }
    .detail-block {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .detail-label {
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .detail-value {
      font-size: 13px;
      line-height: 1.4;
      color: #0F172A;
    }
    .quick-actions {
      display: flex;
      gap: 8px;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .action-btn {
      flex: 1;
      min-width: 100px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      cursor: pointer;
    }
    .action-btn.primary {
      background: var(--primary);
      border-color: var(--primary-dark);
      color: #fff;
    }
    .empty-state {
      text-align: center;
      padding: 18px 12px;
      color: var(--text-muted);
      font-size: 12px;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 11px;
    }

    /* PULL-TO-REFRESH (UNIQUEMENT LA FLÈCHE QUI TOURNE) */
    .ptr-indicator {
      position: fixed;

    const EXPECTED_PIN_SHA256 = "880e662aca87afd64fbf14e04e47dbf9a33dede435a0986f9a249571d5086690";

    async function sha256HexBrowser(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(str || "")));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function verifyPinAndLoad(pin) {
      const errEl = document.getElementById("lock-error");
      const inpEl = document.getElementById("pin-kbd-input");
      const code = String(pin || "").trim();
      if (code.length < 6) {
        if (errEl) errEl.textContent = "Saisissez le code à 6 chiffres.";
        return;
      }
      if (errEl) errEl.textContent = "Vérification…";
      const hash = await sha256HexBrowser(code);
      if (hash !== EXPECTED_PIN_SHA256) {
        if (errEl) errEl.textContent = "Code d'accès incorrect.";
        if (inpEl) {
          inpEl.value = "";
          inpEl.focus();
        }
        return;
      }
      if (errEl) errEl.textContent = "";
      if (inpEl) inpEl.value = "";
      localStorage.setItem(STORAGE_PIN_KEY, code);

    // Neutralise les balises HTML dans toutes les données distantes (anti-XSS : les rendus utilisent innerHTML).
    function sanitizeDeep(v, depth) {
      depth = depth || 0;
      if (depth > 10) return v;
      if (typeof v === "string") return v.replace(/</g, "＜").replace(/>/g, "＞");
      if (Array.isArray(v)) return v.map(x => sanitizeDeep(x, depth + 1));
      if (v && typeof v === "object") {
        const o = {};
        for (const k of Object.keys(v)) {
          if (k === "__proto__" || k === "constructor" || k === "prototype") continue;
          o[sanitizeDeep(k, depth + 1)] = sanitizeDeep(v[k], depth + 1);
        }
        return o;
      }
      return v;
    }

    // Appel authentifié à l'API Apps Script (compatible avec le déploiement actuel et la nouvelle version).
    async function callApi(action, params, tokenOverride) {
      const token = tokenOverride || localStorage.getItem(STORAGE_PIN_KEY) || "";
      if (!token) throw new Error("Non authentifié");
      const hash = await sha256HexBrowser(token);
      if (hash !== EXPECTED_PIN_SHA256) {
        lockApp("Code d'accès refusé : saisissez-le à nouveau.");
        throw new Error("Non authentifié");
      }
      const resp = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(Object.assign({}, params || {}, { action: action, token: token })),
        redirect: "follow"
      });
      if (!resp.ok) throw new Error("Webhook HTTP " + resp.status);
      const json = await resp.json();
      if (json && json.status === "unauthorized" && !tokenOverride) {
        lockApp("Code d'accès refusé : saisissez-le à nouveau.");
        return json;
      }
      if (json && json.counts && json.evalResult === undefined && json.result === undefined) {
        const legacyBody = buildLegacyPayload(action, params);
        if (legacyBody) {
          const resp2 = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(legacyBody),
            redirect: "follow"
          });
          if (resp2.ok) return await resp2.json();
        }
      }
      return json;
    }

    let isSyncingNow = false;
    async function syncFromCloud(showIndicator) {
      const savedPin = localStorage.getItem(STORAGE_PIN_KEY);
      if (!savedPin || isSyncingNow) return;
      isSyncingNow = true;
      const btnArrow = document.getElementById("btn-sync-arrow");
      const ptrEl = document.getElementById("ptr-indicator");
      const ptrSvg = document.getElementById("ptr-svg");
      const startTs = Date.now();
      if (showIndicator) {
        if (btnArrow) btnArrow.classList.add("spinning");
        if (ptrEl) {
          ptrEl.classList.remove("pulling");
          ptrEl.classList.add("refreshing");
          ptrEl.style.opacity = "1";
          ptrEl.style.transform = "translate(-50%, 6px)";
        }
        if (ptrSvg) ptrSvg.style.transform = "";
      }
      try {
        const CURRENT_BUILD_ID = "v62"; /*__APP_BUILD_ID:v62__*/
        // 1. Vérifier en parallèle si une nouvelle version de l'app est publiée (sans cache)
        const htmlRefreshPromise = fetch("./index.html?_t=" + Date.now(), { cache: "no-store" })
          .then(r => r.ok ? r.text() : null)
          .then(async htmlTxt => {
            if (!htmlTxt) return;
            const buildMatch = htmlTxt.match(/\/\*__APP_BUILD_ID:(v\d+)__\*\//);
            if (buildMatch && buildMatch[1] && buildMatch[1] !== CURRENT_BUILD_ID) {
              if ("caches" in window) {
                try {
                  const keys = await caches.keys();
                  await Promise.all(keys.map(k => caches.delete(k)));
                } catch (_) {}
              }
              window.location.reload();
              return;
            }
          })
          .catch(() => {});

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistration().then(reg => { if (reg) reg.update().catch(() => {}); }).catch(() => {});
        }

        // 2. Récupérer en direct les 6 onglets médicaux du Google Sheet + Gardes + Statuts Mails via Apps Script Webhook
        const [wRes] = await Promise.all([
          callApi("read_all").catch(() => null),
          htmlRefreshPromise
        ]);

        if (wRes && wRes.status === "ok" && wRes.evalResult) {
          const syncedAt = new Date().toISOString();
          const cachePayload = { ok: true, synced_at: syncedAt, data: wRes.evalResult };
          localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify(cachePayload));
          applySheetData(wRes.evalResult, syncedAt);
        } else {
          appData.Questions_perso = loadPersoWithLocalStatus(null);
          appData.Demandes_avis = applyLocalAvisStatus(appData.Demandes_avis);
          updateKpis();
          renderCurrentTab();
        }
      } catch (e) {
        appData.Questions_perso = loadPersoWithLocalStatus(null);
        appData.Demandes_avis = applyLocalAvisStatus(appData.Demandes_avis);
        updateKpis();
        renderCurrentTab();
      } finally {
        const elapsed = Date.now() - startTs;
        const waitMore = showIndicator ? Math.max(0, 450 - elapsed) : 0;
        setTimeout(() => {
          if (btnArrow) btnArrow.classList.remove("spinning");
          if (ptrEl) {
            ptrEl.classList.remove("refreshing");
            ptrEl.style.opacity = "0";
            ptrEl.style.transform = "translate(-50%, -70px)";
          }
          isSyncingNow = false;
        }, waitMore);
      }
    }

    function initPullToRefresh() {
      let startY = 0;
      let startX = 0;
      let pulling = false;
      let pullDist = 0;
      const ptrEl = document.getElementById("ptr-indicator");
      const ptrSvg = document.getElementById("ptr-svg");

      document.addEventListener("touchstart", (e) => {
        if (isSyncingNow) return;
        if (window.scrollY > 2) return;
        const modal = document.getElementById("patient-modal");
        if (modal && modal.classList.contains("open")) return;
        const lock = document.getElementById("lock-screen");
        if (lock && !lock.classList.contains("hidden")) return;
        startY = e.touches[0].clientY;
        startX = e.touches[0].clientX;
        pulling = true;
        pullDist = 0;
      }, { passive: true });

      document.addEventListener("touchmove", (e) => {
        if (!pulling || isSyncingNow) return;
        const dy = e.touches[0].clientY - startY;
        const dx = e.touches[0].clientX - startX;
        if (dy <= 0 || Math.abs(dx) > dy * 0.85 || window.scrollY > 2) {
          if (pullDist > 0 && ptrEl) {
            ptrEl.classList.remove("pulling");
            ptrEl.style.opacity = "0";
            ptrEl.style.transform = "translate(-50%, -70px)";
          }
          pulling = false;
          pullDist = 0;
          return;
        }
        pullDist = Math.min(dy * 0.48, 68);
        if (pullDist > 6 && ptrEl && ptrSvg) {
          ptrEl.classList.add("pulling");
          const progress = Math.min(1, pullDist / 48);
          ptrEl.style.opacity = String(progress);
          ptrEl.style.transform = `translate(-50%, ${pullDist - 56}px)`;
          ptrSvg.style.transform = `rotate(${pullDist * 4.5}deg)`;
        }
      }, { passive: true });

      document.addEventListener("touchend", () => {
        if (!pulling || isSyncingNow) return;
        pulling = false;
        if (pullDist >= 48) {
          syncFromCloud(true);
        } else if (ptrEl) {
          ptrEl.classList.remove("pulling");
          ptrEl.style.opacity = "0";
          ptrEl.style.transform = "translate(-50%, -70px)";
        }
        pullDist = 0;
      }, { passive: true });

      // Garantir le défilement vertical et horizontal à la molette de souris sur tous les navigateurs / WebViews
      window.addEventListener("wheel", (e) => {
        if (e.ctrlKey || e.metaKey) return;
        const dy = e.deltaY || 0;
        const dx = e.deltaX || 0;
        if (!dy && !dx) return;

        // 1. Si la modale patient est ouverte, défiler l'intérieur de la modale
        const modal = document.getElementById("patient-modal");
        if (modal && modal.classList.contains("open")) {
          const sheet = modal.querySelector(".modal-sheet");
          if (sheet && dy) {
            const before = sheet.scrollTop;
            requestAnimationFrame(() => {
              if (sheet.scrollTop === before) sheet.scrollTop += dy;
            });
          }
          return;
        }

        // 2. Si le curseur survole une barre horizontale (barre des jours, semaines, gardes, filtres), la molette fait défiler la barre horizontalement
        const horiz = e.target && e.target.closest
          ? e.target.closest("#day-strip-scroll, #weeks-selector-scroll, .garde-strip, .chips-row")
          : null;
        if (horiz && horiz.scrollWidth > horiz.clientWidth && Math.abs(dy) > Math.abs(dx)) {
          horiz.scrollLeft += dy;
          if (horiz.id === "day-strip-scroll") updateDayStripVisibleMonth();
          e.preventDefault();
          return;
        }

        // 3. Défilement vertical de la page
        if (dy) {
          const scEl = document.scrollingElement || document.documentElement;
          const beforeY = window.scrollY || scEl.scrollTop || 0;
          requestAnimationFrame(() => {
            const afterY = window.scrollY || scEl.scrollTop || 0;
            if (afterY === beforeY) {
              scEl.scrollTop += dy;
              if ((window.scrollY || scEl.scrollTop || 0) === beforeY) {
                document.body.scrollTop += dy;
              }
            }
          });
        }
      }, { passive: false });
    }

      if (!matEl && !remEl && !anaEl && !scsEl) return;

      const remarques = remEl ? remEl.value.trim() : "";
      const anapath = anaEl ? anaEl.value.trim() : "";
      const suivi_cs = scsEl ? scsEl.value.trim() : "";
      let meta = {};
      try {
        meta = JSON.parse(decodeURIComponent(encodedMeta));
      } catch (e) {}

      const entry = {
        suivi_key: suiviKey,
        row: meta.row || 0,
        patient_name: meta.patient || "",
        ipp: meta.ipp || "",
        iso_date: meta.isoDate || "",
        category: meta.category || "",
        title: meta.title || "",
        materiel,
        remarques,
        anapath,
        suivi_cs,
        updated_at: new Date().toISOString()
      };
      const patNorm = normName(meta.patient);
      if (patNorm) {
        for (const vMap of Object.values(suiviBlocMap)) {
          if (vMap && normName(vMap.patient_name) === patNorm) {
            vMap.materiel = materiel;
            vMap.remarques = remarques;
            vMap.anapath = anapath;
            vMap.suivi_cs = suivi_cs;
            vMap.updated_at = entry.updated_at;
          }
        }
      }
      suiviBlocMap[suiviKey] = entry;
      try {
        localStorage.setItem(STORAGE_SUIVI_KEY, JSON.stringify(suiviBlocMap));
      } catch (e) {}

      // Mettre à jour en mémoire dans appData.actes, appData.Biopsies et appData.Consultations pour ce patient
      if (patNorm) {
        for (const r of (appData.actes || [])) {
          if ((meta.category === "acte" && meta.row && r._row === meta.row) || normName(r["Identité Patient"]) === patNorm) {
            r["Matériel utilisé"] = materiel;
            r["Remarques (Bloc)"] = remarques;
            r["Suivi (CS de suivi)"] = suivi_cs;
          }
        }
        for (const r of (appData.Biopsies || [])) {
          if ((meta.category === "biopsie" && meta.row && r._row === meta.row) || normName(r["Identité Patient"]) === patNorm) {
            r["Matériel utilisé"] = materiel;
            r["Remarques (Bloc)"] = remarques;
            r["Anatomopathologie"] = anapath;
            r["Suivi (CS de suivi)"] = suivi_cs;
          }
        }
        for (const r of (appData.Consultations || [])) {
          if ((meta.category === "cs" && meta.row && r._row === meta.row) || normName(r["Identité Patient"]) === patNorm) {
            r["Remarques de suivi"] = suivi_cs;
          }
        }
      }

      const hasAny = Boolean(materiel || remarques || anapath || suivi_cs);
      const boxDomId = (prefix || "") + "box-" + suiviKey;
      const btnEl = document.getElementById("btn-" + boxDomId);
      const badgeEl = document.getElementById((prefix || "") + "btnbadge-" + suiviKey);
      if (btnEl) btnEl.classList.toggle("has-saved", hasAny);
      if (badgeEl) badgeEl.textContent = hasAny ? "✓" : "";

      if (closeAfter) {
        const boxEl = document.getElementById(boxDomId);
        const chevEl = document.getElementById("chev-" + boxDomId);
        if (boxEl) boxEl.classList.remove("open");
        if (chevEl) chevEl.textContent = "▸";
        openBlocNoteIds.delete(boxDomId);
      }

      if (statusEl) {
        statusEl.textContent = "⏳ Sync GSheet...";
      }
      updateKpis();

      const savedPin = localStorage.getItem(STORAGE_PIN_KEY);
      if (!savedPin) return;
      try {
        const wRes = await callApi("save_suivi", { entry: entry });
        if (wRes && wRes.status === "ok" && statusEl) {
          statusEl.textContent = "✓ GSheet synchronisé";
        }
      } catch (e) {
        if (statusEl) statusEl.textContent = "✓ Sauvegardé (local)";
      }
    }

    function getPersoStableKey(item) {
      if (!item) return "";
      const dt = String(item["Date"] || "").trim();
      const subj = String(item["Sujet / Objet"] || "").trim().toLowerCase().replace(/\s+/g, " ");
      return `${dt}__${subj}`;
    }

    function loadPersoWithLocalStatus(cloudPersoMap) {
      let savedMap = {};
      try {
        savedMap = JSON.parse(localStorage.getItem(STORAGE_PERSO_KEY) || "{}");
      } catch (e) {}
      let changed = false;
      for (const k of Object.keys(savedMap)) {
        if (/^\d+$/.test(k)) {
          delete savedMap[k];
          changed = true;
        }
      }
      if (cloudPersoMap && typeof cloudPersoMap === "object") {
        for (const k of Object.keys(cloudPersoMap)) {
          if (/^\d+$/.test(k)) continue;
          const cVal = cloudPersoMap[k];
          const lVal = savedMap[k];
          if (cVal && typeof cVal === "object" && cVal.status) {
            if (!lVal || typeof lVal !== "object" || !lVal.updated_at || cVal.updated_at >= lVal.updated_at) {
              savedMap[k] = cVal;
              changed = true;
            }
          } else if (typeof cVal === "string" && !lVal) {
            savedMap[k] = cVal;
            changed = true;
          }
        }
      }
      if (changed) {
        try {
          localStorage.setItem(STORAGE_PERSO_KEY, JSON.stringify(savedMap));
        } catch (e) {}
      }
      return DEFAULT_QUESTIONS_PERSO.map((item, idx) => {
        const sKey = getPersoStableKey(item);
        const entry = sKey ? savedMap[sKey] : undefined;
        const resolvedStatus = (entry && typeof entry === "object" && entry.status)
          ? entry.status
          : (typeof entry === "string" ? entry : item["Statut"]);
        return {
          ...item,
          _row: Number(item._row) > 0 ? Number(item._row) : (idx + 1),
          "Statut": resolvedStatus
        };
      });
    }

    function applyLocalAvisStatus(avisRows) {
      let localAvis = {};
      try {
        localAvis = JSON.parse(localStorage.getItem(STORAGE_AVIS_KEY) || "{}");
      } catch (e) {}
      return (avisRows || []).map(a => {
        const key = String(a._row || "");
        const patKey = normName(a["Identité Patient"]);
        const override = localAvis[key] || (patKey ? localAvis[patKey] : null);
        if (override && override.status) {
          return {
            ...a,
            "Statut Réponse": override.status,
            "Médecin Répondant (Radio B)": override.repondant || a["Médecin Répondant (Radio B)"]
          };
        }
        return a;
      });
    }

    function cleanTimedRows(rows) {
      return (rows || []).filter(r => {
        const pat = String(r["Identité Patient"] || "").trim();
        const dt = String(r["Date"] || "").trim();
        if (!pat || dt.includes("SEMAINE")) return false;
        return true;
      });
    }

    function normalizeDataRows(rows) {
      return (rows || []).map(r => {
        if (r["Identité Patient"]) return r;
        // Fallback si l'ancien cache avait utilisé la ligne 8 comme clés
        const keys = Object.keys(r).filter(k => k !== "_row");
        if (keys.length >= 9) {
          return {
            _row: r._row,
            "Médecin correspondant": r[keys[0]],
            "Identité Patient": r[keys[1]],
            "N° Dossier / IPP": r[keys[2]],
            "Coordonnées / DDN": r[keys[3]],
            "Type d'Intervention / Suivi": r[keys[4]],
            "Échéance / Rendez-vous": r[keys[5]],
            "Médecin Référent": r[keys[6]],
            "Statut": r[keys[7]],
            "Instructions & Remarques Cliniques": r[keys[8]]
          };
        }
        return r;
      }).filter(r => String(r["Identité Patient"] || "").trim() !== "");

    function applySheetData(data, syncedAt) {
      data = sanitizeDeep(data || {});
      if (Array.isArray(data.personal_rdvs)) PERSONAL_MAIL_RDVS = data.personal_rdvs;

      if (data && data.suivi_bloc) {
        loadSuiviBlocMap(data.suivi_bloc);
      } else {
        loadSuiviBlocMap(null);
      }
      const rawAvis = (data.Demandes_avis || []).filter(a => String(a["Identité Patient"] || "").trim() !== "");
      appData = {
        Data: normalizeDataRows(data.Data),
        Demandes_avis: applyLocalAvisStatus(rawAvis),
        Questions_perso: loadPersoWithLocalStatus(data && data.perso_status ? data.perso_status : null),
        Consultations: cleanTimedRows(data.Consultations),
        Imagerie_Anesthesie: cleanTimedRows(data.Imagerie_Anesthesie),
        Biopsies: cleanTimedRows(data.Biopsies),
        actes: cleanTimedRows(data.actes),
        gardes: (data.gardes && Object.keys(data.gardes).length > 0) ? Object.assign({}, DEFAULT_GARDES_HIVER, data.gardes) : DEFAULT_GARDES_HIVER

      const timeStr = syncedAt ? new Date(syncedAt).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "";

      if (!dStr) return null;
      const m = String(dStr).trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (!m) return null;
      return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    }

    function formatVacationPosteLabel(posteStr, periodKey) {
      const s = String(posteStr || "");
      const up = s.toUpperCase();
      if (/\([0-9]/.test(s)) return s;
      const isPm = periodKey === "pm";
      if (up.includes("IRM") && !up.includes("SANS IRM") && !up.includes("JDP")) return `${s} (${isPm ? "13h" : "7h45"})`;
      if (up.includes("ECHO") || up.includes("ÉCHO")) return `${s} (${isPm ? "14h" : "9h"})`;
      if (up.includes("GESTES")) return `${s} (${isPm ? "14h" : "9h"})`;
      if (isPm && (up.includes("CONSULT") || up === "CS")) return `${s} (14h–15h)`;
      if (isPm && up.includes("LECTURE")) return `${s} (14h–16h)`;
      if (up.includes("SAU") || up.includes("OLLIER 4")) return `${s} (8h–18h30)`;
      return s;
    }

        return items.map(txt => `<span class="post-pill ${postColorClass(txt)}">${showHours ? formatVacationPosteLabel(txt, periodKey) : txt}</span>`).join("");
      }
      return items.map(it => {
        const isClosed = Boolean(it.closed || /ferm[eé]|maintenance/i.test(String(it.doc || "")));
        const isMe = /\bTL\b|lefevre/i.test(it.doc);

        const docIcon = isClosed ? (/maintenance/i.test(it.doc) ? "🔧 " : "🔒 ") : "";
        const pLbl = (showHours && !isClosed) ? formatVacationPosteLabel(it.poste, periodKey) : it.poste;
        return `<span class="post-pill ${cls}" style="${isMe ? "box-shadow:0 0 0 1.5px #0284C7;" : ""}">${pLbl} : <strong>${docIcon}${it.doc}</strong></span>`;
      }).join("");

    // Table de sécurité Priorité 1 (désignation explicite dans les mails reçus)
    const EXPLICIT_EMAIL_DOC_BY_KEY = {
      "2026-10-16|huitricquentin|cs": { medecin: "Dr TALABARD Marie-Pauline (MP)", isMine: false },
      "2026-10-28|jaoualnaima|cs": { medecin: "Dr HAMADOUCHE Macil (MH)", isMine: false },

      "2026-11-17|delekianghislaine|cs": { medecin: "Dr HAMADOUCHE Macil (MH) (Écho)", isMine: false }
    };

    // Règle d'attribution en 2 niveaux :
    // 1. Priorité 1 (Mail explicite) : Si un mail désigne clairement le médecin opérateur/consultant (ex: "avec MP" = Dr TALABARD Marie-Pauline, "avec Thomas" / "@LEFEVRE Thomas Jean" = Dr LEFEVRE Thomas Jean, "avec Macil" = Dr HAMADOUCHE Macil), on privilégie ce médecin.
    // 2. Priorité 2 (Planning d'Anne-Marie V3 + Maquette) : Si le mail ne désigne pas clairement l'opérateur/consultant, on détermine le médecin via le planning d'Anne-Marie sur le poste correspondant (et si TL est au poste -> isMine = true de facto).
    function resolveEventWithPlanning(rawMedecin, title, lieu, isoDate, horaire, category, instructions, patientName) {
      const tLow = String(title || "").toLowerCase();
      const lLow = String(lieu || "").toLowerCase();
      const mRaw = String(rawMedecin || "").trim();
      const mLow = mRaw.toLowerCase();
      const remLow = String(instructions || "").toLowerCase();
      const pKey = `${isoDate || ""}|${normName(patientName)}|${category}`;

      if (EXPLICIT_EMAIL_DOC_BY_KEY[pKey]) {
        return EXPLICIT_EMAIL_DOC_BY_KEY[pKey];
      }

      // 1. Consultations d'anesthésie -> Médecin Anesthésiste
      if ((tLow.includes("anesthésie") || lLow.includes("anesth") || mLow.includes("anesth")) && !tLow.includes("arthroscanner") && !tLow.includes("écho") && !tLow.includes("echo")) {
        return { medecin: "Médecin Anesthésiste", isMine: false };
      }

      // 2. Dates non planifiées ou avant la prise de poste du 02/11/2026
      if (!isoDate) {
        const isMe = mLow.includes("lefevre") || mLow.includes("lefèvre") || /\btl\b/.test(mLow);
        return { medecin: mRaw || "À planifier", isMine: isMe };
      }
      const [y, m, d] = isoDate.split("-").map(Number);
      const dt = new Date(y, m - 1, d, 12, 0, 0);
      if (dt < new Date(2026, 10, 2)) {
        return { medecin: mRaw || "Service Radio B", isMine: false };
      }

      const myV = getMyVacationForIso(isoDate);

      // Ignorer l'ancienne mention générique "(Consultation RI)" si elle provient d'un cache antérieur
      const isGenericOldTag = mRaw === "Dr LEFEVRE Thomas Jean (Consultation RI)";
      const cleanMRaw = isGenericOldTag ? "" : mRaw;
      const cleanMLow = cleanMRaw.toLowerCase();

      // 3. PRIORITÉ 1 : Si le médecin opérateur/consultant est clairement désigné (MP = Marie-Pauline Talabard, TL = Thomas Lefèvre, MH = Macil Hamadouche, etc.)
      const hasExplicitTL = cleanMLow.includes("lefevre") || cleanMLow.includes("lefèvre") || /\btl\b/.test(cleanMLow) || /avec\s+thomas|dr\s+lefevre|t\.\s*lefevre/i.test(remLow);
      const hasExplicitMP = cleanMLow.includes("talabard") || /\bmp\b|\bmpt\b/.test(cleanMLow) || /avec\s+mp\b|dr\s+talabard/i.test(remLow);
      const hasOtherExplicitDoc = /hamadouche|\bmh\b|monnier|\bhm\b|laporte|\bal\b|lusi|\bsl\b|allel|\bya\b|costea|\bac\b|feydy|drap[eé]|moutounet|yang|mihoubi|seror|rubini|th[eé]venin/i.test(cleanMLow);

      if (hasExplicitMP && !hasExplicitTL) {
        return {
          medecin: cleanMRaw.includes("TALABARD") ? cleanMRaw : "Dr TALABARD Marie-Pauline (MP)",
          isMine: false
        };
      }

      if (hasOtherExplicitDoc && !hasExplicitTL) {
        return {
          medecin: cleanMRaw,
          isMine: false
        };
      }

      if (hasExplicitTL && !myV.offCochin) {
        return {
          medecin: cleanMRaw || "Dr LEFEVRE Thomas Jean (TL)",
          isMine: true
        };
      }

      // 4. PRIORITÉ 2 : Sinon, on détermine le médecin via le planning d'Anne-Marie (Planning Novembre 2026 V3 + Maquette)
      const genPlan = getGeneralPlanningForIso(isoDate);
      const mins = parseMinutes(horaire);
      const isPm = (mins >= 13 * 60 && mins < 23 * 60);
      const halfDaySlots = isPm ? (genPlan.pm || []) : (genPlan.am || []);
      const otherHalfSlots = isPm ? (genPlan.am || []) : (genPlan.pm || []);

      let targetPostType = "TDM ACHARD 1";
      let displayPostShort = "TDM Achard 1";
      if (tLow.includes("arthroscanner") || lLow.includes("geste") || tLow.includes("scopie")) {
        targetPostType = "GESTES";
        displayPostShort = "Gestes";
      } else if (tLow.includes("écho") || tLow.includes("echo") || lLow.includes("écho") || lLow.includes("echo")) {
        targetPostType = "ECHO";
        displayPostShort = "Écho";
      } else if (tLow.includes("allura") || lLow.includes("allura") || tLow.includes("embolisation") || tLow.includes("artério")) {
        targetPostType = "ALLURA";
        displayPostShort = "Allura";
      } else if (category === "img" && (tLow.includes("irm") || lLow.includes("irm"))) {
        targetPostType = "IRM";
        displayPostShort = "IRM";
      } else if (category === "cs") {
        targetPostType = "CONSULTATION";
        displayPostShort = "Consultation";
      } else {
        targetPostType = "TDM ACHARD 1";
        displayPostShort = "TDM Achard 1";
      }

      function findMatchingDocs(slots, postType) {
        return slots.filter(s => {
          const p = String(s.poste || "").toUpperCase();
          const dc = String(s.doc || "").toUpperCase();
          if (!dc || dc === "FERME" || dc === "FERIE" || dc === "MAINTENANCE") return false;
          if (postType === "ECHO") return p.includes("ECHO");
          if (postType === "GESTES") return p.includes("GESTES");
          if (postType === "ALLURA") return p.includes("ALLURA");
          if (postType === "IRM") return p.includes("IRM");
          if (postType === "CONSULTATION") return p.includes("CONSULTATION");
          if (postType === "TDM ACHARD 1") return p.includes("ACHARD");
          return false;
        });
      }

      let matchedSlots = findMatchingDocs(halfDaySlots, targetPostType);
      if (targetPostType === "CONSULTATION" && matchedSlots.length === 0) {
        matchedSlots = findMatchingDocs(otherHalfSlots, "CONSULTATION");
      }

      if (matchedSlots.length > 0) {
        const rawCodes = matchedSlots.map(s => s.doc).join(" / ");
        const hasTL = /\bTL\b/i.test(rawCodes) && !myV.offCochin;
        if (hasTL) {
          return {
            medecin: `Dr LEFEVRE Thomas Jean (TL) (${displayPostShort})`,
            isMine: true
          };
        } else {
          const expandedNames = matchedSlots.map(s => expandDocString(s.doc)).join(" / ");
          return {
            medecin: `${expandedNames} (${displayPostShort})`,
            isMine: false
          };
        }
      }

      if (myV.offCochin) {
        return { medecin: cleanMRaw || "Service Radio B", isMine: false };
      }
      return { medecin: cleanMRaw || "Service Radio B", isMine: hasExplicitTL };
    }

        const res = resolveEventWithPlanning(c["Médecin en charge"], c["Type d'acte / Consultation"], c["Lieu / Modalité"], iso, c["Horaire"], "cs", c["Instructions & Remarques"], c["Identité Patient"]);
        events.push({
          row: c._row || 0,

      });
      return events;
    }

    function filterEventsByScope(events) {
      if (agendaScope === "all") return events;

    function parseMinutes(h) {
      const m = String(h || "").match(/(\d{1,2})\s*[h:]\s*(\d{0,2})/i);
      if (!m) return 9999;
      return parseInt(m[1], 10) * 60 + (m[2] ? parseInt(m[2], 10) : 0);
    }

    function normName(s) {
      return String(s || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\b(mr|mme|mlle|m\.|dr|pr)\b/g, "")
        .replace(/[^a-z0-9]/g, "");
    }

    function findPatientMasterRecord(patientName, ipp) {
      const cleanIpp = String(ipp || "").replace(/[^0-9]/g, "");
      const nTarget = normName(patientName);
      for (const row of appData.Data) {
        const rIpp = String(row["N° Dossier / IPP"] || "").replace(/[^0-9]/g, "");
        const rName = normName(row["Identité Patient"]);
        if (cleanIpp && cleanIpp.length >= 7 && cleanIpp === rIpp) return row;
        if (nTarget && rName && (nTarget === rName || (nTarget.length >= 7 && rName.includes(nTarget)) || (rName.length >= 7 && nTarget.includes(rName)))) {
          return row;
        }
      }
      return null;
    }

    function inferPatientCrProfile(ev) {
      const pNorm = normName(ev.patient);
      if (PREBUILT_PATIENT_CRS[pNorm]) {
        return Object.assign({}, PREBUILT_PATIENT_CRS[pNorm]);
      }
      const master = findPatientMasterRecord(ev.patient, ev.ipp) || {};
      const rawName = String(master["Identité Patient"] || ev.patient || "[Nom, Prénom à préciser]").trim();
      const isFem = /\b(mme|mlle|madame|mademoiselle)\b/i.test(rawName) || /\b(née le|patiente|adressée|hospitalisée|informée)\b/i.test(String(master["Coordonnées / DDN"] || "") + " " + String(master["Instructions & Remarques Cliniques"] || "") + " " + String(ev.remarques || "")) || /\b(sophie|helene|hélène|valerie|valérie|joceline|faiza|paule|reem|laurence|corinne|marie|cécile|cecile|micheline|naima|julienne|maud|sandra|toscane|catherine|florence|nathalie|kawthar|amandine)\b/i.test(rawName);
      let civiliteNom = rawName;
      if (!/^(m\.|mr|mme|mlle)\b/i.test(civiliteNom)) {
        civiliteNom = (isFem ? "Mme " : "M. ") + civiliteNom;
      } else {
        civiliteNom = civiliteNom.replace(/^mr\b/i, "M.");
      }

      const coord = String(master["Coordonnées / DDN"] || "");
      const rem = String(master["Instructions & Remarques Cliniques"] || ev.remarques || "");
      const interv = String(master["Type d'Intervention / Suivi"] || ev.title || "[geste à préciser]");

      let age = "[À préciser]";
      const ageMatch = (coord + " " + rem).match(/\b(\d{1,3})\s*ans\b/i);
      if (ageMatch) {
        age = ageMatch[1];
      } else {
        const ddnMatch = coord.match(/(\d{2})\/(\d{2})\/(\d{4})/);
        if (ddnMatch) {
          const bYear = parseInt(ddnMatch[3], 10);
          const bMonth = parseInt(ddnMatch[2], 10);
          const bDay = parseInt(ddnMatch[1], 10);
          let calcAge = 2026 - bYear;
          if (10 < bMonth || (10 === bMonth && 29 < bDay)) calcAge--;
          if (calcAge > 0 && calcAge < 120) age = String(calcAge);
        }
      }

      const isSuiviDefault = /suivi|post[\s\-]|contrôle|récidive/i.test(interv + " " + String(ev.title || ""));
      const cleanInterv = (interv && interv !== "-")
        ? interv.replace(/\s*\(Geste\s*\d+\/\d+[^)]*\)/gi, "").trim()
        : "[<geste à préciser>]";
      const docMatch = rem.match(/adressé[e]?\s+par\s+(?:le\s+)?((?:Pr|Dr|Docteur|Professeur)\.?\s+(?:[A-ZÉÈÊËÀÂÎÏÔÙÛÇ][a-zéèêëàâîïôùûç\-]*\.?\s*)+(?:(?:&|et)\s*(?:Pr|Dr|Docteur|Professeur)\.?\s+(?:[A-ZÉÈÊËÀÂÎÏÔÙÛÇ][a-zéèêëàâîïôùûç\-]*\.?\s*)+)?)/i);
      const refDocStr = docMatch ? `un suivi spécialisé (adressé${isFem ? "e" : ""} par ${docMatch[1].trim()})` : "[<terrain / antécédents pertinents à préciser>]";
      return {
        civiliteNom,
        fem: isFem,
        age: age === "[À préciser]" ? "[<âge>]" : age,
        defaultMode: isSuiviDefault ? "suivi" : "preop",
        motif: "[<lésion / motif clinique et imagerie à préciser>]",
        terrain: refDocStr,
        arguments: "[<arguments cliniques et paracliniques à préciser>]",
        gesteRetenu: cleanInterv,
        objectifs: /biopsie/i.test(cleanInterv) ? "diagnostique" : "antalgique et thérapeutique",
        principesNom: cleanInterv,
        benefices: /biopsie/i.test(cleanInterv) ? "caractérisation histologique précise" : "soulagement douloureux et de contrôle local",
        risques: "les risques hémorragique, infectieux, neurologique et d'échec ou de récidive",
        terrainSuivi: "[<pathologie / lésion suivie à préciser>]",
        gesteRealise: cleanInterv,
        indicationInitiale: "[<indication initiale à préciser>]",
        detailsProcedure: cleanInterv
      };
    }

    function getDefaultCrModeForCard(ev, prof) {
      const todayIso = dateToIso(new Date());
      if (currentTab === "suivi" && suiviFilter === "done") return "cro";
      if (currentTab === "suivi" && suiviFilter === "cs_suivi") return "suivi";
      if (currentTab === "activite" && activiteSub === "done" && (activiteMode === "acte" || activiteMode === "biopsie")) return "cro";
      if (currentTab === "activite" && activiteSub === "done" && activiteMode === "cs") return "suivi";
      if (ev.isoDate && ev.isoDate === todayIso && (ev.category === "acte" || ev.category === "biopsie")) return "cro";
      if (ev.isoDate && ev.isoDate < todayIso && (ev.category === "acte" || ev.category === "biopsie")) return "crh";
      if (/suivi/i.test(String(ev.title || "") + " " + String(ev.catActe || ""))) return "suivi";
      return prof.defaultMode || "preop";
    }

    function detectCroGestureType(ev, prof, sEntry) {
      const ctx = `${ev.title || ""} ${ev.remarques || ""} ${prof.gesteRetenu || ""} ${prof.gesteRealise || ""} ${prof.motif || ""} ${prof.detailsProcedure || ""} ${(sEntry && sEntry.materiel) || ""}`.toLowerCase();
      if (/morton/i.test(ctx)) return "cryo_morton";
      if (/desmo[ïi]de/i.test(ctx)) return "cryo_desmoide";
      if (/\bect\b|électrochimio|electrochimio|bléomycine|bleomycine/i.test(ctx)) return "ect";
      if (/ostéocool|osteocool|\bocp\b|geste\s+interventionnel\s+rachidien/i.test(ctx)) return "osteocool";
      if (/ostéome\s+ostéo[ïi]de|\boo\b|chondroblastome|ostéoblastome/i.test(ctx)) return "rf_oo";
      if (/génicul|genicul/i.test(ctx)) {
        if (/test\s+anesth|bloc\s+test/i.test(ctx) && !/radiofréquence|\brf\b|neurolyse|venom/i.test(`${ev.title || ""} ${(sEntry && sEntry.materiel) || ""}`)) {
          return "test_anesth_genicule";
        }
        return "rf_genicules";
      }
      if (/rhizolyse|(?:radiofréquence|\brf\b|neurolyse).*facettaire|facettaire.*(?:radiofréquence|\brf\b|neurolyse)/i.test(ctx)) return "rf_facettaire";
      if (/(?:radiofréquence|\brf\b|neurolyse|cryoneurolyse).*(?:nerf|fémoro|femoro|clunéal|cluneal|intercostal|pulsée|pulsee)|rfna/i.test(ctx)) return "rf_nerf_pulse";
      if (/test\s+anesth|bloc\s+test/i.test(ctx)) {
        if (/trochant/i.test(ctx)) return "test_trochanter";
        return "test_facettaire";
      }
      if (/arnold|grand\s+occipital/i.test(ctx)) return "infiltration_arnold";
      if (/épidurale|epidurale|interlamaire/i.test(ctx)) return "infiltration_epidurale";
      if (/inter[\s\-]*articulaire\s+post|articulaires?\s+post|infiltration\s+articulaire\s+post/i.test(ctx)) return "infiltration_iap";
      if (/vissage/i.test(ctx)) return "vissage_cimento";
      if (/vertébroplastie|vertebroplastie|cimentoplastie|sacroplastie/i.test(ctx)) {
        if (/fracture|tassement|ostéopor/i.test(ctx)) return "vertebro_fracture";
        return "vertebro_secondaire";
      }
      if (/cryo/i.test(ctx)) return "cryo_desmoide";
      if (/radiofréquence|\brf\b|thermoablation/i.test(ctx)) return "rf_oo";
      if (ev.category === "biopsie" || /^biopsie/i.test(String(ev.title || "").trim()) || /biopsie/i.test(ctx)) return "biopsie";
      return "generic";
    }

    function buildPatientCroText(ev) {
      const prof = inferPatientCrProfile(ev);
      const sEntry = getSuiviEntry(ev);
      const gType = detectCroGestureType(ev, prof, sEntry);
      const isFem = Boolean(prof.fem);
      const patNom = isFem ? "Patiente" : "Patient";
      const lePat = isFem ? "La patiente" : "Le patient";
      const vuAccord = isFem ? "vue" : "vu";
      const recuAccord = isFem ? "reçue" : "reçu";
      const revuAccord = isFem ? "revue" : "revu";
      const recontacteAccord = isFem ? "recontactée" : "recontacté";
      const adresseAccord = isFem ? "Adressée" : "Adressé";
      const civNom = (prof.civiliteNom && !prof.civiliteNom.includes("À préciser"))

      const ageVal = (prof.age && !prof.age.includes("À préciser")) ? prof.age : null;
      const matNote = (sEntry && sEntry.materiel && sEntry.materiel.trim()) ? sEntry.materiel.trim() : "";

      const fullCtx = `${ev.title || ""} ${ev.remarques || ""} ${prof.motif || ""} ${prof.gesteRetenu || ""} ${prof.detailsProcedure || ""}`;
