    function inferPatientCrProfile(ev) {
      const pNorm = normName(ev.patient);
      if (PREBUILT_PATIENT_CRS[pNorm]) {
        return Object.assign({}, PREBUILT_PATIENT_CRS[pNorm]);
      }
      const master = findPatientMasterRecord(ev.patient, ev.ipp) || {};
      const rawName = String(master["Identité Patient"] || ev.patient || "[Nom, Prénom à préciser]").trim();
      const isFem = /\b(mme|mlle|madame|mademoiselle)\b/i.test(rawName) || /\b(née le|patiente)\b/i.test(String(master["Coordonnées / DDN"] || "") + " " + String(master["Instructions & Remarques Cliniques"] || ""));
      let civiliteNom = rawName;
      if (!/^(m\.|mr|mme|mlle)\b/i.test(civiliteNom)) {
        civiliteNom = (isFem ? "Mme " : "M. ") + civiliteNom;
      } else {
        civiliteNom = civiliteNom.replace(/^mr\b/i, "M.");
      }

      const coord = String(master["Coordonnées / DDN"] || "");
      const rem = String(master["Instructions & Remarques Cliniques"] || ev.remarques || "");
      const interv = String(master["Type d'Intervention / Suivi"] || ev.title || "[geste à préciser]");

      let age = "[À préciser]";
      const ageMatch = (coord + " " + rem).match(/\b(\d{1,3})\s*ans\b/i);
      if (ageMatch) {
        age = ageMatch[1];
      } else {
        const ddnMatch = coord.match(/(\d{2})\/(\d{2})\/(\d{4})/);
        if (ddnMatch) {
          const bYear = parseInt(ddnMatch[3], 10);
          const bMonth = parseInt(ddnMatch[2], 10);
          const bDay = parseInt(ddnMatch[1], 10);
          let calcAge = 2026 - bYear;
          if (10 < bMonth || (10 === bMonth && 29 < bDay)) calcAge--;
          if (calcAge > 0 && calcAge < 120) age = String(calcAge);
        }
      }

      const isSuiviDefault = /suivi|post[\s\-]|contrôle|récidive/i.test(interv + " " + String(ev.title || ""));
      return {
        civiliteNom,
        fem: isFem,
        age,
        defaultMode: isSuiviDefault ? "suivi" : "preop",
        motif: rem && rem !== "-" ? rem : "[motif / tableau clinique / imagerie à préciser]",
        terrain: coord && coord !== "-" && !/^\d/.test(coord) ? coord : "[terrain / antécédents pertinents à préciser]",
        arguments: rem && rem !== "-" ? rem : "[arguments cliniques et paracliniques à préciser]",
        gesteRetenu: interv !== "-" ? interv : "[geste retenu / niveau à préciser]",
        objectifs: /biopsie/i.test(interv) ? "diagnostique" : "antalgique et thérapeutique",
        principesNom: interv !== "-" ? interv : "[nom de l'intervention à préciser]",
        benefices: /biopsie/i.test(interv) ? "caractérisation histologique précise" : "soulagement douloureux et de contrôle local",
        risques: "les risques hémorragique, infectieux, neurologique et d'échec ou de récidive",
        terrainSuivi: rem && rem !== "-" ? rem : "[terrain / pathologie sous-jacente à préciser]",
        gesteRealise: interv !== "-" ? interv : "[nom de l'intervention / niveaux traités à préciser]",
        indicationInitiale: rem && rem !== "-" ? rem : "[indication initiale / tableau pré-opératoire à préciser]",
        detailsProcedure: interv !== "-" ? interv : "[détails de la procédure à préciser]"
      };
    }

    function getDefaultCrModeForCard(ev, prof) {
      const todayIso = dateToIso(new Date());
      if (currentTab === "suivi" && suiviFilter === "done") return "crh";
      if (currentTab === "suivi" && suiviFilter === "cs_suivi") return "suivi";
      if (currentTab === "activite" && activiteSub === "done" && (activiteMode === "acte" || activiteMode === "biopsie")) return "crh";
      if (currentTab === "activite" && activiteSub === "done" && activiteMode === "cs") return "suivi";
      if (ev.isoDate && ev.isoDate <= todayIso && (ev.category === "acte" || ev.category === "biopsie")) return "crh";
      if (/suivi/i.test(String(ev.title || "") + " " + String(ev.catActe || ""))) return "suivi";
      return prof.defaultMode || "preop";
    }

    function stripTechnicalMaterialForCrh(txt) {
      if (!txt) return "";
      return String(txt)
        .replace(/\b\d+(?:[.,]\d+)?\s*(?:G|Gauge|Fr|French|mm|cm|mL|mg|W|watts?|minutes?|min|sec|secondes?|mGy(?:[.,]cm)?|°C)\b/gi, "")
        .replace(/\b(?:OsteoCool|IceRod|IceSphere|IceSeed|IceForce|IcePearl|Bonopty|Madison|Laredo|Kyphon|Confidence|Vertecem|Boston\s+Scientific|Medtronic|Stryker|Galil|IGEA|Cliniporator)\b/gi, "")
        .replace(/\b(?:trocart\s+coaxial|aiguille\s+coaxiale|coaxial|bipolaire|monopolaire|DLP|PDL|hydrodissection\s+au\s+[^,.;]+|cycles?\s+de\s+congélation|décongélation\s+active)\b/gi, "")
        .replace(/\bEVA\s*[:=]?\s*(\d+\s*\/\s*10)\b/gi, "douleurs évaluées à $1")
        .replace(/\bATB\b/g, "antibiothérapie")
        .replace(/\bATG\b/g, "traitement antalgique")
        .replace(/\bAINS\b/g, "anti-inflammatoires")
        .replace(/\bHBPM\b/g, "anticoagulation préventive")
        .replace(/\bPNO\b/gi, "pneumothorax")
        .replace(/\bTDM\b/g, "scanner")
        .replace(/\bCS\b/g, "consultation")
        .replace(/\s+,/g, ",")
        .replace(/,\s*,+/g, ",")
        .replace(/^\s*[,;:\-–]+\s*|\s*[,;:\-–]+\s*$/g, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    function capFirstLetter(s) {
      const str = String(s || "").trim();
      if (!str) return "";
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function lowFirstLetter(s) {
      const str = String(s || "").trim();
      if (!str) return "";
      if (/^(?:IRM|TDM|TEP|RCP|HDJ|EVA|AINS|M\.|Mme)\b/.test(str)) return str;
      return str.charAt(0).toLowerCase() + str.slice(1);
    }

    function extractClinicalAnnotations(sEntry) {
      const result = {
        complications: [],
        recommandations: [],
        clinique: [],
        anapathNote: "",
        inferredEvoGlobale: ""
      };
      if (!sEntry) return result;

      // 1. Anatomopathologie (nettoyée des termes purement techniques d'aiguille)
      if (sEntry.anapath && sEntry.anapath.trim()) {
        const cleanAna = stripTechnicalMaterialForCrh(sEntry.anapath.trim()).replace(/[.]+$/, "").trim();
        if (cleanAna) result.anapathNote = cleanAna;
      }

      // 2. Analyse combinée des annotations saisies dans Remarques et Suivi CS (le champ Matériel est volontairement ignoré)
      const rawBlocks = [];
      if (sEntry.remarques && sEntry.remarques.trim()) rawBlocks.push(sEntry.remarques.trim());
      if (sEntry.suivi_cs && sEntry.suivi_cs.trim()) rawBlocks.push(sEntry.suivi_cs.trim());

      const seenClauses = new Set();
      for (const block of rawBlocks) {
        const parts = String(block).split(/(?:\r?\n|[.;])+/);
        for (const rawPart of parts) {
          const trimmedRaw = rawPart.trim();
          if (!trimmedRaw) continue;

          // Détecter les préfixes explicites tapés par l'opérateur
          const isExplicitComp = /^\s*(?:complications?|incidents?|événements?\s+indésirables?)\s*[:\-–]/i.test(trimmedRaw);
          const isExplicitReco = /^\s*(?:recommandations?|consignes?|conseils?|conduite\s+à\s+tenir|cat|suites?\s+à\s+donner|à\s+prévoir)\s*[:\-–]/i.test(trimmedRaw);

          const strippedPrefix = trimmedRaw
            .replace(/^\s*(?:complications?|incidents?|événements?\s+indésirables?|recommandations?|consignes?|conseils?|conduite\s+à\s+tenir|cat|suites?\s+à\s+donner|à\s+prévoir)\s*[:\-–]\s*/i, "")
            .trim();

          const clean = stripTechnicalMaterialForCrh(strippedPrefix).replace(/[.]+$/, "").trim();
          if (!clean) continue;

          const dedupKey = clean.toLowerCase();
          if (seenClauses.has(dedupKey)) continue;
          seenClauses.add(dedupKey);

          // Ignorer les mentions "RAS" / "aucune complication" brutes tout en notant l'évolution favorable
          if (/^(?:ras|r\.a\.s\.?|aucune?\s+complication|pas\s+de\s+complication|suites?\s+simples?|sans\s+particularité|sans\s+complication)$/i.test(clean)) {
            if (!result.inferredEvoGlobale) result.inferredEvoGlobale = "favorable";
            continue;
          }

          const hasNegatedComp = /\b(?:sans|pas\s+de|pas\s+d'|absence\s+de|absence\s+d'|aucune?)\s+(?:complication|incident|hématome|saignement|infection|déficit|douleur|fuite|récidive)/i.test(clean);
          const hasCompKeyword = !hasNegatedComp && (
            isExplicitComp ||
            /\b(?:complication|incident|hématome|saignement|hémorrag|hémarthrose|fuite|infection|abcès|fièvre|fébricule|déficit|parésie|paralysie|paresthésie|hypoesthésie|dysesthésie|radiculalgie|sciatique|cruralgie|névralgie|brûlure|nécrose|pneumothorax|épanchement|malaise|vagal|allerg|intolérance|oedème|œdème|phlébite|thrombose|recrudescence\s+douloureuse|douleurs?\s+(?:rebelle|intense|aiguë|post[\s\-]?op)|récidive|échec)\b/i.test(clean)
          );

          const hasRecoKeyword = isExplicitReco || /\b(?:recommand|consigne|conseil|conduite\s+à\s+tenir|prévoir|à\s+revoir|revoir|contrôle|surveillance|repos|appui|décharge|béquill|canne|attelle|orthèse|ceinture|corset|immobilisation|kiné|rééducation|physiothérapie|arrêt\s+de\s+travail|arrêt\s+du?\s+sport|reprise|eliquis|plavix|kard[eé]gic|anticoag|antiagrég|pansement|fils|glaçage|glace|ordonnance|traitement|antalgique|palier|anti-inflammatoire|antibiothérapie|rcp|adress)\b/i.test(clean);

          if (hasCompKeyword && !isExplicitReco) {
            result.complications.push(lowFirstLetter(clean));
          } else if (hasRecoKeyword) {
            result.recommandations.push(lowFirstLetter(clean));
          } else {
            result.clinique.push(lowFirstLetter(clean));
          }

          if (/\b(?:favorable|amélioration|soulagement|disparition|nette\s+diminution|bonne\s+évolution|très\s+bon|satisfaisant|indolore|efficace)\b/i.test(clean)) {
            result.inferredEvoGlobale = "favorable";
          } else if (/\b(?:stationnaire|inchangé|stable)\b/i.test(clean) && !result.inferredEvoGlobale) {
            result.inferredEvoGlobale = "stationnaire";
          } else if (/\b(?:défavorable|aggravation|échec|persistance|rebelle)\b/i.test(clean)) {
            result.inferredEvoGlobale = "marquée par la persistance de la symptomatologie";
          }
        }
      }
      return result;
    }

    function findPatientInterventionDateAndAnesth(ev, prof) {
      const patNorm = normName(ev.patient);
      let dateHospit = "";
      if ((ev.category === "acte" || ev.category === "biopsie") && ev.dateStr && /\d{2}\/\d{2}\/\d{4}/.test(ev.dateStr)) {
        dateHospit = ev.dateStr;
      }
      if (!dateHospit && patNorm) {
        for (const a of (appData.actes || [])) {
          if (normName(a["Identité Patient"]) === patNorm && /\d{2}\/\d{2}\/\d{4}/.test(String(a["Date"] || ""))) {
            dateHospit = a["Date"];
            break;
          }
        }
      }
      if (!dateHospit && patNorm) {
        for (const b of (appData.Biopsies || [])) {
          if (normName(b["Identité Patient"]) === patNorm && /\d{2}\/\d{2}\/\d{4}/.test(String(b["Date"] || ""))) {
            dateHospit = b["Date"];
            break;
          }
        }
      }
      const combined = `${prof.gesteRetenu || ""} ${prof.detailsProcedure || ""} ${ev.title || ""} ${ev.remarques || ""}`.toLowerCase();
      let anesth = "sous anesthésie locale ou générale selon le protocole retenu";
      if (/\bag\b|anesthésie générale/i.test(combined)) {
        anesth = "sous anesthésie générale";
      } else if (/\bal\b|anesthésie locale|sous locale/i.test(combined)) {
        anesth = "sous anesthésie locale";
      }
      let guidage = "sous guidage scanographique";
      if (/échograph|\bécho\b/i.test(combined)) {
        guidage = "sous guidage échographique";
      } else if (/scopie|allura/i.test(combined)) {
        guidage = "sous guidage scopique et scanographique";
      }
      return { dateHospit, anesth, guidage };
    }

    function buildPatientCrText(ev, mode) {
      const prof = inferPatientCrProfile(ev);
      const sEntry = getSuiviEntry(ev);
      const ageAccord = prof.fem ? "âgée" : "âgé";
      const suiviAccord = prof.fem ? "suivie" : "suivi";
      const hospitAccord = prof.fem ? "hospitalisée" : "hospitalisé";
      const auPatient = prof.fem ? "à la patiente" : "au patient";
      const lePatient = prof.fem ? "la patiente" : "le patient";

      const isPureDiagBiopsie = String(prof.objectifs || "").trim() === "diagnostique" || /^biopsie/i.test(String(prof.gesteRetenu || "").trim());

      // Enrichissement ostéoarticulaire systématique : douleurs & impact / retentissement fonctionnel (hors biopsie purement diagnostique)
      let objEnrichi = prof.objectifs || "antalgique et fonctionnelle";
      if (!isPureDiagBiopsie && !/fonctionnel/i.test(objEnrichi) && !objEnrichi.includes("À préciser")) {
        if (objEnrichi === "antalgique") {
          objEnrichi = "antalgique et fonctionnelle";
        } else if (/^curative et antalgique$/i.test(objEnrichi)) {
          objEnrichi = "curative, antalgique et fonctionnelle";
        } else if (/antalgique/i.test(objEnrichi)) {
          objEnrichi = objEnrichi.replace(/antalgique/i, "antalgique et fonctionnelle");
        } else {
          objEnrichi = `antalgique, fonctionnelle et ${objEnrichi}`;
        }
      }

      let argsEnrichis = prof.arguments || "la symptomatologie douloureuse, le retentissement fonctionnel et le bilan d'imagerie";
      if (!isPureDiagBiopsie && !/fonctionnel|gêne|autonomie|marche/i.test(argsEnrichis) && !argsEnrichis.includes("À préciser")) {
        if (/doul/i.test(argsEnrichis)) {
          argsEnrichis = argsEnrichis.replace(/(symptomatologie douloureuse[^,]*|douleurs[^,]*|métatarsalgies[^,]*|gonalgies[^,]*|cervicalgies[^,]*)/i, "$1, le retentissement fonctionnel");
        } else {
          argsEnrichis = `la symptomatologie douloureuse, son retentissement fonctionnel et ${argsEnrichis}`;
        }
      }

      let benefEnrichis = prof.benefices || "soulagement des douleurs et d'amélioration du retentissement fonctionnel";
      if (!isPureDiagBiopsie && !/fonctionnel|marche|autonomie|appui/i.test(benefEnrichis) && !benefEnrichis.includes("À préciser")) {
        benefEnrichis = `${benefEnrichis} et d'amélioration du retentissement fonctionnel`;
      }

      const ann = extractClinicalAnnotations(sEntry);

      if (mode === "preop") {
        const extraClin = ann.clinique.length > 0 ? ` (${ann.clinique.join(", ")})` : "";
        const risquesEnrichis = ann.complications.length > 0
          ? `${prof.risques} (avec vigilance particulière concernant : ${ann.complications.join(", ")})`
          : prof.risques;
        const linesPreop = [
          "Chère Consœur, Cher Confrère,",
          "",
          `Nous avons eu en consultation ${prof.civiliteNom}, ${ageAccord} de ${prof.age} ans, présentant ${prof.motif}, survenant sur ${prof.terrain}.`,
          "",
          `Au regard de ${argsEnrichis}${extraClin}, une indication de ${prof.gesteRetenu} à visée ${objEnrichi} a été retenue.`,
          "",
          `Au cours de cette consultation, nous avons expliqué ${auPatient} :`,
          `- les principes de ${prof.principesNom} ;`,
          `- les modalités techniques du geste, réalisé sous guidage radiologique ;`,
          `- les bénéfices attendus, notamment en termes de ${benefEnrichis} ;`,
          `- ainsi que les risques inhérents à la procédure, notamment ${risquesEnrichis}.`,
          "",
          `Les modalités, bénéfices et risques de cette prise en charge ont été expliqués ${auPatient}, qui a bien compris l'ensemble de ces éléments et a donné son accord pour l'intervention.`
        ];
        if (ann.recommandations.length > 0) {
          linesPreop.push("");
          linesPreop.push(`En vue de cette prise en charge, il est recommandé : ${ann.recommandations.join(" ; ")}.`);
        }
        linesPreop.push(
          "",
          "Je vous prie de recevoir, Chère Consœur, Cher Confrère, l'assurance de mes sincères salutations.",
          "",
          "Dr Lefèvre"
        );
        return linesPreop.join("\n");
      }

      if (mode === "crh") {
        // Mode 3 : Compte Rendu d'Hospitalisation (CRH) — Concis, sans répétition, douleurs & impact fonctionnel, zéro matériel technique, signature Dr T. Lefevre
        const { dateHospit, anesth, guidage } = findPatientInterventionDateAndAnesth(ev, prof);
        const ageChunk = (prof.age && !prof.age.includes("À préciser")) ? `, ${prof.age} ans,` : " ([âge à préciser])";
        const dateChunk = dateHospit ? `le ${dateHospit}` : "le [Date à préciser]";
        const rawGeste = prof.gesteRealise && !prof.gesteRealise.includes("À préciser")
          ? prof.gesteRealise
          : (prof.gesteRetenu || "[geste réalisé à préciser]");
        const gesteCourt = rawGeste
          .replace(/\s+sous\s+(?:guidage\s+|contrôle\s+)?(?:scanographique|scanner|échographique|échographie|scopique|anesthésie\s+générale|anesthésie\s+locale|AG|AL)(?:\s+et\s+sous\s+[^,.)]+)?/gi, "")
          .replace(/\s+en\s+HDJ(?:\s+radio\s*B)?/gi, "")
          .trim();

        const terrainClause = (prof.terrain && !prof.terrain.includes("À préciser"))
          ? ` sur un terrain de ${prof.terrain}`
          : "";
        const procContext = `${rawGeste} ${prof.detailsProcedure || ""}`;
        const isBiopsie = /biopsie/i.test(procContext);
        const isCimento = /cimento|vertébro/i.test(procContext);
        const isVissage = /vissage|ostéosynthèse/i.test(procContext);
        const isThermo = /cryo|radiofréquence|\brf\b|thermo|électrochimio|\bect\b|alcoolisation/i.test(procContext);

        let deroulementBase = `L'intervention s'est déroulée ${anesth} et ${guidage}, avec un contrôle d'imagerie final satisfaisant`;
        if (isBiopsie) {
          deroulementBase = `L'intervention s'est déroulée ${anesth} et ${guidage}, permettant la réalisation de prélèvements biopsiques ciblés`;
        } else if (isThermo && (isCimento || isVissage)) {
          deroulementBase = `L'intervention s'est déroulée ${anesth} et ${guidage}, avec une couverture satisfaisante de la lésion et une bonne stabilisation osseuse au contrôle final`;
        } else if (isCimento) {
          deroulementBase = `L'intervention s'est déroulée ${anesth} et ${guidage}, avec un remplissage satisfaisant par le ciment au contrôle final`;
        } else if (isVissage) {
          deroulementBase = `L'intervention s'est déroulée ${anesth} et ${guidage}, avec un bon positionnement de l'ostéosynthèse au contrôle final`;
        } else if (isThermo) {
          deroulementBase = `L'intervention s'est déroulée ${anesth} et ${guidage}, avec une couverture satisfaisante de la cible au contrôle final dans le respect des structures adjacentes`;
        }

        let deroulementEtSuites = "";
        if (ann.complications.length > 0) {
          const extraClinCrh = ann.clinique.length > 0 ? ` (${ann.clinique.join(", ")})` : "";
          deroulementEtSuites = `${deroulementBase}. Les suites ont été marquées par ${ann.complications.join(", ")}${extraClinCrh}.`;
        } else {
          const sansComp = isCimento ? ", sans fuite extra-osseuse ni complication per-opératoire." : ", sans complication per-opératoire.";
          const suitesTxt = ann.clinique.length > 0
            ? `Les suites immédiates sont simples (${ann.clinique.join(", ")}).`
            : `Les suites immédiates sont simples.`;
          deroulementEtSuites = `${deroulementBase}${sansComp} ${suitesTxt}`;
        }

        const impactCrh = isPureDiagBiopsie
          ? ""
          : (/doul/i.test(prof.motif) ? " avec retentissement fonctionnel" : " responsable de douleurs et d'un retentissement fonctionnel");

        const consignesList = [];
        for (const rec of ann.recommandations) {
          consignesList.push(`- ${capFirstLetter(rec)}`);
        }
        if (ann.anapathNote) {
          consignesList.push(`- Anatomopathologie : ${capFirstLetter(ann.anapathNote)}`);
        }
        consignesList.push(
          "- Repos relatif 48 heures et reprise progressive de l'appui / des activités selon la tolérance douloureuse",
          "- Pansement sec 48 heures (pas de fils à retirer) et traitement antalgique adapté"
        );
        if (/eliquis|plavix|kard[eé]gic|anticoag/i.test(prof.terrain + " " + (prof.detailsProcedure || "")) && !ann.recommandations.some(r => /eliquis|plavix|kard[eé]gic|anticoag/i.test(r))) {
          consignesList.push("- Reprise du traitement antithrombotique selon le protocole validé");
        }
        consignesList.push(
          isBiopsie
            ? "- Consultation dédiée pour résultats anatomopathologiques"
            : "- Consultation de suivi dédiée (évaluation antalgique, fonctionnelle et imagerie de contrôle)"
        );

        return [
          "Chère consœur, cher confrère,",
          "",
          `${prof.civiliteNom}${ageChunk} a été ${hospitAccord} ${dateChunk} pour ${gesteCourt}.`,
          "",
          `Pour rappel, ${lePatient} présente ${prof.motif}${impactCrh}${terrainClause}, justifiant ce geste à visée ${objEnrichi} réalisé après information sur les bénéfices et les risques et recueil de son accord.`,
          "",
          deroulementEtSuites,
          "",
          "Suites et consignes :",
          ...consignesList,
          "",
          "Bien confraternellement,",
          "",
          "Dr T. Lefevre"
        ].join("\n");
      }

      // Mode 2 : Consultation de Suivi (rappel concis, sans détails techniques ni matériel, intégrant complications et recommandations)
      let indicInitSuivi = prof.indicationInitiale || "[indication initiale : douleurs et retentissement fonctionnel pré-opératoire à préciser]";
      if (!isPureDiagBiopsie && !/fonctionnel/i.test(indicInitSuivi) && !indicInitSuivi.includes("À préciser")) {
        indicInitSuivi += /doul/i.test(indicInitSuivi) ? " avec retentissement fonctionnel" : " responsable de douleurs et d'un retentissement fonctionnel";
      }
      const gesteSuiviCourt = String(prof.gesteRealise || "[nom de l'intervention / niveaux traités à préciser]")
        .replace(/\s+sous\s+(?:guidage\s+|contrôle\s+)?(?:scanographique|scanner|échographique|échographie|scopique|anesthésie\s+générale|anesthésie\s+locale|AG|AL)(?:\s+et\s+sous\s+[^,.)]+)?/gi, "")
        .replace(/\s+en\s+HDJ(?:\s+radio\s*B)?/gi, "")
        .trim();

      const remOnlyAnn = extractClinicalAnnotations({ remarques: sEntry.remarques || "", suivi_cs: "", anapath: "" });
      const scsOnlyAnn = extractClinicalAnnotations({ remarques: "", suivi_cs: sEntry.suivi_cs || "", anapath: "" });

      let suitesRappelClause = "avec des suites simples";
      if (remOnlyAnn.complications.length > 0) {
        suitesRappelClause = `avec des suites marquées par ${remOnlyAnn.complications.join(", ")}`;
      } else if (prof.particularitesProcedurales) {
        suitesRappelClause = `marqué par ${prof.particularitesProcedurales}`;
      }

      const evoGlobale = ann.inferredEvoGlobale || prof.evolutionGlobale || "[favorable / défavorable / stationnaire à préciser]";
      const evoDetails = ann.clinique.length > 0
        ? ann.clinique.join(", ")
        : (prof.evolutionCliniqueDetails || "[évolution des douleurs et du retentissement fonctionnel : autonomie, mobilité, reprise des activités à préciser]");
      const compCibles = prof.complicationsCibles || "neurologique, infectieuse ou spécifique au geste";

      const compSuiviList = scsOnlyAnn.complications.length > 0 ? scsOnlyAnn.complications : remOnlyAnn.complications;
      const compSuiviClause = compSuiviList.length > 0
        ? `avec survenue de ${compSuiviList.join(", ")}`
        : `sans complication ${compCibles} intercurrente`;

      const linesSuivi = [
        "Chère Consœur, Cher Confrère,",
        "",
        `Nous avons revu en consultation de suivi ${prof.civiliteNom}, ${ageAccord} de ${prof.age} ans, ${suiviAccord} pour ${prof.terrainSuivi}, suite à la réalisation de ${gesteSuiviCourt}.`,
        "",
        `Pour rappel, ce geste avait été réalisé devant ${indicInitSuivi}, ${suitesRappelClause}.`,
        "",
        `Sur le plan clinique, ${lePatient} rapporte une évolution ${evoGlobale} au décours de la procédure, tant sur le plan des douleurs que du retentissement fonctionnel (${evoDetails}), ${compSuiviClause}.`
      ];

      if (ann.anapathNote) {
        linesSuivi.push("");
        linesSuivi.push(`Sur le plan anatomopathologique, l'analyse retrouve : ${ann.anapathNote}.`);
      }
      if (ann.recommandations.length > 0) {
        linesSuivi.push("");
        linesSuivi.push(`Pour la suite de la prise en charge, nous recommandons : ${ann.recommandations.join(" ; ")}.`);
      }

      linesSuivi.push(
        "",
        "Je vous prie de recevoir, Chère Consœur, Cher Confrère, l'assurance de mes sincères salutations.",
        "",
        "Dr T. Lefèvre"
      );
      return linesSuivi.join("\n");
    }

    function copyPatientCr(encodedMeta, mode, btnEl, clickEv, prefix = "") {
      if (clickEv) clickEv.stopPropagation();
      let meta = {};
      try {
        meta = JSON.parse(decodeURIComponent(encodedMeta));
      } catch (e) {}
      // Synchroniser immédiatement toute note en cours de saisie dans les champs ouverts de la carte avant de générer le CR
      const sKey = getSuiviKey(meta);
      const matEl = document.getElementById((prefix || "") + "mat-" + sKey);
      const remEl = document.getElementById((prefix || "") + "rem-" + sKey);
      const anaEl = document.getElementById((prefix || "") + "ana-" + sKey);
      const scsEl = document.getElementById((prefix || "") + "scs-" + sKey);
      if (matEl || remEl || anaEl || scsEl) {
        const cur = getSuiviEntry(meta);
        const domMat = matEl ? matEl.value.trim() : cur.materiel;
        const domRem = remEl ? remEl.value.trim() : cur.remarques;
        const domAna = anaEl ? anaEl.value.trim() : cur.anapath;
        const domScs = scsEl ? scsEl.value.trim() : cur.suivi_cs;
        if (domMat !== cur.materiel || domRem !== cur.remarques || domAna !== cur.anapath || domScs !== cur.suivi_cs) {
          saveSuiviFromDom(sKey, encodedMeta, prefix, false);
        }
      }
      const crText = buildPatientCrText(meta, mode);
      const doFeedback = () => {
        if (!btnEl) return;
        const origHtml = btnEl.getAttribute("data-orig-html") || btnEl.innerHTML;
        if (!btnEl.getAttribute("data-orig-html")) btnEl.setAttribute("data-orig-html", origHtml);
        btnEl.classList.add("copied");
        const copiedLbl = mode === "preop" ? "CR Pré-op copié" : (mode === "crh" ? "CRH copié" : "CR Suivi copié");
        btnEl.innerHTML = `<span>✅ ${copiedLbl}</span>`;
        setTimeout(() => {
          btnEl.classList.remove("copied");
          btnEl.innerHTML = origHtml;
        }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(crText).then(doFeedback).catch(() => {
          fallbackCopyText(crText);
          doFeedback();
        });
      } else {
        fallbackCopyText(crText);
        doFeedback();
      }
    }

    function fallbackCopyText(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (_) {}
      document.body.removeChild(ta);
    }

      if (ev) ev.stopPropagation();
      const boxEl = document.getElementById(boxDomId);
      const chevEl = document.getElementById("chev-" + boxDomId);
      if (!boxEl) return;
      const isOpen = boxEl.classList.toggle("open");
      if (isOpen) {
        openBlocNoteIds.add(boxDomId);
        if (chevEl) chevEl.textContent = "▾";
      } else {
        openBlocNoteIds.delete(boxDomId);
        if (chevEl) chevEl.textContent = "▸";
      }
    }

        return `
          <div class="event-card type-mail-rdv">
            <div class="event-top">
              <span class="event-time-badge">${showDate ? `${ev.dateStr} · ` : ""}${ev.horaire}</span>

          </div>
          ${mainLine ? `<div class="event-title">${mainLine}</div>` : ""}
          ${subLine ? `<div style="font-size:11px; color:#94A3B8; margin-top:3px;">${subLine}</div>` : ""}

    function navigatePeriod(delta) {
      if (calendarView === "day" || calendarView === "week") {
        // En mode Jour comme en mode Semaine, les flèches < et > permettent de changer de semaine (+7j / -7j) en se calant sur le lundi de la semaine
        const curMon = getMondayOf(selectedDate);
        selectedDate = new Date(curMon.getFullYear(), curMon.getMonth(), curMon.getDate() + delta * 7, 12, 0, 0);
        renderCalendar({ scrollStrip: true, alignMonday: true });
      } else {
        selectedDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth() + delta, 1, 12, 0, 0);
        renderCalendar();
      }
    }

    function goToday() {
      const now = new Date();
      selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
      switchTab("agenda");
      calendarView = "day";
      document.getElementById("view-btn-day").classList.add("active");
      document.getElementById("view-btn-week").classList.remove("active");
      document.getElementById("view-btn-month").classList.remove("active");
      renderCalendar({ scrollStrip: true, alignMonday: true });
    }

    function getMondayOf(d) {
      const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0);
      const day = dt.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      dt.setDate(dt.getDate() + diff);
      return dt;
    }

    function getShortVacTagForDay(iso, dt) {
      const g = getGardeForIso(iso);
      if (g && g.is_tl) return { lbl: "Garde", cls: "post-liberal" };
      const dow = dt.getDay();
      if (dow === 0 || dow === 6) return { lbl: "WE", cls: "post-libre" };
      const myV = getMyVacationForIso(iso);
      const firstPost = (myV.am[0] || "").toLowerCase();
      if (firstPost.includes("pitié") || firstPost.includes("pitie")) return { lbl: "Pitié", cls: "post-libre" };
      if (firstPost.includes("férié")) return { lbl: "Férié", cls: "post-libre" };
      if (firstPost.includes("libéral") || firstPost.includes("jdp")) return { lbl: "JDP/GSH", cls: "post-liberal" };
      if (firstPost.includes("masterclass")) return { lbl: "Master.", cls: "post-staff" };
      if (firstPost.includes("libre")) return { lbl: "Libre", cls: "post-libre" };
      const def = MAQUETTE_DEFAULT_DOW[dow] || { short: "Cochin", color: "post-cs" };
      return { lbl: def.short, cls: def.color };
    }

    function renderWeekStripBar(allEvents, opts) {
      const stripContainer = document.getElementById("week-strip-container");
      if (!stripContainer) return;
      if (calendarView === "month") {
        stripContainer.innerHTML = "";
        return;
      }

      const activeMon = getMondayOf(selectedDate);
      const activeMonIso = dateToIso(activeMon);

      // En mode SEMAINE : afficher les cases résumées de chaque semaine (défilables et cliquables)
      if (calendarView === "week") {
        const existingWeekScroll = document.getElementById("weeks-selector-scroll");
        const prevWeekScrollLeft = existingWeekScroll ? existingWeekScroll.scrollLeft : null;

        const startMon = new Date(2026, 9, 26, 12, 0, 0);
        const weeksList = [];
        for (let w = 0; w < 18; w++) {
          const m = new Date(startMon.getFullYear(), startMon.getMonth(), startMon.getDate() + w * 7, 12, 0, 0);
          weeksList.push(m);
        }
        if (!weeksList.some(m => dateToIso(m) === activeMonIso)) {
          weeksList.push(activeMon);
          weeksList.sort((a, b) => a.getTime() - b.getTime());
        }

        let cardsHtml = "";
        for (const mon of weeksList) {
          const monIso = dateToIso(mon);
          const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6, 12, 0, 0);
          const mLbl = mon.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }).replace(".", "");
          const sLbl = sun.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }).replace(".", "");

          let nbGestes = 0;
          let nbCs = 0;
          let hasGarde = false;
          let hasLiberal = false;
          let hasMaster = false;

          for (let d = 0; d < 7; d++) {
            const cur = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + d, 12, 0, 0);
            const iso = dateToIso(cur);
            const g = getGardeForIso(iso);
            if (g && g.is_tl) hasGarde = true;
            const myV = getMyVacationForIso(iso);
            const vTxt = [...myV.am, ...myV.pm].join(" ").toLowerCase();
            if (vTxt.includes("libéral") || vTxt.includes("jdp") || vTxt.includes("geoffroy")) hasLiberal = true;
            if (vTxt.includes("masterclass")) hasMaster = true;

            const dEvs = allEvents.filter(e => e.isoDate === iso);
            for (const ev of dEvs) {
              if (ev.category === "acte" || ev.category === "biopsie") nbGestes++;
              else if (ev.category === "cs" || ev.category === "img") nbCs++;
            }
          }

          const totalRdv = nbGestes + nbCs;
          let badges = "";
          if (nbGestes > 0) badges += `<span class="wsc-tag pill-acte">${nbGestes} Geste${nbGestes > 1 ? "s" : ""}</span>`;
          if (nbCs > 0) badges += `<span class="wsc-tag pill-cs">${nbCs} CS/Exam</span>`;
          if (hasGarde) badges += `<span class="wsc-tag pill-danger">Garde</span>`;
          if (hasLiberal) badges += `<span class="wsc-tag post-liberal">JDP/GSH</span>`;
          if (hasMaster) badges += `<span class="wsc-tag post-staff">Master.</span>`;
          if (!badges) badges = `<span class="wsc-tag post-libre">Planning std</span>`;

          const isActive = (monIso === activeMonIso);
          cardsHtml += `
            <div class="week-sel-card ${isActive ? "active" : ""} ${hasGarde ? "has-garde" : ""}" id="wsc-${monIso}" onclick="selectWeekFromSummary('${monIso}')">
              <div class="wsc-title">
                <span>${mLbl} – ${sLbl}</span>
                <span style="font-size:9.5px; color:var(--primary);">${totalRdv > 0 ? totalRdv + " RDV" : ""}</span>
              </div>
              <div class="wsc-badges">${badges}</div>
            </div>
          `;
        }
        stripContainer.innerHTML = `<div class="weeks-selector-row" id="weeks-selector-scroll">${cardsHtml}</div>`;
        const newWeekScroll = document.getElementById("weeks-selector-scroll");
        if (newWeekScroll) {
          if (prevWeekScrollLeft !== null && !(opts && opts.scrollStrip)) {
            newWeekScroll.scrollLeft = prevWeekScrollLeft;
          } else {
            const activeEl = document.getElementById("wsc-" + activeMonIso);
            if (activeEl) {
              newWeekScroll.scrollLeft = Math.max(0, activeEl.offsetLeft - (newWeekScroll.clientWidth - activeEl.offsetWidth) / 2);
            }
          }
        }
        return;
      }

      // En mode JOUR : Barre des jours défilable horizontalement (reste exactement en place au clic sur un jour)
      const existingDayScroll = document.getElementById("day-strip-scroll");
      const prevDayScrollLeft = existingDayScroll ? existingDayScroll.scrollLeft : null;

      const selIso = dateToIso(selectedDate);
      const startDay = new Date(2026, 9, 26, 12, 0, 0);
      const endDay = new Date(2027, 1, 7, 12, 0, 0);
      const minDate = selectedDate < startDay ? new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate() - 7, 12, 0, 0) : startDay;
      const maxDate = selectedDate > endDay ? new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate() + 14, 12, 0, 0) : endDay;

      let cellsHtml = "";
      const cur = new Date(minDate.getTime());
      while (cur <= maxDate) {
        const iso = dateToIso(cur);
        const g = getGardeForIso(iso);
        const evCnt = allEvents.filter(e => e.isoDate === iso).length;
        const tag = getShortVacTagForDay(iso, cur);
        const dowNum = cur.getDay();
        const isWe = (dowNum === 0 || dowNum === 6);
        const dowLbl = cur.toLocaleDateString("fr-FR", { weekday: "short" }).replace(".", "");
        const dayNum = cur.getDate();
        const monthShort = cur.toLocaleDateString("fr-FR", { month: "short" }).replace(".", "");
        const monthFull = cur.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

        cellsHtml += `
          <div class="ws-day ${isWe ? "is-weekend" : ""} ${iso === selIso ? "active" : ""} ${g && g.is_tl ? "is-garde" : ""}" id="ws-day-${iso}" data-month="${monthFull}" onclick="selectDayFromWeekStrip('${iso}')">
            <span class="ws-dow">${dowLbl}</span>
            <span class="ws-num">${dayNum}<span class="ws-mon">${monthShort}</span></span>
            <span class="ws-vac ${tag.cls}">${tag.lbl}</span>
            <span class="ws-cnt">${evCnt > 0 ? (isWe ? evCnt : evCnt + " RDV") : "·"}</span>
          </div>
        `;
        cur.setDate(cur.getDate() + 1);
      }
      const initialMonthFull = selectedDate.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
      stripContainer.innerHTML = `
        <div class="day-strip-month-header">
          <span id="day-strip-visible-month">📅 ${initialMonthFull}</span>
        </div>
        <div class="day-strip-scroll" id="day-strip-scroll" onscroll="updateDayStripVisibleMonth()">${cellsHtml}</div>
      `;
      const newDayScroll = document.getElementById("day-strip-scroll");
      if (newDayScroll) {
        if (prevDayScrollLeft !== null && !(opts && opts.scrollStrip)) {
          newDayScroll.scrollLeft = prevDayScrollLeft;
        } else {
          const targetIso = (opts && opts.alignMonday) ? activeMonIso : getMondayOf(selectedDate) ? dateToIso(getMondayOf(selectedDate)) : selIso;
          const monEl = document.getElementById("ws-day-" + targetIso) || document.getElementById("ws-day-" + selIso);
          if (monEl) {
            newDayScroll.scrollLeft = Math.max(0, monEl.offsetLeft);
          }
        }
        updateDayStripVisibleMonth();
      }
    }

    function updateDayStripVisibleMonth() {
      const sc = document.getElementById("day-strip-scroll");
      const lbl = document.getElementById("day-strip-visible-month");
      if (!sc || !lbl) return;
      const leftEdge = sc.scrollLeft + 10;
      const rightEdge = sc.scrollLeft + sc.clientWidth - 10;
      const days = sc.querySelectorAll(".ws-day");
      let firstM = "";
      let lastM = "";
      for (const d of days) {
        const dLeft = d.offsetLeft;
        const dRight = dLeft + d.offsetWidth;
        if (dRight >= leftEdge && dLeft <= rightEdge) {
          const m = d.getAttribute("data-month") || "";
          if (!firstM) firstM = m;
          lastM = m;
        }
      }
      if (firstM && lastM) {
        lbl.textContent = firstM === lastM ? `📅 ${firstM}` : `📅 ${firstM} – ${lastM}`;
      }
    }

    function selectWeekFromSummary(monIso) {
      const [y, m, d] = monIso.split("-").map(Number);
      selectedDate = new Date(y, m - 1, d, 12, 0, 0);
      renderCalendar({ scrollStrip: false });
    }

    function selectDayFromWeekStrip(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      selectedDate = new Date(y, m - 1, d, 12, 0, 0);
      renderCalendar({ scrollStrip: false });
    }

    function renderCalendar(opts) {
      renderMyGardesStrip();
      const container = document.getElementById("calendar-container");
      const titleEl = document.getElementById("period-title");
      const subEl = document.getElementById("period-sub");
      const allEvents = filterEventsByScope(getAllTimedEvents());
      const isGeneral = (agendaScope === "all");

      renderWeekStripBar(allEvents, opts);

      if (calendarView === "day") {
        const iso = dateToIso(selectedDate);
        titleEl.textContent = selectedDate.toLocaleDateString("fr-FR", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });
        const myVac = getMyVacationForIso(iso);
        if (myVac.note) {
          subEl.textContent = myVac.note;
          subEl.style.display = "block";
        } else {
          subEl.textContent = "";
          subEl.style.display = "none";
        }

        const genVac = getGeneralPlanningForIso(iso);
        const dayEvents = allEvents.filter(e => e.isoDate === iso);

        let html = `
          ${renderGardeBannerHtml(iso)}
          <div class="vac-grid">
            <div class="vac-card">
              <div class="vac-period">Matin</div>
              <div class="post-pills">${renderPostPills(isGeneral ? genVac.am : myVac.am, isGeneral)}</div>
            </div>
            <div class="vac-card">
              <div class="vac-period">Après-midi</div>
              <div class="post-pills">${renderPostPills(isGeneral ? genVac.pm : myVac.pm, isGeneral)}</div>
            </div>
          </div>
          <div class="section-label">
            <span>${isGeneral ? "Patients du service" : "Patients & RDV"} (${dayEvents.length})</span>
          </div>
        `;

        html += dayEvents.length === 0
          ? `<div class="empty-state">${myVac.offCochin && !isGeneral ? "Journée hors Cochin." : "Aucun RDV programmé sur ce créneau."}</div>`
          : dayEvents.map(ev => renderEventCard(ev, false)).join("");

        container.innerHTML = html;

      } else if (calendarView === "week") {
        const mon = getMondayOf(selectedDate);
        const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6, 12, 0, 0);
        titleEl.textContent = `Semaine du ${mon.getDate()}/${mon.getMonth() + 1} au ${sun.getDate()}/${sun.getMonth() + 1}/${sun.getFullYear()}`;
        subEl.textContent = "";
        subEl.style.display = "none";

        let html = "";

        for (let i = 0; i < 7; i++) {
          const cur = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i, 12, 0, 0);
          const iso = dateToIso(cur);
          const myVac = getMyVacationForIso(iso);
          const genVac = getGeneralPlanningForIso(iso);
          const g = getGardeForIso(iso);
          const dayEvs = allEvents.filter(e => e.isoDate === iso);
          const dayName = cur.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "short" });
          const isWeekend = (cur.getDay() === 0 || cur.getDay() === 6);

          if (isWeekend && !isGeneral && !(g && g.is_tl) && dayEvs.length === 0) {
            continue;
          }

          const gardeBadge = g && g.is_tl
            ? `<span class="pill pill-danger">DE GARDE</span>`
            : (isGeneral && g && g.noms && g.noms.length ? `<span class="pill pill-cs">Garde : ${g.noms.join("/")}</span>` : `<span class="pill pill-cs">${dayEvs.length} RDV</span>`);

          html += `
            <div class="week-day-card" style="${g && g.is_tl ? "border-color:#EF4444;background:rgba(239,68,68,0.08);" : ""}">
              <div class="week-day-header" onclick="selectDayFromCalendar('${iso}')">
                <span class="week-day-name">${dayName}</span>
                ${gardeBadge}
              </div>
              ${!isWeekend ? `
                <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px; margin-bottom:${dayEvs.length ? "8px" : "0"};">
                  <div><div style="font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:3px;">Matin</div>${renderPostPills(isGeneral ? genVac.am : myVac.am, isGeneral)}</div>
                  <div><div style="font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:3px;">Après-midi</div>${renderPostPills(isGeneral ? genVac.pm : myVac.pm, isGeneral)}</div>
                </div>
              ` : ""}
              ${dayEvs.map(ev => renderEventCard(ev, false)).join("")}
            </div>
          `;
        }
        container.innerHTML = html;

      } else {
        const year = selectedDate.getFullYear();
        const month = selectedDate.getMonth();
        titleEl.textContent = new Date(year, month, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
        subEl.textContent = "";
        subEl.style.display = "none";

        const firstDay = new Date(year, month, 1, 12, 0, 0);
        const startOffset = (firstDay.getDay() + 6) % 7;
        const gridStart = new Date(year, month, 1 - startOffset, 12, 0, 0);

        let html = `
          <div class="month-grid-header">
            <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
          </div>
          <div class="month-grid">
        `;

        const selectedIso = dateToIso(selectedDate);

        for (let i = 0; i < 42; i++) {
          const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i, 12, 0, 0);
          const iso = dateToIso(cellDate);
          const isOtherMonth = cellDate.getMonth() !== month;
          const evs = allEvents.filter(e => e.isoDate === iso);
          const g = getGardeForIso(iso);
          const dow = cellDate.getDay();

          let tagHtml = "";
          let deskVacsHtml = "";
          if (g && g.is_tl) {
            tagHtml = `<div class="month-vac-tag" style="background:rgba(220,38,38,0.35);color:#FCA5A5;">GARDE</div>`;
          } else if (isGeneral && g && g.noms && g.noms.length && (dow === 0 || dow === 6)) {
            tagHtml = `<div class="month-vac-tag" style="background:rgba(59,130,246,0.2);color:#93C5FD;">${g.noms[0].slice(0, 6)}</div>`;
          } else if (dow >= 1 && dow <= 5 && cellDate >= new Date(2026, 10, 2)) {
            const myV = getMyVacationForIso(iso);
            const firstPost = (myV.am[0] || "").toLowerCase();
            if (firstPost.includes("férié")) {
              tagHtml = `<div class="month-vac-tag post-libre">Férié</div>`;
            } else if (firstPost.includes("libéral") || firstPost.includes("jdp")) {
              tagHtml = `<div class="month-vac-tag post-liberal">JDP/GSH</div>`;
            } else if (firstPost.includes("masterclass")) {
              tagHtml = `<div class="month-vac-tag post-staff">OsteoCool</div>`;
            } else {
              const def = MAQUETTE_DEFAULT_DOW[dow];
              tagHtml = `<div class="month-vac-tag ${def.color}">${def.short}</div>`;
            }
          }

          if (dow >= 1 && dow <= 5 && cellDate >= new Date(2026, 9, 26)) {
            const myV = getMyVacationForIso(iso);
            const amStr = (myV.am || []).join(" / ").replace(/\s*\(.*?\)/g, "");
            const pmStr = (myV.pm || []).join(" / ").replace(/\s*\(.*?\)/g, "");
            const amCls = postColorClass(myV.am[0] || "");
            const pmCls = postColorClass(myV.pm[0] || "");
            if (amStr === pmStr && amStr) {
              deskVacsHtml = `<div class="month-desk-vacs"><div class="month-desk-vac-line ${amCls}">${amStr}</div></div>`;
            } else {
              deskVacsHtml = `
                <div class="month-desk-vacs">
                  ${amStr ? `<div class="month-desk-vac-line ${amCls}">M : ${amStr}</div>` : ""}
                  ${pmStr ? `<div class="month-desk-vac-line ${pmCls}">AP : ${pmStr}</div>` : ""}
                </div>
              `;
            }
          } else if (isGeneral && g && g.noms && g.noms.length) {
            deskVacsHtml = `<div class="month-desk-vacs"><div class="month-desk-vac-line post-sau">Garde : ${g.noms.join("/")}</div></div>`;
          }

          const deskCntHtml = (g && g.is_tl)
            ? `<span class="month-desk-cnt" style="background:rgba(239,68,68,0.28);color:#FCA5A5;">GARDE</span>`
            : (evs.length > 0 ? `<span class="month-desk-cnt">${evs.length} RDV</span>` : "");

          const deskEvsHtml = evs.length > 0
            ? `<div class="month-desk-evs">
                ${evs.slice(0, 3).map(e => {
                  const pLabel = e.category === "mail-rdv" ? e.title : String(e.patient || "").replace(/^(Mme|M\.|Mr|Mlle)\s+/i, "");
                  const hShort = String(e.horaire || "").replace(":00", "h").replace("h00", "h");
                  return `<div class="month-desk-ev type-${e.category}"><strong>${hShort}</strong> ${pLabel}</div>`;
                }).join("")}
                ${evs.length > 3 ? `<div class="month-desk-more">+${evs.length - 3} autre${evs.length - 3 > 1 ? "s" : ""}</div>` : ""}
              </div>`
            : "";

          const dotsHtml = evs.slice(0, 6).map(e => `<span class="m-dot ${e.category}"></span>`).join("");

          html += `
            <div class="month-cell ${isOtherMonth ? "other-month" : ""} ${iso === selectedIso ? "selected" : ""} ${g && g.is_tl ? "is-tl-garde" : ""}" onclick="selectDayFromMonth('${iso}')">
              <div class="month-cell-top">
                <div class="month-day-num">${cellDate.getDate()}</div>
                ${deskCntHtml}
              </div>
              ${tagHtml}
              ${deskVacsHtml}
              ${deskEvsHtml}
              <div class="month-dots">${dotsHtml}</div>
            </div>
          `;
        }
        html += `</div>`;

        const selEvs = allEvents.filter(e => e.isoDate === selectedIso);
        const selMyVac = getMyVacationForIso(selectedIso);
        const selGenVac = getGeneralPlanningForIso(selectedIso);
        const selTitle = selectedDate.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
        html += `
          <div class="section-label" style="margin-top:12px;">
            <span>${selTitle} (${selEvs.length} RDV)</span>
          </div>
          ${renderGardeBannerHtml(selectedIso)}
          <div class="vac-grid">
            <div class="vac-card"><div class="vac-period">Matin</div><div class="post-pills">${renderPostPills(isGeneral ? selGenVac.am : selMyVac.am, isGeneral)}</div></div>
            <div class="vac-card"><div class="vac-period">Après-midi</div><div class="post-pills">${renderPostPills(isGeneral ? selGenVac.pm : selMyVac.pm, isGeneral)}</div></div>
          </div>
          ${selEvs.map(ev => renderEventCard(ev, false)).join("")}
        `;
        container.innerHTML = html;
      }
    }

    function selectDayFromCalendar(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      selectedDate = new Date(y, m - 1, d, 12, 0, 0);
      setCalendarView("day");
    }

    function selectDayFromMonth(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      selectedDate = new Date(y, m - 1, d, 12, 0, 0);
      renderCalendar();
    }

    // ONGLET FUSIONNÉ : ACTIVITÉ (ACTES, BIOPSIES & CONSULTATIONS DE TL OU DU SERVICE)
    let activiteScope = "mine";
    let activiteMode = "acte";
    let activiteSub = "upcoming";

    function openActiviteView(mode, sub) {
      activiteMode = mode;
      activiteSub = sub || "upcoming";
      switchTab("activite");
      syncActiviteControls();
      renderActiviteTab();
    }

    function setActiviteScope(sc) {
      activiteScope = sc;
      agendaScope = sc;
      const agMine = document.getElementById("scope-btn-mine");
      const agAll = document.getElementById("scope-btn-all");
      if (agMine) agMine.classList.toggle("scope-active", sc === "mine");
      if (agAll) agAll.classList.toggle("scope-active", sc === "all");
      updateKpis();
      syncActiviteControls();
      renderActiviteTab();
    }

    function setActiviteMode(mode) {
      activiteMode = mode;
      activiteSub = "upcoming";
      syncActiviteControls();
      renderActiviteTab();
    }

    function setActiviteSub(sub) {
      activiteSub = sub;
      renderActiviteTab();
    }

    function syncActiviteControls() {
      const btnMine = document.getElementById("act-scope-mine");
      const btnAll = document.getElementById("act-scope-all");
      if (btnMine) btnMine.classList.toggle("scope-active", activiteScope === "mine");
      if (btnAll) btnAll.classList.toggle("scope-active", activiteScope === "all");

      const modeBar = document.getElementById("activite-mode-bar");
      if (modeBar) {
        modeBar.style.display = "none";
      }
    }

    function getWeekLabelForIso(isoDate) {
      if (!isoDate) return "Date à définir";
      const [y, m, d] = isoDate.split("-").map(Number);
      const dt = new Date(y, m - 1, d, 12, 0, 0);
      const mon = getMondayOf(dt);
      const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6, 12, 0, 0);
      const mStr = mon.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
      const sStr = sun.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
      return `Semaine du ${mStr} au ${sStr}`;
    }

    function renderActiviteTab() {
      syncActiviteControls();
      const subEl = document.getElementById("activite-subchips");
      const container = document.getElementById("activite-list-container");
      const todayIso = dateToIso(new Date());

      if (!["upcoming", "done", "todo"].includes(activiteSub)) activiteSub = "upcoming";
      const doneLbl = activiteMode === "acte" ? "Réalisés" : "Réalisées";
      subEl.style.display = "flex";
      subEl.innerHTML = `
        <button class="chip ${activiteSub === "upcoming" ? "active" : ""}" onclick="setActiviteSub('upcoming')">À venir</button>
        <button class="chip ${activiteSub === "done" ? "active" : ""}" onclick="setActiviteSub('done')">${doneLbl}</button>
        <button class="chip ${activiteSub === "todo" ? "active" : ""}" onclick="setActiviteSub('todo')">À planifier</button>
      `;

      if (activiteSub === "todo") {
        let todoPatients = (appData.Data || []).filter(p => {
          const st = String(p["Statut"] || "").toLowerCase();
          if (!st.includes("planifier") && !st.includes("irm")) return false;
          const interv = String(p["Type d'Intervention / Suivi"] || "");
          const ech = String(p["Échéance / Rendez-vous"] || "");
          const combined = interv + " " + ech;
          if (activiteMode === "biopsie") {
            return /biopsie/i.test(combined);
          } else if (activiteMode === "cs") {
            const clean = combined.replace(/cs\s+anesth\w*/gi, "");
            return /(télé)?consultation|\bcs\b/i.test(clean);
          } else {
            if (/biopsie/i.test(combined)) return false;
            return /radiofréquence|\brf\b|cryo|cimento|alcoolisation|vissage|embolisation|reprise|traitement|infiltration|test\s+anesth/i.test(combined);
          }
        });
        if (activiteScope === "mine") {
          todoPatients = todoPatients.filter(p => {
            const ref = String(p["Médecin Référent"] || "").toLowerCase();
            return ref.includes("lefevre") || ref.includes("lefèvre") || /\btl\b/.test(ref);
          });
        }
        const emptyTodoLbl =
          activiteMode === "biopsie" ? "Aucune biopsie à planifier." :
          activiteMode === "cs" ? "Aucune consultation à planifier." :
          "Aucun acte à planifier.";
        container.innerHTML = todoPatients.length
          ? todoPatients.map(p => renderMasterPatientCard(p)).join("")
          : `<div class="empty-state">${emptyTodoLbl}</div>`;
        return;
      }

      let evs = getAllTimedEvents().filter(e => e.category === activiteMode);
      if (activiteScope === "mine") {
        evs = evs.filter(e => e.isMine);
      }

      if (activiteSub === "upcoming") {
        evs = evs.filter(e => Boolean(e.isoDate && e.isoDate >= todayIso));
      } else if (activiteSub === "done") {
        evs = evs.filter(e => Boolean(e.isoDate && e.isoDate < todayIso));
      }

      if (evs.length === 0) {
        container.innerHTML = `<div class="empty-state">${activiteScope === "mine" ? "Aucun patient sur vos vacations dans cette catégorie." : "Aucun élément dans cette catégorie."}</div>`;
        return;
      }

      const groups = [];
      let currentLabel = null;
      let currentBucket = null;
      for (const ev of evs) {
        const lbl = getWeekLabelForIso(ev.isoDate);
        if (lbl !== currentLabel) {
          currentLabel = lbl;
          currentBucket = { label: lbl, items: [] };
          groups.push(currentBucket);
        }
        currentBucket.items.push(ev);
      }

      container.innerHTML = groups.map(g => `
        <div class="week-group-header">
          <span>${g.label}</span>
          <span class="pill pill-cs">${g.items.length} patient${g.items.length > 1 ? "s" : ""}</span>
        </div>
        ${g.items.map(ev => renderEventCard(ev, true)).join("")}
      `).join("");
    }

    // DEMANDES D'AVIS (SERVICE)
    function setAvisFilter(flt) {
      avisFilter = flt;
      document.getElementById("flt-avis-all").classList.toggle("active", flt === "all");
      document.getElementById("flt-avis-non").classList.toggle("active", flt === "Non répondu");
      document.getElementById("flt-avis-oui").classList.toggle("active", flt === "Répondu");
      renderAvisTab();
    }

    function renderAvisTab() {

    function formatDayGroupLabel(isoDate) {
      if (!isoDate) return "Date à définir";
      const [y, m, d] = isoDate.split("-").map(Number);
      const dt = new Date(y, m - 1, d, 12, 0, 0);
      const raw = dt.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      return raw.charAt(0).toUpperCase() + raw.slice(1);
    }

    function renderSuiviTab() {
      const container = document.getElementById("suivi-list-container");
      if (!container) return;
      const q = ((document.getElementById("suivi-search") || {}).value || "").toLowerCase().trim();
      const todayIso = dateToIso(new Date());
      const allTimed = getAllTimedEvents();

      let evs = [];
      if (suiviFilter === "cs_suivi") {
        // CS de suivi des patients traités par Dr T. Lefèvre (ou CS de suivi explicitement rattachée à un patient traité)
        const myGestesByPat = {};
        for (const g of allTimed) {
          if ((g.category === "acte" || g.category === "biopsie") && g.isMine && g.isoDate) {
            const pNorm = normName(g.patient);
            if (pNorm && (!myGestesByPat[pNorm] || g.isoDate < myGestesByPat[pNorm])) {
              myGestesByPat[pNorm] = g.isoDate;
            }
          }
        }
        evs = allTimed.filter(e => {
          if (e.category !== "cs") return false;
          const pNorm = normName(e.patient);
          const gesteIso = myGestesByPat[pNorm];
          if (gesteIso && e.isoDate && e.isoDate > gesteIso) return true;
          if (e.isMine && String(e.catActe || "").toLowerCase().includes("cs de suivi")) return true;
          return false;
        });
      } else {
        evs = allTimed.filter(e => (e.category === "acte" || e.category === "biopsie") && e.isMine);
        if (suiviFilter === "done") {
          // Strictement basé sur la date : un patient ne peut être dans Traités que si la date du bloc est arrivée ou passée
          evs = evs.filter(e => Boolean(e.isoDate && e.isoDate <= todayIso));
        } else if (suiviFilter === "upcoming") {
          evs = evs.filter(e => !e.isoDate || e.isoDate > todayIso);
        }
      }

      if (q) {
        evs = evs.filter(e => {
          const entry = getSuiviEntry(e);
          const hay = `${e.patient} ${e.ipp} ${e.title} ${e.remarques} ${entry.materiel} ${entry.remarques} ${entry.anapath} ${entry.suivi_cs}`.toLowerCase();
          return hay.includes(q);
        });
      }

      if (evs.length === 0) {
        const emptyMsg =
          suiviFilter === "done" ? "Aucun patient traité à ce jour." :
          suiviFilter === "cs_suivi" ? "Aucune CS de suivi programmée pour vos patients traités." :
          "Aucun geste programmé à venir.";
        container.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
        return;
      }

      // Regroupement avec distinction claire par jour
      const dayGroups = [];
      let curDayIso = null;
      let curBucket = null;
      for (const ev of evs) {
        const dKey = ev.isoDate || "nodate";
        if (dKey !== curDayIso) {
          curDayIso = dKey;
          curBucket = { iso: ev.isoDate, label: formatDayGroupLabel(ev.isoDate), items: [] };
          dayGroups.push(curBucket);
        }
        curBucket.items.push(ev);
      }

      const unitWord = suiviFilter === "cs_suivi" ? "CS" : "geste";
      container.innerHTML = dayGroups.map(g => `
        <div class="week-group-header">
          <span>📅 ${g.label}</span>
          <span class="pill pill-cs">${g.items.length} ${unitWord}${g.items.length > 1 && unitWord === "geste" ? "s" : ""}</span>
        </div>
        ${g.items.map(ev => renderEventCard(ev, false, true)).join("")}
      `).join("");
    }

            const parsed = JSON.parse(cached);
            if (parsed.data) applySheetData(parsed.data, parsed.synced_at);
          } catch (e) {}
        }
        syncFromCloud(false);
      }
    });
  </script>
</body>
